<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Drop: Versus</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&display=swap');
        
        * { box-sizing: border-box; touch-action: none; user-select: none; }
        body { 
            margin: 0; padding: 0; 
            background: radial-gradient(circle at center, #1a1a2e 0%, #050510 100%);
            color: #fff; font-family: 'Teko', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }

        #game-container {
            display: flex; gap: 40px; justify-content: center; align-items: stretch;
            width: 100%; max-width: 900px; position: relative;
        }

        .player-board {
            display: flex; flex-direction: column; align-items: center;
            background: rgba(0,0,0,0.5); padding: 20px;
            border-radius: 10px; border: 2px solid;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        #board-p1 { border-color: #00f3ff; box-shadow: 0 0 20px rgba(0,243,255,0.2); }
        #board-p2 { border-color: #ff0055; box-shadow: 0 0 20px rgba(255,0,85,0.2); }

        .board-header { font-size: 28px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; width: 100%; }
        .score-val { font-size: 32px; }
        
        .p1-color { color: #00f3ff; text-shadow: 0 0 10px #00f3ff; }
        .p2-color { color: #ff0055; text-shadow: 0 0 10px #ff0055; }

        canvas {
            background: #000; border: 1px solid #333;
        }

        .controls-hint {
            font-size: 16px; color: #888; margin-top: 15px; text-align: center; line-height: 1.2;
        }

        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5,5,16,0.9); z-index: 20;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }
        .modal.hidden { display: none !important; }
        
        h1 { font-size: 64px; margin: 0 0 10px; text-shadow: 0 0 20px #fff; }
        p { font-size: 20px; margin-bottom: 30px; color: #ccc; max-width: 500px; line-height: 1.4; }
        
        .btn {
            background: transparent; border: 2px solid #fff; color: #fff;
            padding: 10px 40px; font-family: inherit; font-size: 28px; font-weight: 700;
            cursor: pointer; border-radius: 5px; transition: 0.2s;
        }
        .btn:hover { background: #fff; color: #000; }
        
        #vs-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 48px; font-weight: 700; font-style: italic; color: #ffcc00; text-shadow: 0 0 20px #ffcc00;
            z-index: 5; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        
        <div class="player-board" id="board-p1">
            <div class="board-header p1-color">
                <span>P1</span>
                <span class="score-val" id="score-1">0</span>
            </div>
            <canvas id="canvas-1" width="250" height="500"></canvas>
            <div class="controls-hint">WASD to Move/Rotate</div>
        </div>
        
        <div id="vs-text">VS</div>

        <div class="player-board" id="board-p2">
            <div class="board-header p2-color">
                <span>P2</span>
                <span class="score-val" id="score-2">0</span>
            </div>
            <canvas id="canvas-2" width="250" height="500"></canvas>
            <div class="controls-hint">ARROWS to Move/Rotate</div>
        </div>

        <div class="modal" id="start-modal">
            <h1 style="color:#00f3ff;">BLOCK BATTLE</h1>
            <p>Clear multiple lines at once to send Garbage Lines to your opponent!<br>Last player standing wins.</p>
            <button class="btn" id="start-btn">FIGHT</button>
        </div>

        <div class="modal hidden" id="game-over-modal">
            <h1 id="winner-text">P1 WINS!</h1>
            <p>What a match!</p>
            <button class="btn" id="restart-btn">REMATCH</button>
        </div>
    </div>

    <script>
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 25;

        // Colors for shapes (Tetromino standard colors)
        const COLORS = [
            null,
            '#00ffff', // I - Cyan
            '#0000ff', // J - Blue
            '#ff7f00', // L - Orange
            '#ffff00', // O - Yellow
            '#00ff00', // S - Green
            '#800080', // T - Purple
            '#ff0000', // Z - Red
            '#555555'  // 8 - Garbage (Gray)
        ];

        const SHAPES = [
            [],
            [[1,1,1,1]], // I
            [[2,0,0],[2,2,2]], // J
            [[0,0,3],[3,3,3]], // L
            [[4,4],[4,4]], // O
            [[0,5,5],[5,5,0]], // S
            [[0,6,0],[6,6,6]], // T
            [[7,7,0],[0,7,7]]  // Z
        ];

        class Player {
            constructor(canvasId, scoreId, id) {
                this.id = id;
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.scoreEl = document.getElementById(scoreId);
                this.reset();
            }

            reset() {
                this.grid = Array(ROWS).fill().map(() => Array(COLS).fill(0));
                this.score = 0;
                this.lines = 0;
                this.dropCounter = 0;
                this.dropInterval = 800;
                this.fastDrop = false;
                this.dead = false;
                this.garbageQueue = 0;
                this.scoreEl.textContent = '0';
                this.newPiece();
            }

            newPiece() {
                let typeId = Math.floor(Math.random() * 7) + 1;
                this.piece = {
                    matrix: SHAPES[typeId].map(row => [...row]), // deep copy
                    x: Math.floor(COLS/2) - Math.floor(SHAPES[typeId][0].length/2),
                    y: 0
                };
                if (this.collide()) {
                    this.dead = true;
                }
            }

            collide() {
                let m = this.piece.matrix;
                for(let r=0; r<m.length; r++) {
                    for(let c=0; c<m[r].length; c++) {
                        if (m[r][c] !== 0) {
                            let nx = this.piece.x + c;
                            let ny = this.piece.y + r;
                            if (nx < 0 || nx >= COLS || ny >= ROWS || (ny >= 0 && this.grid[ny][nx] !== 0)) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            merge() {
                let m = this.piece.matrix;
                for(let r=0; r<m.length; r++) {
                    for(let c=0; c<m[r].length; c++) {
                        if (m[r][c] !== 0 && this.piece.y + r >= 0) {
                            this.grid[this.piece.y + r][this.piece.x + c] = m[r][c];
                        }
                    }
                }
            }

            rotate() {
                let orig = this.piece.matrix;
                let rotated = orig[0].map((_, colIndex) => orig.map(row => row[colIndex])).map(row => row.reverse());
                let origX = this.piece.x;
                this.piece.matrix = rotated;
                if (this.collide()) {
                    this.piece.x++;
                    if (this.collide()) {
                        this.piece.x -= 2;
                        if(this.collide()) {
                            this.piece.x = origX;
                            this.piece.matrix = orig;
                        }
                    }
                }
            }

            move(dir) {
                this.piece.x += dir;
                if (this.collide()) this.piece.x -= dir;
            }

            drop() {
                this.piece.y++;
                if (this.collide()) {
                    this.piece.y--;
                    this.merge();
                    this.clearLines();
                    this.addGarbage();
                    if (!this.dead) this.newPiece();
                }
                this.dropCounter = 0;
            }

            clearLines() {
                let linesCleared = 0;
                for(let r=ROWS-1; r>=0; r--) {
                    if (this.grid[r].every(val => val !== 0 && val !== 8)) { // Can't clear full garbage lines natively but we will just check if full. Wait, if it's full, they clear it.
                        // Actually let them clear garbage if they fill the gap.
                    }
                    if (this.grid[r].every(val => val !== 0)) {
                        this.grid.splice(r, 1);
                        this.grid.unshift(Array(COLS).fill(0));
                        linesCleared++;
                        r++;
                    }
                }
                if (linesCleared > 0) {
                    this.score += [0, 40, 100, 300, 1200][linesCleared];
                    this.lines += linesCleared;
                    this.scoreEl.textContent = this.score;
                    this.dropInterval = Math.max(150, 800 - Math.floor(this.lines/5)*50);
                    
                    // Send garbage to opponent
                    if (linesCleared > 1) {
                        let sent = [0, 0, 1, 2, 4][linesCleared];
                        let opponent = this.id === 1 ? p2 : p1;
                        opponent.garbageQueue += sent;
                    }
                }
            }

            addGarbage() {
                while(this.garbageQueue > 0) {
                    this.grid.shift(); // remove top row
                    let hole = Math.floor(Math.random() * COLS);
                    let newRow = Array(COLS).fill(8);
                    newRow[hole] = 0;
                    this.grid.push(newRow);
                    this.garbageQueue--;
                }
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw grid lines
                this.ctx.strokeStyle = '#222';
                this.ctx.lineWidth = 1;
                for(let r=0; r<ROWS; r++) {
                    for(let c=0; c<COLS; c++) {
                        this.ctx.strokeRect(c*BLOCK_SIZE, r*BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                    }
                }

                // Draw settled blocks
                for(let r=0; r<ROWS; r++) {
                    for(let c=0; c<COLS; c++) {
                        if (this.grid[r][c] !== 0) {
                            this.ctx.fillStyle = COLORS[this.grid[r][c]];
                            this.ctx.fillRect(c*BLOCK_SIZE+1, r*BLOCK_SIZE+1, BLOCK_SIZE-2, BLOCK_SIZE-2);
                        }
                    }
                }

                // Draw active piece
                if (this.piece) {
                    let m = this.piece.matrix;
                    for(let r=0; r<m.length; r++) {
                        for(let c=0; c<m[r].length; c++) {
                            if (m[r][c] !== 0) {
                                this.ctx.fillStyle = COLORS[m[r][c]];
                                this.ctx.fillRect((this.piece.x + c)*BLOCK_SIZE+1, (this.piece.y + r)*BLOCK_SIZE+1, BLOCK_SIZE-2, BLOCK_SIZE-2);
                                // highlight edge
                                this.ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                                this.ctx.strokeRect((this.piece.x + c)*BLOCK_SIZE+1, (this.piece.y + r)*BLOCK_SIZE+1, BLOCK_SIZE-2, BLOCK_SIZE-2);
                            }
                        }
                    }
                }
            }

            update(dt) {
                if (this.dead) return;
                this.dropCounter += dt;
                let currentDropInterval = this.fastDrop ? 40 : this.dropInterval;
                if (this.dropCounter > currentDropInterval) {
                    this.drop();
                }
            }
        }

        let p1 = new Player('canvas-1', 'score-1', 1);
        let p2 = new Player('canvas-2', 'score-2', 2);
        
        let isRunning = false;
        let lastTime = 0;

        function gameLoop(time) {
            if (!isRunning) return;
            const dt = time - lastTime;
            lastTime = time;

            p1.update(dt);
            p2.update(dt);

            p1.draw();
            p2.draw();

            if (p1.dead || p2.dead) {
                endGame();
                return;
            }

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            document.getElementById('start-modal').classList.add('hidden');
            document.getElementById('game-over-modal').classList.add('hidden');
            p1.reset();
            p2.reset();
            isRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            isRunning = false;
            let wt = document.getElementById('winner-text');
            if (p1.dead && p2.dead) { wt.textContent = "DRAW!"; wt.style.color = "#fff"; }
            else if (p1.dead) { wt.textContent = "P2 WINS!"; wt.style.color = "#ff0055"; }
            else { wt.textContent = "P1 WINS!"; wt.style.color = "#00f3ff"; }
            document.getElementById('game-over-modal').classList.remove('hidden');
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        document.addEventListener('keydown', e => {
            if (!isRunning) return;
            
            // P1
            if (e.code === 'KeyA') p1.move(-1);
            if (e.code === 'KeyD') p1.move(1);
            if (e.code === 'KeyW') p1.rotate();
            if (e.code === 'KeyS') p1.fastDrop = true;
            
            // P2
            if (e.code === 'ArrowLeft') p2.move(-1);
            if (e.code === 'ArrowRight') p2.move(1);
            if (e.code === 'ArrowUp') p2.rotate();
            if (e.code === 'ArrowDown') p2.fastDrop = true;
        });

        document.addEventListener('keyup', e => {
            if (e.code === 'KeyS') p1.fastDrop = false;
            if (e.code === 'ArrowDown') p2.fastDrop = false;
        });

        // Initial draw
        p1.draw();
        p2.draw();
    </script>
</body>
</html>
