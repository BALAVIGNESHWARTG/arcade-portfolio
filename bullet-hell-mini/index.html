<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Danmaku (Bullet Hell)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #020005;
            --player-color: #00f3ff;
            --player-core: #fff;
            --boss-color: #ff00ff;
            --bullet-enemy: #ff3366;
            --bullet-player: #39ff14;
            --text-color: #fff;
            --ui-bg: rgba(0, 0, 0, 0.85);
            --border-color: #00f3ff;
        }

        * { box-sizing: border-box; touch-action: none; }
        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Press Start 2P', monospace; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        #game-container {
            position: relative; border: 2px solid var(--border-color);
            box-shadow: 0 0 20px var(--border-color);
            background-color: var(--bg-color);
            overflow: hidden;
        }
        canvas { display: block; }

        #ui-layer {
            position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;
            display:flex; flex-direction:column; justify-content:space-between; padding:15px;
        }
        .hud { display: flex; justify-content: space-between; text-shadow: 0 0 5px var(--text-color); font-size: 14px; z-index: 10; }
        .boss-bar-container { width: 100%; height: 10px; background: #222; border: 1px solid var(--boss-color); margin-top: 10px; border-radius: 5px; overflow: hidden; }
        #boss-hp-fill { height: 100%; width: 100%; background: var(--boss-color); box-shadow: 0 0 10px var(--boss-color); transition: width 0.1s; }

        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: var(--ui-bg); border: 2px solid var(--border-color); padding: 30px;
            text-align: center; pointer-events: auto; box-shadow: 0 0 30px rgba(0,243,255,0.3); z-index: 20; width: 80%; max-width: 450px;
        }
        h1 { color: var(--player-color); text-shadow: 0 0 10px var(--player-color); margin-bottom: 20px; font-size: 20px; line-height: 1.5; }
        p { margin-bottom: 20px; font-size: 10px; color: #ccc; line-height: 1.6; }
        button {
            background: transparent; color: var(--player-color); border: 2px solid var(--player-color);
            padding: 12px 24px; font-family: 'Press Start 2P', monospace; font-size: 14px; cursor: pointer;
            text-shadow: 0 0 10px var(--player-color); box-shadow: 0 0 10px var(--player-color); transition: all 0.2s; text-transform: uppercase;
        }
        button:hover { background: var(--player-color); color: #000; box-shadow: 0 0 30px var(--player-color); }
        .hidden { display: none !important; }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px; pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="800"></canvas>
        <div id="ui-layer">
            <div class="hud">
                <span id="scoreEl">SCORE: 0</span>
                <span id="livesEl">LIVES: 3</span>
            </div>
            <div class="boss-bar-container">
                <div id="boss-hp-fill"></div>
            </div>
        </div>
        <div id="start-screen" class="modal">
            <h1>NEON DANMAKU</h1>
            <p>DODGE THE BULLET HELL.<br><br>DRAG/TOUCH OR USE ARROW KEYS TO MOVE. AUTO-FIRE ENABLED.<br><br>YOUR HITBOX IS THE WHITE DOT IN THE CENTER.</p>
            <button id="start-btn">INITIATE COMBAT</button>
        </div>
        <div id="game-over-screen" class="modal hidden">
            <h1 id="end-title" style="color: #ff3366; text-shadow: 0 0 10px #ff3366;">DESTROYED</h1>
            <p id="final-score">FINAL SCORE: 0</p>
            <button id="restart-btn">REBOOT</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('game-container');
        
        let isGameRunning = false;
        let score = 0, lives = 3;
        let frameCount = 0;

        // Player (Tiny Hitbox)
        let player = { x: 300, y: 700, hitRadius: 2, drawRadius: 10, speed: 5, invuln: 0 };
        let mouseX = 300, mouseY = 700;
        let usingMouse = false;
        let keys = {};

        // Boss
        let boss = { x: 300, y: 150, radius: 30, maxHp: 5000, hp: 5000, phase: 1, timer: 0 };
        
        let enemyBullets = [];
        let playerBullets = [];
        let particles = [];
        let stars = [];

        // Setup
        function resize() {
            const ratio = 600/800; // Portrait mode for bullet hell
            const h = Math.min(window.innerHeight - 20, 800);
            const w = Math.min(window.innerWidth - 20, h * ratio);
            canvas.style.width = `${w}px`;
            canvas.style.height = `${w}px / ${ratio}`;
            gameContainer.style.width = `${w}px`;
            gameContainer.style.height = `${w}px / ${ratio}`;
        }
        window.addEventListener('resize', resize); resize();

        for(let i=0; i<100; i++) {
            stars.push({ x: Math.random()*600, y: Math.random()*800, speed: 1 + Math.random()*3 });
        }

        function createParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                    life: 1, color
                });
            }
        }

        function fireBossPattern() {
            boss.timer++;
            
            // Phase 1: Spiral
            if (boss.phase === 1) {
                if (boss.timer % 3 === 0) {
                    let angle = boss.timer * 0.2;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(angle)*4, vy: Math.sin(angle)*4, radius: 4 });
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(angle+Math.PI)*4, vy: Math.sin(angle+Math.PI)*4, radius: 4 });
                }
                if (boss.timer > 300) { boss.phase = 2; boss.timer = 0; }
            }
            // Phase 2: Rings and aimed shots
            else if (boss.phase === 2) {
                if (boss.timer % 60 === 0) {
                    // Ring
                    for(let i=0; i<Math.PI*2; i+=0.3) {
                        enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(i)*3, vy: Math.sin(i)*3, radius: 3 });
                    }
                }
                if (boss.timer % 45 === 0) {
                    // Aimed
                    let angle = Math.atan2(player.y - boss.y, player.x - boss.x);
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(angle)*6, vy: Math.sin(angle)*6, radius: 6 });
                }
                if (boss.timer > 400) { boss.phase = 3; boss.timer = 0; }
            }
            // Phase 3: Wobbly Spiral (Danmaku)
            else if (boss.phase === 3) {
                if (boss.timer % 2 === 0) {
                    let angle = boss.timer * 0.1 + Math.sin(boss.timer * 0.05) * 2;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(angle)*5, vy: Math.sin(angle)*5, radius: 4 });
                }
                if (boss.timer > 300) { boss.phase = 1; boss.timer = 0; }
            }
        }

        function update() {
            frameCount++;

            // Background
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > 800) { s.y = 0; s.x = Math.random()*600; }
            });

            // Player Movement
            if (usingMouse) {
                // Smooth follow mouse
                player.x += (mouseX - player.x) * 0.2;
                player.y += (mouseY - player.y) * 0.2;
            } else {
                if (keys.ArrowUp || keys.w) player.y -= player.speed;
                if (keys.ArrowDown || keys.s) player.y += player.speed;
                if (keys.ArrowLeft || keys.a) player.x -= player.speed;
                if (keys.ArrowRight || keys.d) player.x += player.speed;
            }
            
            player.x = Math.max(player.drawRadius, Math.min(600 - player.drawRadius, player.x));
            player.y = Math.max(player.drawRadius, Math.min(800 - player.drawRadius, player.y));
            if (player.invuln > 0) player.invuln--;

            // Player Fire
            if (frameCount % 5 === 0) {
                playerBullets.push({ x: player.x - 5, y: player.y - 10, vy: -15 });
                playerBullets.push({ x: player.x + 5, y: player.y - 10, vy: -15 });
            }

            // Boss Movement
            boss.x = 300 + Math.sin(frameCount * 0.02) * 200;
            fireBossPattern();

            // Update Player Bullets & Hit Boss
            playerBullets.forEach((b, i) => {
                b.y += b.vy;
                if (b.y < -20) playerBullets.splice(i, 1);
                else if (Math.hypot(b.x - boss.x, b.y - boss.y) < boss.radius) {
                    playerBullets.splice(i, 1);
                    boss.hp -= 10;
                    score += 5;
                    createParticles(b.x, b.y, 'var(--bullet-player)', 2);
                    if (boss.hp <= 0) {
                        gameWin();
                    }
                }
            });
            document.getElementById('boss-hp-fill').style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;

            // Update Enemy Bullets & Hit Player
            enemyBullets.forEach((b, i) => {
                b.x += b.vx; b.y += b.vy;
                if (b.x < -20 || b.x > 620 || b.y < -20 || b.y > 820) {
                    enemyBullets.splice(i, 1);
                } else if (player.invuln <= 0 && Math.hypot(b.x - player.x, b.y - player.y) < player.hitRadius + b.radius) {
                    lives--;
                    document.getElementById('livesEl').textContent = `LIVES: ${lives}`;
                    createParticles(player.x, player.y, 'var(--player-color)', 20);
                    enemyBullets = []; // Clear bullets on hit (bomb effect)
                    player.invuln = 120;
                    if (lives <= 0) gameOver();
                }
            });

            // Particles
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.02;
                if(p.life <= 0) particles.splice(i, 1);
            });

            document.getElementById('scoreEl').textContent = `SCORE: ${score}`;
        }

        function draw() {
            ctx.clearRect(0, 0, 600, 800);

            // Stars
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            stars.forEach(s => { ctx.fillRect(s.x, s.y, 1, s.speed > 2 ? 3 : 1); });

            ctx.globalCompositeOperation = 'lighter';

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.shadowBlur = 5; ctx.shadowColor = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
            });
            ctx.globalAlpha = 1;

            // Player Bullets
            ctx.fillStyle = 'var(--bullet-player)';
            ctx.shadowColor = 'var(--bullet-player)';
            ctx.shadowBlur = 10;
            playerBullets.forEach(b => {
                ctx.fillRect(b.x - 2, b.y - 10, 4, 20);
            });

            // Enemy Bullets
            ctx.fillStyle = '#fff';
            ctx.shadowColor = 'var(--bullet-enemy)';
            ctx.shadowBlur = 10;
            enemyBullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
                ctx.fill();
            });

            // Boss
            ctx.fillStyle = '#000';
            ctx.strokeStyle = 'var(--boss-color)';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 20; ctx.shadowColor = 'var(--boss-color)';
            ctx.beginPath(); ctx.arc(boss.x, boss.y, boss.radius, 0, Math.PI*2);
            ctx.fill(); ctx.stroke();
            
            // Boss Core
            ctx.fillStyle = 'var(--boss-color)';
            ctx.beginPath(); ctx.arc(boss.x, boss.y, boss.radius * 0.5 + Math.sin(frameCount*0.1)*5, 0, Math.PI*2);
            ctx.fill();

            // Player
            if (player.invuln % 10 < 5) {
                ctx.shadowBlur = 15; ctx.shadowColor = 'var(--player-color)';
                // Ship wings
                ctx.fillStyle = 'var(--player-color)';
                ctx.beginPath();
                ctx.moveTo(player.x, player.y - player.drawRadius);
                ctx.lineTo(player.x + player.drawRadius, player.y + player.drawRadius);
                ctx.lineTo(player.x - player.drawRadius, player.y + player.drawRadius);
                ctx.fill();
                
                // Hitbox Core
                ctx.fillStyle = 'var(--player-core)';
                ctx.shadowColor = '#fff';
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.hitRadius, 0, Math.PI*2);
                ctx.fill();
            }

            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 0;
        }

        function loop() {
            if(!isGameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Input Handling
        window.addEventListener('keydown', e => { keys[e.key] = true; usingMouse = false; });
        window.addEventListener('keyup', e => { keys[e.key] = false; });
        
        function handleMove(e) {
            e.preventDefault();
            usingMouse = true;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            let rect = canvas.getBoundingClientRect();
            let scaleX = 600 / rect.width;
            let scaleY = 800 / rect.height;
            mouseX = (clientX - rect.left) * scaleX;
            mouseY = (clientY - rect.top) * scaleY;
        }

        gameContainer.addEventListener('mousemove', handleMove);
        gameContainer.addEventListener('touchmove', handleMove, {passive:false});
        gameContainer.addEventListener('touchstart', handleMove, {passive:false});

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            score = 0; lives = 3; frameCount = 0;
            player.x = 300; player.y = 700; player.invuln = 60;
            boss.hp = boss.maxHp; boss.phase = 1; boss.timer = 0;
            enemyBullets = []; playerBullets = []; particles = [];
            
            document.getElementById('scoreEl').textContent = `SCORE: 0`;
            document.getElementById('livesEl').textContent = `LIVES: 3`;
            
            isGameRunning = true;
            loop();
        }

        function gameOver() {
            isGameRunning = false;
            document.getElementById('end-title').textContent = "DESTROYED";
            document.getElementById('end-title').style.color = "#ff3366";
            document.getElementById('final-score').textContent = `FINAL SCORE: ${score}`;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        function gameWin() {
            isGameRunning = false;
            createParticles(boss.x, boss.y, 'var(--boss-color)', 100);
            draw(); // Draw final explosion
            document.getElementById('end-title').textContent = "TARGET ELIMINATED";
            document.getElementById('end-title').style.color = "var(--player-color)";
            document.getElementById('final-score').textContent = `FINAL SCORE: ${score + 10000}`; // Bonus
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
