<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Arkanoid</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #050510;
            --paddle-color: #00f3ff;
            --ball-color: #ff00ff;
            --block-colors: #ff0044, #ff8800, #39ff14, #00f3ff, #bd00ff;
            --text-color: #0ff;
            --ui-bg: rgba(0, 0, 0, 0.85);
            --border-color: #0ff;
        }

        * { box-sizing: border-box; touch-action: none; }
        body {
            margin: 0; padding: 0; background-color: var(--bg-color);
            background-image: linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px; color: var(--text-color); font-family: 'Press Start 2P', monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        #game-container { position: relative; border: 2px solid var(--border-color); box-shadow: 0 0 20px var(--border-color); background-color: rgba(0,0,0,0.6); }
        canvas { display: block; }
        #ui-layer { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:15px; }
        .hud { display: flex; justify-content: space-between; text-shadow: 0 0 5px var(--text-color); font-size: 14px; z-index: 10; }
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: var(--ui-bg); border: 2px solid var(--border-color); padding: 30px;
            text-align: center; pointer-events: auto; box-shadow: 0 0 30px rgba(0,255,255,0.3); z-index: 20; width: 80%; max-width: 400px;
        }
        h1 { color: var(--paddle-color); text-shadow: 0 0 10px var(--paddle-color); margin-bottom: 20px; font-size: 20px; }
        p { margin-bottom: 20px; font-size: 10px; color: #ccc; line-height: 1.5; }
        button {
            background: transparent; color: var(--paddle-color); border: 2px solid var(--paddle-color);
            padding: 12px 24px; font-family: 'Press Start 2P', monospace; font-size: 14px; cursor: pointer;
            text-shadow: 0 0 10px var(--paddle-color); box-shadow: 0 0 10px var(--paddle-color); transition: all 0.2s; text-transform: uppercase;
        }
        button:hover { background: var(--paddle-color); color: #000; box-shadow: 0 0 30px var(--paddle-color); }
        .hidden { display: none !important; }
        .scanlines { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2)); background-size: 100% 4px; pointer-events: none; z-index: 100; opacity: 0.6; }
        .controls-hint { margin-top: 10px; font-size: 10px; color: #888; text-align: center; }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="700"></canvas>
        <div id="ui-layer">
            <div class="hud">
                <span id="scoreEl">SCORE: 0</span>
                <span id="livesEl">LIVES: 3</span>
            </div>
        </div>
        <div id="start-screen" class="modal">
            <h1>NEON ARKANOID</h1>
            <p>MOUSE / TOUCH TO MOVE<br>BREAK ALL BLOCKS</p>
            <button id="start-btn">INSERT COIN</button>
        </div>
        <div id="game-over-screen" class="modal hidden">
            <h1 id="status-text" style="color: #ff0000; text-shadow: 0 0 10px #ff0000;">SYSTEM FAILURE</h1>
            <p id="final-score">SCORE: 0</p>
            <button id="restart-btn">TRY AGAIN</button>
        </div>
    </div>
    <div class="controls-hint">Desktop: Mouse Move | Mobile: Touch & Drag</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreEl');
        const livesEl = document.getElementById('livesEl');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const statusText = document.getElementById('status-text');
        
        let isGameRunning = false;
        
        const paddle = { x: 250, y: 650, width: 100, height: 15, color: '#00f3ff' };
        let balls = [];
        let blocks = [];
        let particles = [];
        let powerups = [];
        
        const blockColors = ['#ff0044', '#ff8800', '#39ff14', '#00f3ff', '#bd00ff'];
        let score = 0;
        let lives = 3;
        let mouseX = 300;

        function resizeGame() {
            const sizeW = Math.min(window.innerWidth - 20, 600);
            const sizeH = Math.min(window.innerHeight - 60, 700);
            canvas.style.width = `${sizeW}px`; canvas.style.height = `${sizeH}px`;
            document.getElementById('game-container').style.width = `${sizeW}px`;
            document.getElementById('game-container').style.height = `${sizeH}px`;
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();

        function createBlocks() {
            blocks = [];
            const rows = 6;
            const cols = 8;
            const blockWidth = 65;
            const blockHeight = 20;
            const padding = 5;
            const offsetX = (600 - (cols * (blockWidth + padding))) / 2;
            const offsetY = 50;

            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    blocks.push({
                        x: offsetX + c * (blockWidth + padding),
                        y: offsetY + r * (blockHeight + padding),
                        width: blockWidth, height: blockHeight,
                        color: blockColors[r % blockColors.length],
                        status: 1, // 1 = active
                        type: Math.random() > 0.8 ? 'powerup' : 'normal'
                    });
                }
            }
        }

        function createParticles(x, y, color) {
            for(let i=0; i<15; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1, color
                });
            }
        }

        function spawnPowerup(x, y) {
            const types = ['expand', 'multiball'];
            powerups.push({
                x, y, radius: 8, vy: 2, type: types[Math.floor(Math.random() * types.length)]
            });
        }

        function addBall(x, y) {
            balls.push({
                x, y, radius: 6, dx: (Math.random() > 0.5 ? 4 : -4), dy: -4, speed: 6
            });
        }

        function initGame() {
            paddle.width = 100;
            paddle.x = canvas.width/2 - paddle.width/2;
            balls = [];
            addBall(paddle.x + paddle.width/2, paddle.y - 10);
            particles = [];
            powerups = [];
            score = 0;
            lives = 3;
            updateHUD();
            createBlocks();
            isGameRunning = true;
            gameLoop();
        }

        function updateHUD() {
            scoreEl.textContent = `SCORE: ${score}`;
            livesEl.textContent = `LIVES: ${lives}`;
        }

        function update() {
            // Paddle Movement
            paddle.x = mouseX - paddle.width/2;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;

            // Powerups
            powerups.forEach((p, i) => {
                p.y += p.vy;
                if (p.y > canvas.height) powerups.splice(i, 1);
                else if (p.y + p.radius > paddle.y && p.y - p.radius < paddle.y + paddle.height && p.x > paddle.x && p.x < paddle.x + paddle.width) {
                    // Collected
                    if (p.type === 'expand') {
                        paddle.width = Math.min(200, paddle.width + 40);
                    } else if (p.type === 'multiball') {
                        addBall(paddle.x + paddle.width/2, paddle.y - 10);
                    }
                    powerups.splice(i, 1);
                }
            });

            // Particles
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            });

            // Balls
            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                b.x += b.dx; b.y += b.dy;

                // Wall collisions
                if (b.x - b.radius < 0 || b.x + b.radius > canvas.width) b.dx *= -1;
                if (b.y - b.radius < 0) b.dy *= -1;
                
                // Bottom
                if (b.y + b.radius > canvas.height) {
                    balls.splice(i, 1);
                    if (balls.length === 0) {
                        lives--;
                        updateHUD();
                        if (lives <= 0) gameOver(false);
                        else addBall(paddle.x + paddle.width/2, paddle.y - 10);
                    }
                    continue;
                }

                // Paddle collision
                if (b.y + b.radius > paddle.y && b.y - b.radius < paddle.y + paddle.height && b.x > paddle.x && b.x < paddle.x + paddle.width) {
                    let hitPoint = b.x - (paddle.x + paddle.width/2);
                    b.dx = hitPoint * 0.15;
                    b.dy = -Math.abs(b.dy); // Ensure going up
                    
                    // Normalize speed
                    let currentSpeed = Math.hypot(b.dx, b.dy);
                    b.dx = (b.dx / currentSpeed) * b.speed;
                    b.dy = (b.dy / currentSpeed) * b.speed;
                }

                // Block collisions
                for (let j = 0; j < blocks.length; j++) {
                    let block = blocks[j];
                    if (block.status === 1) {
                        if (b.x + b.radius > block.x && b.x - b.radius < block.x + block.width && b.y + b.radius > block.y && b.y - b.radius < block.y + block.height) {
                            b.dy *= -1;
                            block.status = 0;
                            score += 10;
                            updateHUD();
                            createParticles(block.x + block.width/2, block.y + block.height/2, block.color);
                            
                            if (block.type === 'powerup') {
                                spawnPowerup(block.x + block.width/2, block.y + block.height/2);
                            }
                            
                            // Speed up ball slightly
                            b.speed = Math.min(10, b.speed + 0.05);
                        }
                    }
                }
            }

            // Check Win
            let activeBlocks = blocks.filter(b => b.status === 1).length;
            if (activeBlocks === 0) {
                gameOver(true);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Paddle
            
            
            ctx.fillStyle = paddle.color;
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

            // Blocks
            blocks.forEach(b => {
                if(b.status === 1) {
                    
                    ctx.fillStyle = b.color;
                    ctx.fillRect(b.x, b.y, b.width, b.height);
                }
            });

            // Balls
            
            ctx.fillStyle = '#ff00ff';
            balls.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Powerups
            
            ctx.fillStyle = '#fff';
            powerups.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = p.type === 'expand' ? '#39ff14' : '#00f3ff';
                ctx.fill();
            });

            // Particles
            particles.forEach(p => {
                
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 3, 3);
            });
            ctx.globalAlpha = 1;
            
        }

        function gameLoop() {
            if(!isGameRunning) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver(win) {
            isGameRunning = false;
            statusText.textContent = win ? "SECTOR CLEARED" : "SYSTEM FAILURE";
            statusText.style.color = win ? "#39ff14" : "#ff0000";
            statusText.style.textShadow = win ? "0 0 10px #39ff14" : "0 0 10px #ff0000";
            finalScoreEl.textContent = `SCORE: ${score}`;
            gameOverScreen.classList.remove('hidden');
        }

        // Controls
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
        });

        const gameContainer = document.getElementById('game-container');
        gameContainer.addEventListener('touchmove', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
        }, {passive: false});
        gameContainer.addEventListener('touchstart', e => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
        }, {passive: false});

        document.getElementById('start-btn').addEventListener('click', () => {
            startScreen.classList.add('hidden');
            initGame();
        });
        document.getElementById('restart-btn').addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            initGame();
        });
    </script>
</body>
</html>
