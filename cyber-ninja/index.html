<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Ninja</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap');

        :root {
            --bg: #090914;
            --blade: #00ffff;
            --bomb: #ff0033;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0; padding: 0; background-color: var(--bg); color: #fff;
            font-family: 'Orbitron', sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
            cursor: crosshair;
        }

        #game-container {
            position: relative; width: 100%; height: 100%; max-width: 800px; max-height: 600px;
            background: radial-gradient(circle at center, #151525 0%, var(--bg) 100%);
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden; border-radius: 12px;
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 5; }

        .hud {
            position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between;
            font-size: 22px; z-index: 10; pointer-events: none; font-weight: 800;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8); letter-spacing: 2px;
        }
        
        .score-val { color: var(--blade); text-shadow: 0 0 10px rgba(0,255,255,0.4); font-size: 26px;}
        .lives-val { color: #fff; }

        /* Glassmorphism Modals */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(9, 9, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px; text-align: center; z-index: 30;
            border-radius: 20px; pointer-events: auto; width: 85%; max-width: 450px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
        }
        h1 { color: #fff; margin-top: 0; font-size: 38px; text-shadow: 0 0 15px var(--blade); margin-bottom: 15px; letter-spacing: 3px; }
        p { color: #a0a0a0; line-height: 1.6; font-size: 14px; margin-bottom: 30px; letter-spacing: 1px; }
        
        /* Post-Neumorphic Tactile Button */
        button {
            background: linear-gradient(135deg, rgba(0,255,255,0.15), rgba(0,255,255,0.05));
            color: #fff; border: 1px solid rgba(0,255,255,0.3);
            padding: 15px 40px; font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 800;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border-radius: 50px; box-shadow: 0 8px 15px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
            text-transform: uppercase; letter-spacing: 2px;
        }
        button:hover { 
            background: linear-gradient(135deg, rgba(0,255,255,0.3), rgba(0,255,255,0.1));
            box-shadow: 0 12px 25px rgba(0, 255, 255, 0.2), inset 0 1px 0 rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }
        button:active { transform: translateY(1px); box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
            <div>SCORE<br><span class="score-val" id="scoreEl">0</span></div>
            <div style="text-align:right;">LIVES<br><span class="lives-val" id="livesEl">3</span></div>
        </div>

        <div id="start-screen" class="modal">
            <h1>CYBER NINJA</h1>
            <p>Drag or swipe to slice polygons.<br>Don't let them fall off screen.<br><span style="color:var(--bomb)">AVOID RED BOMBS!</span></p>
            <button id="start-btn">ENGAGE</button>
        </div>
        
        <div id="game-over-screen" class="modal hidden">
            <h1 style="color:var(--bomb); text-shadow: 0 0 15px var(--bomb);">SYSTEM FAILURE</h1>
            <p id="final-stats" style="font-size: 18px; color: #fff;">Score: 0</p>
            <button id="restart-btn" style="border-color:rgba(255,0,51,0.5); background: linear-gradient(135deg, rgba(255,0,51,0.2), rgba(255,0,51,0.05));">REBOOT</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        let width, height;
        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width; canvas.height = height;
        }
        window.addEventListener('resize', resize); resize();

        let isRunning = false;
        let score = 0;
        let lives = 3;
        let frame = 0;

        const GRAVITY = 0.2;
        
        let objects = []; 
        let particles = [];
        let trail = []; 
        let missedTrailPoints = []; // to check full swipe segment between frames
        
        const COLORS = ['#00ffcc', '#ff00ff', '#e9b64a', '#3498db'];

        function spawnObject() {
            let isBomb = Math.random() < 0.15;
            let size = isBomb ? 25 : 30 + Math.random() * 20;
            
            let obj = {
                x: width/4 + Math.random() * (width/2),
                y: height + 50,
                vx: (Math.random() - 0.5) * 6,
                vy: -13 - Math.random() * 5,
                rotation: 0,
                vr: (Math.random() - 0.5) * 0.2,
                size: size,
                isBomb: isBomb,
                color: isBomb ? 'var(--bomb)' : COLORS[Math.floor(Math.random() * COLORS.length)],
                points: [],
                sliced: false,
                halves: []
            };

            let sides = isBomb ? 10 : Math.floor(Math.random() * 4) + 3; 
            for(let i=0; i<sides; i++) {
                let angle = (i * 2 * Math.PI) / sides;
                obj.points.push({ x: Math.cos(angle)*size, y: Math.sin(angle)*size });
            }
            
            objects.push(obj);
        }

        // Check if two line segments intersect and return point
        function lineIntersect(x1,y1,x2,y2, x3,y3,x4,y4) {
            let det = (x1-x2)*(y3-y4) - (y1-y2)*(x3-x4);
            if (det === 0) return null;
            let t = ((x1-x3)*(y3-y4) - (y1-y3)*(x3-x4)) / det;
            let u = -((x1-x2)*(y1-y3) - (y1-y2)*(x1-x3)) / det;
            if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
                return { x: x1 + t*(x2-x1), y: y1 + t*(y2-y1) };
            }
            return null;
        }

        function createPolygonSlice(points, lineX1, lineY1, lineX2, lineY2) {
            // Simple split: check intersection of all edges with the slice line
            // Then reconstruct two polygons
            let p1 = [], p2 = [];
            let intersections = [];
            
            let n = points.length;
            for(let i=0; i<n; i++) {
                let j = (i+1)%n;
                let pt = lineIntersect(lineX1, lineY1, lineX2, lineY2, points[i].x, points[i].y, points[j].x, points[j].y);
                if (pt) intersections.push({pt: pt, edge: i});
            }

            if (intersections.length === 2) {
                // We have a clean slice.
                // Reconstruct polygon 1
                for(let i=0; i<=intersections[0].edge; i++) p1.push(points[i]);
                p1.push(intersections[0].pt);
                p1.push(intersections[1].pt);
                for(let i=intersections[1].edge+1; i<n; i++) p1.push(points[i]);
                
                // Reconstruct polygon 2
                p2.push(intersections[0].pt);
                for(let i=intersections[0].edge+1; i<=intersections[1].edge; i++) p2.push(points[i]);
                p2.push(intersections[1].pt);
                
                return [p1, p2];
            }
            return null; // Slice missed or hit a vertex perfectly (ignore for simplicity)
        }

        function sliceObject(obj, lineX1, lineY1, lineX2, lineY2) {
            if (obj.sliced) return;

            let cos = Math.cos(-obj.rotation);
            let sin = Math.sin(-obj.rotation);
            
            let lx1 = lineX1 - obj.x; let ly1 = lineY1 - obj.y;
            let lx2 = lineX2 - obj.x; let ly2 = lineY2 - obj.y;
            
            let localX1 = lx1 * cos - ly1 * sin;
            let localY1 = lx1 * sin + ly1 * cos;
            let localX2 = lx2 * cos - ly2 * sin;
            let localY2 = lx2 * sin + ly2 * cos;

            let halves = createPolygonSlice(obj.points, localX1, localY1, localX2, localY2);

            if (halves) {
                obj.sliced = true;
                
                if (obj.isBomb) {
                    for(let i=0; i<40; i++) {
                        particles.push({
                            x: obj.x, y: obj.y,
                            vx: (Math.random()-0.5)*18, vy: (Math.random()-0.5)*18,
                            life: 30, color: 'var(--bomb)'
                        });
                    }
                    loseGame();
                    return;
                }

                score += 10;
                document.getElementById('scoreEl').textContent = score;
                
                for(let i=0; i<15; i++) {
                    particles.push({
                        x: obj.x, y: obj.y,
                        vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
                        life: 20, color: obj.color
                    });
                }
                
                // Determine normal vector of slice line to push halves apart
                let dx = localX2 - localX1;
                let dy = localY2 - localY1;
                let len = Math.hypot(dx, dy);
                let nx = -dy/len; let ny = dx/len;
                // Convert normal back to global space
                let gnx = nx * Math.cos(obj.rotation) - ny * Math.sin(obj.rotation);
                let gny = nx * Math.sin(obj.rotation) + ny * Math.cos(obj.rotation);

                obj.halves = [
                    { x: obj.x, y: obj.y, vx: obj.vx + gnx*3, vy: obj.vy + gny*3, rotation: obj.rotation, vr: obj.vr + 0.1, points: halves[0] },
                    { x: obj.x, y: obj.y, vx: obj.vx - gnx*3, vy: obj.vy - gny*3, rotation: obj.rotation, vr: obj.vr - 0.1, points: halves[1] }
                ];
            }
        }

        function update() {
            frame++;
            
            let spawnRate = Math.max(20, 70 - Math.floor(frame / 60));
            if (frame % spawnRate === 0) spawnObject();

            for(let i=0; i<trail.length; i++) {
                trail[i].life--;
            }
            trail = trail.filter(t => t.life > 0);

            // Combine current trail segments and new segments generated since last frame
            let segments = [];
            for(let i=0; i<trail.length-1; i++) {
                segments.push({x1: trail[i].x, y1: trail[i].y, x2: trail[i+1].x, y2: trail[i+1].y});
            }
            for(let i=0; i<missedTrailPoints.length-1; i++) {
                segments.push({x1: missedTrailPoints[i].x, y1: missedTrailPoints[i].y, x2: missedTrailPoints[i+1].x, y2: missedTrailPoints[i+1].y});
            }
            if(trail.length > 0 && missedTrailPoints.length > 0) {
                 segments.push({x1: trail[trail.length-1].x, y1: trail[trail.length-1].y, x2: missedTrailPoints[0].x, y2: missedTrailPoints[0].y});
            }

            for(let i=objects.length-1; i>=0; i--) {
                let obj = objects[i];
                
                if (!obj.sliced) {
                    obj.vy += GRAVITY;
                    obj.x += obj.vx;
                    obj.y += obj.vy;
                    obj.rotation += obj.vr;

                    if (obj.y > height + 100 && obj.vy > 0) {
                        if (!obj.isBomb) {
                            lives--;
                            document.getElementById('livesEl').textContent = lives;
                            if (lives <= 0) loseGame();
                        }
                        objects.splice(i, 1);
                        continue;
                    }

                    // Check slicing against all active line segments
                    if (!obj.sliced) {
                        for(let seg of segments) {
                            // Expand bounding box check for long, fast swipes
                            let minX = Math.min(seg.x1, seg.x2) - obj.size;
                            let maxX = Math.max(seg.x1, seg.x2) + obj.size;
                            let minY = Math.min(seg.y1, seg.y2) - obj.size;
                            let maxY = Math.max(seg.y1, seg.y2) + obj.size;
                            
                            if (obj.x > minX && obj.x < maxX && obj.y > minY && obj.y < maxY) {
                                sliceObject(obj, seg.x1, seg.y1, seg.x2, seg.y2);
                                if (obj.sliced) break;
                            }
                        }
                    }
                } else {
                    for(let h of obj.halves) {
                        h.vy += GRAVITY;
                        h.x += h.vx;
                        h.y += h.vy;
                        h.rotation += h.vr;
                    }
                    if (obj.halves[0].y > height + 100) {
                        objects.splice(i, 1);
                    }
                }
            }
            
            // Push missed points into main trail and clear
            missedTrailPoints.forEach(pt => trail.push(pt));
            missedTrailPoints = [];

            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                if(p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawPolygonData(points, ctx) {
            ctx.beginPath();
            for(let i=0; i<points.length; i++) {
                if (i===0) ctx.moveTo(points[i].x, points[i].y);
                else ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            objects.forEach(obj => {
                if (!obj.sliced) {
                    ctx.save();
                    ctx.translate(obj.x, obj.y);
                    ctx.rotate(obj.rotation);
                    ctx.fillStyle = obj.color;
                    ctx.shadowColor = obj.color;
                    ctx.shadowBlur = 15;
                    drawPolygonData(obj.points, ctx);
                    
                    if (obj.isBomb) {
                        ctx.fillStyle = '#111';
                        ctx.shadowBlur = 0;
                        ctx.beginPath(); ctx.arc(0, 0, obj.size*0.4, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.font = '14px sans-serif';
                        ctx.fillText("X", 0, 1);
                    }
                    ctx.restore();
                } else if (!obj.isBomb) {
                    obj.halves.forEach(h => {
                        ctx.save();
                        ctx.translate(h.x, h.y);
                        ctx.rotate(h.rotation);
                        ctx.fillStyle = obj.color;
                        ctx.shadowColor = obj.color;
                        ctx.shadowBlur = 10;
                        drawPolygonData(h.points, ctx);
                        ctx.restore();
                    });
                }
            });

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 20;
                ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            if (trail.length > 1) {
                ctx.strokeStyle = 'var(--blade)';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = 'var(--blade)';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.moveTo(trail[0].x, trail[0].y);
                for(let i=1; i<trail.length; i++) {
                    ctx.lineTo(trail[i].x, trail[i].y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        function loop() {
            if(!isRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function loseGame() {
            isRunning = false;
            ctx.fillStyle = 'rgba(255, 0, 51, 0.4)';
            ctx.fillRect(0, 0, width, height);
            
            setTimeout(() => {
                document.getElementById('final-stats').textContent = `Final Score: ${score}`;
                document.getElementById('game-over-screen').classList.remove('hidden');
            }, 500);
        }

        let isDown = false;
        
        function getPos(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function down(e) {
            e.preventDefault();
            isDown = true;
            trail = []; missedTrailPoints = [];
            let p = getPos(e);
            trail.push({x: p.x, y: p.y, life: 10});
        }
        
        function move(e) {
            if(!isDown) return;
            e.preventDefault();
            let p = getPos(e);
            missedTrailPoints.push({x: p.x, y: p.y, life: 10}); // Push to intermediate buffer to catch fast swipes
        }
        
        function up(e) {
            isDown = false;
        }

        canvas.addEventListener('mousedown', down);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
        
        canvas.addEventListener('touchstart', down, {passive:false});
        window.addEventListener('touchmove', move, {passive:false});
        window.addEventListener('touchend', up);

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            score = 0; lives = 3; frame = 0;
            document.getElementById('scoreEl').textContent = score;
            document.getElementById('livesEl').textContent = lives;
            
            objects = []; particles = []; trail = []; missedTrailPoints = [];
            
            isRunning = true;
            loop();
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
