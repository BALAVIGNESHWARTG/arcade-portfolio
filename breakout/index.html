<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Brick Smasher: 2-Player Co-op</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
        }

        canvas {
            border: 2px solid #bd00ff;
            box-shadow: 0 0 20px rgba(189, 0, 255, 0.2);
            background-color: rgba(0,0,0,0.8);
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 5px #fff;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding-right: 40px;
            box-sizing: border-box;
        }

        #start-screen, #game-over-screen, #level-up-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border: 2px solid #00f3ff;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            z-index: 20;
            min-width: 320px;
        }

        h1 {
            color: #00f3ff;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00f3ff;
            line-height: 1.5;
        }

        p {
            font-size: 10px;
            color: #ccc;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        button {
            background: transparent;
            color: #bd00ff;
            border: 2px solid #bd00ff;
            padding: 15px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px #bd00ff;
            transition: 0.2s;
        }

        button:hover {
            background: #bd00ff;
            color: #000;
        }

        .hidden { display: none; }
        
        #buff-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: yellow;
            font-size: 20px;
            pointer-events: none;
            text-shadow: 0 0 10px yellow;
            opacity: 0;
            transition: opacity 0.5s;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div>SCORE: <span id="score">0</span></div>
            <div>LEVEL: <span id="level">1</span></div>
            <div style="color:#ff3333;">TEAM LIVES: <span id="lives">3</span></div>
        </div>
        
        <div id="buff-text">MULTI-BALL!</div>

        <div id="start-screen">
            <h1>NEON SMASHER: CO-OP</h1>
            <p style="color:#00f3ff;">P1: A / D to Move Left Paddle</p>
            <p style="color:#bd00ff;">P2: ← / → to Move Right Paddle</p>
            <p>Work together to break bricks!</p>
            <button id="start-btn">START CO-OP</button>
        </div>
        
        <div id="level-up-screen" class="hidden">
            <h1 style="color: #39ff14;">TEAMWORK! LEVEL COMPLETE!</h1>
            <p>Speed Increasing...</p>
        </div>

        <div id="game-over-screen" class="hidden">
            <h1 style="color: #ff3333;">GAME OVER</h1>
            <p>FINAL SCORE: <span id="final-score">0</span></p>
            <button id="restart-btn">TRY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const buffText = document.getElementById('buff-text');

        // Game Constants
        let PADDLE_WIDTH = 80;
        const PADDLE_HEIGHT = 15;
        const BALL_RADIUS = 8;
        const BRICK_RowCount = 5;
        const BRICK_ColumnCount = 8;
        const BRICK_PADDING = 10;
        const BRICK_OFFSET_TOP = 50;
        const BRICK_OFFSET_LEFT = 35;
        
        let brickWidth = 75;
        let brickHeight = 20;

        // Game State
        let gameRunning = false;
        let score = 0;
        let level = 1;
        let lives = 3;
        let baseSpeed = 4;
        
        // Entities
        let p1 = { x: 0, width: PADDLE_WIDTH, color: '#00f3ff', keyLeft: false, keyRight: false };
        let p2 = { x: 0, width: PADDLE_WIDTH, color: '#bd00ff', keyLeft: false, keyRight: false };
        
        let balls = [];
        let bricks = [];
        let powerups = [];

        function resize() {
            canvas.width = Math.min(window.innerWidth, 800);
            canvas.height = window.innerHeight;
            
            p1.x = (canvas.width / 4) - (p1.width / 2);
            p2.x = (canvas.width * 0.75) - (p2.width / 2);
            
            brickWidth = (canvas.width - (BRICK_OFFSET_LEFT * 2) - (BRICK_PADDING * (BRICK_ColumnCount - 1))) / BRICK_ColumnCount;
        }
        window.addEventListener('resize', resize);
        resize();

        function initGame(resetScore = true) {
            if(resetScore) {
                score = 0;
                level = 1;
                lives = 3;
                baseSpeed = 4;
            }
            
            document.getElementById('score').innerText = score;
            document.getElementById('level').innerText = level;
            document.getElementById('lives').innerText = lives;

            resetLevel();
            gameRunning = true;
            requestAnimationFrame(loop);
        }

        function resetLevel() {
            p1.width = PADDLE_WIDTH;
            p2.width = PADDLE_WIDTH;
            p1.x = (canvas.width / 4) - (p1.width / 2);
            p2.x = (canvas.width * 0.75) - (p2.width / 2);

            balls = [{
                x: canvas.width / 2,
                y: canvas.height - 40,
                dx: baseSpeed * (Math.random() > 0.5 ? 1 : -1),
                dy: -baseSpeed,
                color: '#fff'
            }];

            powerups = [];
            createBricks();
        }

        function createBricks() {
            bricks = [];
            const colors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#9400d3'];
            const rows = Math.min(5 + Math.floor(level/2), 10);
            
            for(let c=0; c<BRICK_ColumnCount; c++) {
                bricks[c] = [];
                for(let r=0; r<rows; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1, color: colors[r % colors.length] };
                }
            }
        }

        function spawnPowerup(x, y) {
            if(Math.random() > 0.85) {
                const type = Math.random();
                let pType = 'wide';
                let color = '#00f3ff';
                
                if (type < 0.33) {
                    pType = 'wide'; color = '#00f3ff';
                } else if (type < 0.66) {
                    pType = 'multi'; color = '#ffff00';
                } else {
                    pType = 'life'; color = '#ff0055';
                }

                powerups.push({ x, y, width: 20, height: 10, dy: 2, type: pType, color });
            }
        }

        function showBuffText(text) {
            buffText.innerText = text;
            buffText.style.opacity = 1;
            setTimeout(() => { buffText.style.opacity = 0; }, 1500);
        }

        function handlePaddleCollision(b, p) {
            if(b.y + BALL_RADIUS > canvas.height - PADDLE_HEIGHT) {
                if(b.x > p.x && b.x < p.x + p.width) {
                    let hitPoint = b.x - (p.x + p.width / 2);
                    hitPoint = hitPoint / (p.width / 2);
                    let angle = hitPoint * (Math.PI / 3); 
                    let speed = Math.sqrt(b.dx*b.dx + b.dy*b.dy);
                    speed = Math.min(speed, 12);
                    b.dx = speed * Math.sin(angle);
                    b.dy = -speed * Math.cos(angle);
                    
                    // Nudge up slightly so it doesn't get stuck
                    b.y = canvas.height - PADDLE_HEIGHT - BALL_RADIUS - 1;
                }
            }
        }

        function update() {
            // Move P1
            if(p1.keyRight && p1.x < canvas.width - p1.width) p1.x += 8;
            if(p1.keyLeft && p1.x > 0) p1.x -= 8;
            
            // Move P2
            if(p2.keyRight && p2.x < canvas.width - p2.width) p2.x += 8;
            if(p2.keyLeft && p2.x > 0) p2.x -= 8;

            // Powerups
            powerups.forEach((p, index) => {
                p.y += p.dy;
                // Collision with P1 or P2
                let hit1 = (p.y + p.height >= canvas.height - PADDLE_HEIGHT && p.x >= p1.x && p.x <= p1.x + p1.width);
                let hit2 = (p.y + p.height >= canvas.height - PADDLE_HEIGHT && p.x >= p2.x && p.x <= p2.x + p2.width);
                
                if (hit1 || hit2) {
                    if(p.type === 'wide') {
                        let target = hit1 ? p1 : p2;
                        target.width = Math.min(target.width + 40, 200);
                        showBuffText((hit1 ? "P1" : "P2") + " WIDE PADDLE!");
                    } else if(p.type === 'multi') {
                        let newBalls = [];
                        balls.forEach(b => { newBalls.push({ ...b, dx: -b.dx, dy: b.dy - 1 }); });
                        balls = balls.concat(newBalls);
                        showBuffText("MULTI-BALL!");
                    } else if(p.type === 'life') {
                        lives++;
                        document.getElementById('lives').innerText = lives;
                        showBuffText("EXTRA TEAM LIFE!");
                    }
                    powerups.splice(index, 1);
                }
                else if(p.y > canvas.height) {
                    powerups.splice(index, 1);
                }
            });

            // Move Balls
            let activeBricks = false;

            balls.forEach((b, bIndex) => {
                b.x += b.dx;
                b.y += b.dy;

                // Wall Collision
                if(b.x + BALL_RADIUS > canvas.width || b.x - BALL_RADIUS < 0) b.dx = -b.dx;
                if(b.y - BALL_RADIUS < 0) b.dy = -b.dy;
                
                handlePaddleCollision(b, p1);
                handlePaddleCollision(b, p2);

                // Death
                if(b.y + BALL_RADIUS > canvas.height) {
                    balls.splice(bIndex, 1);
                }

                // Bricks
                for(let c=0; c<BRICK_ColumnCount; c++) {
                    for(let r=0; r<bricks[c].length; r++) {
                        let brick = bricks[c][r];
                        if(brick && brick.status === 1) {
                            activeBricks = true;
                            let bX = (c * (brickWidth + BRICK_PADDING)) + BRICK_OFFSET_LEFT;
                            let bY = (r * (brickHeight + BRICK_PADDING)) + BRICK_OFFSET_TOP;
                            brick.x = bX; brick.y = bY;

                            if(b.x > bX && b.x < bX + brickWidth && b.y > bY && b.y < bY + brickHeight) {
                                b.dy = -b.dy;
                                brick.status = 0;
                                score += 10;
                                document.getElementById('score').innerText = score;
                                spawnPowerup(bX + brickWidth/2, bY + brickHeight/2);
                            }
                        }
                    }
                }
            });

            // Level Clear
            let bricksRemaining = false;
            for(let c=0; c<BRICK_ColumnCount; c++) {
                for(let r=0; r<bricks[c].length; r++) {
                    if(bricks[c][r] && bricks[c][r].status === 1) bricksRemaining = true;
                }
            }

            if(!bricksRemaining) {
                gameRunning = false;
                document.getElementById('level-up-screen').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('level-up-screen').classList.add('hidden');
                    level++;
                    baseSpeed += 0.5;
                    initGame(false);
                }, 2000);
            }

            // Game Over
            if(balls.length === 0) {
                lives--;
                document.getElementById('lives').innerText = lives;
                if(lives <= 0) {
                    gameOver();
                } else {
                    balls = [{ x: canvas.width / 2, y: canvas.height - 40, dx: baseSpeed, dy: -baseSpeed, color: '#fff' }];
                    p1.x = (canvas.width / 4) - (p1.width / 2);
                    p2.x = (canvas.width * 0.75) - (p2.width / 2);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Bricks
            for(let c=0; c<BRICK_ColumnCount; c++) {
                for(let r=0; r<bricks[c].length; r++) {
                    if(bricks[c][r].status === 1) {
                        ctx.beginPath();
                        ctx.rect(bricks[c][r].x, bricks[c][r].y, brickWidth, brickHeight);
                        ctx.fillStyle = bricks[c][r].color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }

            // Paddles
            ctx.beginPath();
            ctx.rect(p1.x, canvas.height - PADDLE_HEIGHT, p1.width, PADDLE_HEIGHT);
            ctx.fillStyle = p1.color;
            ctx.fill();
            ctx.closePath();
            
            ctx.beginPath();
            ctx.rect(p2.x, canvas.height - PADDLE_HEIGHT, p2.width, PADDLE_HEIGHT);
            ctx.fillStyle = p2.color;
            ctx.fill();
            ctx.closePath();

            // Balls
            balls.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, BALL_RADIUS, 0, Math.PI*2);
                ctx.fillStyle = b.color;
                ctx.fill();
                ctx.closePath();
            });

            // Powerups
            powerups.forEach(p => {
                ctx.beginPath();
                ctx.rect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.closePath();
                ctx.fillStyle = "black";
                ctx.font = "8px Arial";
                let char = p.type === 'wide' ? 'W' : (p.type === 'multi' ? 'M' : '♥');
                ctx.fillText(char, p.x + 5, p.y + 8);
            });
        }

        function loop() {
            if(!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // Inputs
        document.addEventListener("keydown", (e) => {
            if (e.code === 'KeyA') p1.keyLeft = true;
            if (e.code === 'KeyD') p1.keyRight = true;
            if (e.code === 'ArrowLeft') p2.keyLeft = true;
            if (e.code === 'ArrowRight') p2.keyRight = true;
        }, false);

        document.addEventListener("keyup", (e) => {
            if (e.code === 'KeyA') p1.keyLeft = false;
            if (e.code === 'KeyD') p1.keyRight = false;
            if (e.code === 'ArrowLeft') p2.keyLeft = false;
            if (e.code === 'ArrowRight') p2.keyRight = false;
        }, false);
        
        // Touch Multi-touch for Mobile Co-op
        const gc = document.getElementById('game-container');
        let touches = {};
        
        gc.addEventListener('touchstart', handleTouch, {passive:false});
        gc.addEventListener('touchmove', handleTouch, {passive:false});
        gc.addEventListener('touchend', endTouch, {passive:false});
        
        function handleTouch(e) {
            e.preventDefault();
            for(let t of e.changedTouches) {
                let rect = canvas.getBoundingClientRect();
                let x = (t.clientX - rect.left) * (canvas.width / rect.width);
                if(x < canvas.width/2) {
                    p1.x = x - p1.width/2;
                } else {
                    p2.x = x - p2.width/2;
                }
            }
        }
        function endTouch(e) {
            e.preventDefault();
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').classList.add('hidden');
            initGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('game-over-screen').classList.add('hidden');
            initGame();
        });

    </script>
</body>
</html>
