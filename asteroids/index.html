<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Asteroids</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #050510;
            --player-color: #00f3ff;
            --asteroid-color: #ff00ff;
            --bullet-color: #39ff14;
            --text-color: #0ff;
            --ui-bg: rgba(0, 0, 0, 0.85);
            --border-color: #0ff;
        }

        * {
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Press Start 2P', monospace;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 20px var(--border-color), inset 0 0 20px rgba(0, 255, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.8);
        }

        canvas { display: block; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 15px;
        }

        .hud {
            display: flex; justify-content: space-between;
            text-shadow: 0 0 5px var(--text-color);
            font-size: 14px; z-index: 10;
        }

        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: var(--ui-bg); border: 2px solid var(--border-color);
            padding: 30px; text-align: center; pointer-events: auto;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3); z-index: 20;
            width: 80%; max-width: 400px;
        }

        h1 { color: var(--player-color); text-shadow: 0 0 10px var(--player-color); margin-bottom: 20px; font-size: 20px; line-height: 1.5; }
        p { margin-bottom: 20px; line-height: 1.6; font-size: 10px; color: #ccc; }

        button {
            background: transparent; color: var(--player-color);
            border: 2px solid var(--player-color); padding: 12px 24px;
            font-family: 'Press Start 2P', monospace; font-size: 14px; cursor: pointer;
            text-shadow: 0 0 10px var(--player-color); box-shadow: 0 0 10px var(--player-color);
            transition: all 0.2s; text-transform: uppercase;
        }
        button:hover { background: var(--player-color); color: #000; box-shadow: 0 0 30px var(--player-color); }

        .hidden { display: none !important; }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px; pointer-events: none; z-index: 100; opacity: 0.6;
        }

        #mobile-controls {
            position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; pointer-events: none;
        }
        .btn-group { display: flex; gap: 20px; pointer-events: auto; }
        .control-btn {
            width: 60px; height: 60px; border-radius: 50%; border: 2px solid rgba(0, 243, 255, 0.5);
            background: rgba(0, 0, 0, 0.5); color: rgba(0, 243, 255, 0.5);
            font-size: 20px; display: flex; align-items: center; justify-content: center; user-select: none;
        }
        @media (min-width: 768px) { #mobile-controls { display: none; } }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-layer">
            <div class="hud">
                <span id="scoreEl">SCORE: 0</span>
                <span id="levelEl">LEVEL: 1</span>
            </div>
            <div id="mobile-controls">
                <div class="btn-group">
                    <div class="control-btn" id="btn-left">⟲</div>
                    <div class="control-btn" id="btn-right">⟳</div>
                </div>
                <div class="btn-group">
                    <div class="control-btn" id="btn-thrust">↑</div>
                    <div class="control-btn" id="btn-fire">●</div>
                </div>
            </div>
        </div>
        <div id="start-screen" class="modal">
            <h1>NEON ASTEROIDS</h1>
            <p>ARROWS = MOVE/ROTATE<br>SPACE = FIRE</p>
            <button id="start-btn">INSERT COIN</button>
        </div>
        <div id="game-over-screen" class="modal hidden">
            <h1 style="color: #ff0000; text-shadow: 0 0 10px #ff0000;">SHIP DESTROYED</h1>
            <p id="final-score">SCORE: 0</p>
            <button id="restart-btn">TRY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreEl');
        const levelEl = document.getElementById('levelEl');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        
        let isGameRunning = false;
        
        // Entities
        const ship = { x: 400, y: 300, radius: 15, angle: 0, rotation: 0, thrusting: false, thrust: { x: 0, y: 0 }, velocity: { x: 0, y: 0 } };
        let bullets = [];
        let asteroids = [];
        let particles = [];
        
        let score = 0;
        let level = 1;
        let keys = {};

        function resizeGame() {
            const sizeW = Math.min(window.innerWidth - 20, 800);
            const sizeH = Math.min(window.innerHeight - 60, 600);
            canvas.style.width = `${sizeW}px`;
            canvas.style.height = `${sizeH}px`;
            document.getElementById('game-container').style.width = `${sizeW}px`;
            document.getElementById('game-container').style.height = `${sizeH}px`;
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();

        function createAsteroids() {
            asteroids = [];
            let count = 4 + level;
            for (let i = 0; i < count; i++) {
                let x, y;
                do {
                    x = Math.random() * canvas.width;
                    y = Math.random() * canvas.height;
                } while (Math.hypot(ship.x - x, ship.y - y) < 100); // Prevent spawning on ship

                asteroids.push({
                    x, y,
                    vx: (Math.random() - 0.5) * (level + 1),
                    vy: (Math.random() - 0.5) * (level + 1),
                    radius: 40,
                    vertices: Math.floor(Math.random() * 5 + 7),
                    offsets: Array.from({length: 12}, () => Math.random() * 0.4 + 0.8)
                });
            }
        }

        function spawnParticles(x, y, color, amount) {
            for(let i=0; i<amount; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1, color
                });
            }
        }

        function initGame() {
            ship.x = canvas.width/2; ship.y = canvas.height/2;
            ship.velocity = {x: 0, y: 0}; ship.angle = -Math.PI / 2;
            bullets = []; particles = [];
            score = 0; level = 1;
            updateHUD();
            createAsteroids();
            isGameRunning = true;
            gameLoop();
        }

        function updateHUD() {
            scoreEl.textContent = `SCORE: ${score}`;
            levelEl.textContent = `LEVEL: ${level}`;
        }

        function wrapCoordinates(obj) {
            if (obj.x < 0 - obj.radius) obj.x = canvas.width + obj.radius;
            else if (obj.x > canvas.width + obj.radius) obj.x = 0 - obj.radius;
            
            if (obj.y < 0 - obj.radius) obj.y = canvas.height + obj.radius;
            else if (obj.y > canvas.height + obj.radius) obj.y = 0 - obj.radius;
        }

        function update() {
            // Ship Rotation
            if (keys['ArrowLeft'] || keys['btnLeft']) ship.rotation = -0.1;
            else if (keys['ArrowRight'] || keys['btnRight']) ship.rotation = 0.1;
            else ship.rotation = 0;
            ship.angle += ship.rotation;

            // Ship Thrust
            ship.thrusting = keys['ArrowUp'] || keys['btnThrust'];
            if (ship.thrusting) {
                ship.thrust.x = Math.cos(ship.angle) * 0.1;
                ship.thrust.y = Math.sin(ship.angle) * 0.1;
                // Thruster particles
                particles.push({
                    x: ship.x - Math.cos(ship.angle) * ship.radius,
                    y: ship.y - Math.sin(ship.angle) * ship.radius,
                    vx: -Math.cos(ship.angle) * 2 + (Math.random()-0.5),
                    vy: -Math.sin(ship.angle) * 2 + (Math.random()-0.5),
                    life: 0.5, color: '#00f3ff'
                });
            } else {
                ship.thrust.x = 0; ship.thrust.y = 0;
            }

            // Apply thrust & friction
            ship.velocity.x += ship.thrust.x;
            ship.velocity.y += ship.thrust.y;
            ship.velocity.x *= 0.99; // Friction
            ship.velocity.y *= 0.99;
            ship.x += ship.velocity.x;
            ship.y += ship.velocity.y;
            wrapCoordinates(ship);

            // Bullets
            bullets.forEach((b, i) => {
                b.x += b.vx; b.y += b.vy;
                b.life--;
                if (b.life <= 0) bullets.splice(i, 1);
                wrapCoordinates(b);
            });

            // Asteroids
            asteroids.forEach(a => {
                a.x += a.vx; a.y += a.vy;
                wrapCoordinates(a);
            });

            // Particles
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.02;
                if (p.life <= 0) particles.splice(i, 1);
            });

            // Collisions (Bullet -> Asteroid)
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    let dx = bullets[i].x - asteroids[j].x;
                    let dy = bullets[i].y - asteroids[j].y;
                    if (Math.hypot(dx, dy) < asteroids[j].radius) {
                        spawnParticles(asteroids[j].x, asteroids[j].y, '#ff00ff', 20);
                        score += Math.floor(1000 / asteroids[j].radius);
                        updateHUD();
                        
                        // Break asteroid
                        if (asteroids[j].radius > 15) {
                            for (let k = 0; k < 2; k++) {
                                asteroids.push({
                                    x: asteroids[j].x, y: asteroids[j].y,
                                    vx: asteroids[j].vx + (Math.random()-0.5)*2,
                                    vy: asteroids[j].vy + (Math.random()-0.5)*2,
                                    radius: asteroids[j].radius / 2,
                                    vertices: Math.floor(Math.random() * 4 + 5),
                                    offsets: Array.from({length: 12}, () => Math.random() * 0.4 + 0.8)
                                });
                            }
                        }
                        asteroids.splice(j, 1);
                        bullets.splice(i, 1);
                        break;
                    }
                }
            }

            // Collision (Ship -> Asteroid)
            for (let j = asteroids.length - 1; j >= 0; j--) {
                let dx = ship.x - asteroids[j].x;
                let dy = ship.y - asteroids[j].y;
                if (Math.hypot(dx, dy) < ship.radius + asteroids[j].radius) {
                    gameOver();
                }
            }

            // Level up
            if (asteroids.length === 0) {
                level++;
                createAsteroids();
                updateHUD();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Ship
            
            
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ship.x + Math.cos(ship.angle) * ship.radius, ship.y + Math.sin(ship.angle) * ship.radius);
            ctx.lineTo(ship.x + Math.cos(ship.angle + 2.5) * ship.radius, ship.y + Math.sin(ship.angle + 2.5) * ship.radius);
            ctx.lineTo(ship.x + Math.cos(ship.angle - 2.5) * ship.radius, ship.y + Math.sin(ship.angle - 2.5) * ship.radius);
            ctx.closePath();
            ctx.stroke();

            // Draw Asteroids
            
            ctx.strokeStyle = '#ff00ff';
            asteroids.forEach(a => {
                ctx.beginPath();
                for (let i = 0; i < a.vertices; i++) {
                    let ang = (i / a.vertices) * Math.PI * 2;
                    let x = a.x + Math.cos(ang) * a.radius * a.offsets[i];
                    let y = a.y + Math.sin(ang) * a.radius * a.offsets[i];
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
            });

            // Draw Bullets
            
            ctx.fillStyle = '#39ff14';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Particles
            particles.forEach(p => {
                
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 2, 2);
            });
            ctx.globalAlpha = 1;
            
        }

        function gameLoop() {
            if (!isGameRunning) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isGameRunning = false;
            spawnParticles(ship.x, ship.y, '#00f3ff', 50);
            draw(); // Draw final explosion
            finalScoreEl.textContent = `SCORE: ${score}`;
            setTimeout(() => gameOverScreen.classList.remove('hidden'), 1000);
        }

        function fire() {
            if(isGameRunning && bullets.length < 5) {
                bullets.push({
                    x: ship.x + Math.cos(ship.angle) * ship.radius,
                    y: ship.y + Math.sin(ship.angle) * ship.radius,
                    vx: Math.cos(ship.angle) * 10,
                    vy: Math.sin(ship.angle) * 10,
                    radius: 2, life: 60
                });
            }
        }

        // Inputs
        window.addEventListener('keydown', e => {
            if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
            keys[e.code] = true;
            if(e.code === 'Space') fire();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Mobile Controls mapping
        const btnMap = { 'btn-left': 'btnLeft', 'btn-right': 'btnRight', 'btn-thrust': 'btnThrust' };
        for (let id in btnMap) {
            let el = document.getElementById(id);
            el.addEventListener('touchstart', e => { e.preventDefault(); keys[btnMap[id]] = true; });
            el.addEventListener('touchend', e => { e.preventDefault(); keys[btnMap[id]] = false; });
        }
        document.getElementById('btn-fire').addEventListener('touchstart', e => { e.preventDefault(); fire(); });

        document.getElementById('start-btn').addEventListener('click', () => {
            startScreen.classList.add('hidden');
            initGame();
        });
        document.getElementById('restart-btn').addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            initGame();
        });
    </script>
</body>
</html>
