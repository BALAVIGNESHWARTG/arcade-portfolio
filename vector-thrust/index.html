<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vector Thrust</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap');

        :root {
            --bg: #030a16;
            --ship: #00ffff;
            --thrust: #ff8c00;
            --terrain: #ff2a55;
            --pad: #00ff66;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0; padding: 0; background-color: #000; color: #fff;
            font-family: 'JetBrains Mono', monospace; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        #game-container {
            position: relative; width: 100%; height: 100%; max-width: 800px; max-height: 600px;
            background: linear-gradient(180deg, #02060d, #081224);
            border: 1px solid rgba(0, 255, 255, 0.2); box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            overflow: hidden; border-radius: 12px;
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 5; }

        .hud {
            position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between;
            font-size: 14px; z-index: 10; pointer-events: none; font-weight: 500;
        }
        
        .hud-panel {
            background: rgba(3, 10, 22, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; gap: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .hud-right { text-align: right; }
        
        .alert { color: #ff2a55; font-weight: 800; animation: pulse 0.5s infinite; text-shadow: 0 0 8px #ff2a55; }
        .safe { color: var(--pad); font-weight: 800; text-shadow: 0 0 8px var(--pad); }
        @keyframes pulse { 50% { opacity: 0.5; } }

        /* Glassmorphism Modals */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(3, 10, 22, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px; text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05); z-index: 30;
            border-radius: 16px; pointer-events: auto; width: 85%; max-width: 450px;
        }
        h1 { color: #fff; margin-top: 0; font-size: 34px; text-shadow: 0 0 15px var(--ship); margin-bottom: 20px; letter-spacing: 1px; }
        p { color: #8a9cb5; line-height: 1.6; font-size: 13px; margin-bottom: 30px; }
        
        button {
            background: linear-gradient(135deg, rgba(0,255,255,0.2), rgba(0,255,255,0.05));
            color: #fff; border: 1px solid rgba(0,255,255,0.4);
            padding: 12px 35px; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 800;
            cursor: pointer; transition: 0.2s; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            text-transform: uppercase; letter-spacing: 2px;
        }
        button:hover { background: linear-gradient(135deg, rgba(0,255,255,0.3), rgba(0,255,255,0.1)); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,255,255,0.2); }
        button:active { transform: translateY(1px); }
        .hidden { display: none !important; }

        #controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; z-index: 20;
        }
        .btn-dir {
            width: 65px; height: 65px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8);
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-dir:active { background: rgba(255,255,255,0.2); border-color: #fff; }
        .btn-thrust { width: 110px; border-radius: 35px; font-size: 24px; font-weight: 800; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
            <div class="hud-panel">
                <div id="fuelEl" style="color: var(--ship)">FUEL: 100%</div>
                <div id="scoreEl">SCORE: 0</div>
            </div>
            <div class="hud-panel hud-right">
                <div id="altEl">ALT: 100m</div>
                <div id="vsEl">VS: -0.0 m/s</div>
                <div id="hsEl">HS: 0.0 m/s</div>
                <div id="angEl">ANG: 0°</div>
            </div>
        </div>
        
        <div id="controls">
            <div class="btn-dir" id="btn-left">◀</div>
            <div class="btn-dir btn-thrust" id="btn-thrust">▲</div>
            <div class="btn-dir" id="btn-right">▶</div>
        </div>

        <div id="start-screen" class="modal">
            <h1>VECTOR THRUST</h1>
            <p>Land gently on the Green Pads.<br>Keep Vertical Speed <span class="safe">&lt; 100</span> and Horizontal Speed <span class="safe">&lt; 40</span>.<br>Keep ship level (<span class="safe">±15°</span>).</p>
            <button id="start-btn">LAUNCH</button>
        </div>
        
        <div id="game-over-screen" class="modal hidden">
            <h1 id="result-title" style="color: var(--terrain); text-shadow: 0 0 15px var(--terrain);">CRASHED</h1>
            <p id="final-stats">Hull integrity compromised.</p>
            <button id="restart-btn" style="border-color: rgba(255,42,85,0.5); background: linear-gradient(135deg, rgba(255,42,85,0.2), rgba(255,42,85,0.05));">NEXT MISSION</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        let width, height;
        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width; canvas.height = height;
        }
        window.addEventListener('resize', resize); resize();

        let isRunning = false;
        let score = 0;
        let level = 1;

        // Physics Constants (Substepped to prevent high-velocity tunneling)
        const SUBSTEPS = 3;
        const DT = 1 / SUBSTEPS;
        const GRAVITY = 0.02 * DT;
        const THRUST = 0.06 * DT;
        const ROTATE_SPEED = 0.06 * DT;

        let ship = { x: 0, y: 0, vx: 0, vy: 0, angle: 0, fuel: 1000 };

        let terrain = [];
        let pad = { x: 0, y: 0, w: 80 }; // Wider pad
        
        let particles = [];

        function generateTerrain() {
            terrain = [];
            let points = 25; // More points for jagged look
            let spacing = width / points;
            
            let padIndex = Math.floor(Math.random() * (points - 8)) + 4;
            
            let currentY = height - 120 - Math.random()*200;
            
            for(let i=0; i<=points; i++) {
                if (i === padIndex) {
                    pad.x = i * spacing;
                    pad.y = currentY;
                    terrain.push({x: i * spacing, y: currentY});
                    terrain.push({x: (i+3) * spacing, y: currentY}); 
                    pad.w = spacing * 3;
                    i += 2; 
                } else {
                    currentY += (Math.random() - 0.5) * 160;
                    if (currentY > height - 30) currentY = height - 30;
                    if (currentY < height/2 + 50) currentY = height/2 + 50;
                    terrain.push({x: i * spacing, y: currentY});
                }
            }
        }

        // Line intersection logic
        function lineIntersect(x1,y1,x2,y2, x3,y3,x4,y4) {
            let det = (x1-x2)*(y3-y4) - (y1-y2)*(x3-x4);
            if (det === 0) return false;
            let t = ((x1-x3)*(y3-y4) - (y1-y3)*(x3-x4)) / det;
            let u = -((x1-x2)*(y1-y3) - (y1-y2)*(x1-x3)) / det;
            return (t >= 0 && t <= 1 && u >= 0 && u <= 1);
        }

        function checkCollision() {
            if (!isRunning) return; // Prevent multiple triggers

            let cos = Math.cos(ship.angle);
            let sin = Math.sin(ship.angle);
            
            let nx = ship.x - 10 * sin;
            let ny = ship.y - 10 * cos;
            let blx = ship.x - 8 * cos - 10 * sin;
            let bly = ship.y - 8 * sin + 10 * cos;
            let brx = ship.x + 8 * cos - 10 * sin;
            let bry = ship.y + 8 * sin + 10 * cos;

            let shipLines = [
                {x1: nx, y1: ny, x2: blx, y2: bly},
                {x1: blx, y1: bly, x2: brx, y2: bry}, // Bottom edge
                {x1: brx, y1: bry, x2: nx, y2: ny}
            ];

            // Pad check first (using bottom edge)
            let padLine = {x1: pad.x, y1: pad.y, x2: pad.x + pad.w, y2: pad.y};
            
            if (lineIntersect(shipLines[1].x1, shipLines[1].y1, shipLines[1].x2, shipLines[1].y2, padLine.x1, padLine.y1, padLine.x2, padLine.y2)) {
                
                // Get display values
                let vs = ship.vy * 60; // display scalar
                let hs = Math.abs(ship.vx * 60);
                
                let a = ((ship.angle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
                if (a > Math.PI) a -= Math.PI*2;
                let angleDeg = Math.abs(a * (180/Math.PI));
                
                // Increased tolerance
                if (vs < 100 && hs < 40 && angleDeg < 15) {
                    winMission();
                    return;
                } else {
                    crash();
                    return;
                }
            }

            // Terrain check
            for(let i=0; i<terrain.length-1; i++) {
                let t1 = terrain[i]; let t2 = terrain[i+1];
                for(let sl of shipLines) {
                    if (lineIntersect(sl.x1, sl.y1, sl.x2, sl.y2, t1.x, t1.y, t2.x, t2.y)) {
                        crash();
                        return;
                    }
                }
            }
            
            if (ship.x < 0 || ship.x > width || ship.y < 0 || ship.y > height) crash();
        }

        function createExplosion(x, y) {
            for(let i=0; i<40; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12,
                    life: 50, color: Math.random() > 0.5 ? 'var(--thrust)' : 'var(--terrain)'
                });
            }
        }

        function updatePhysics() {
            ship.vy += GRAVITY;

            if (ship.fuel > 0 && (keys['ArrowUp'] || keys['KeyW'] || btnThrust)) {
                ship.vx += Math.sin(ship.angle) * THRUST;
                ship.vy -= Math.cos(ship.angle) * THRUST;
                ship.fuel -= (1 * DT);
                
                // Particles spawn less frequently in substeps to avoid visual spam, random check
                if (Math.random() < 0.3) {
                    particles.push({
                        x: ship.x - Math.sin(ship.angle)*12,
                        y: ship.y + Math.cos(ship.angle)*12,
                        vx: -Math.sin(ship.angle)*3 + (Math.random()-0.5)*1.5,
                        vy: Math.cos(ship.angle)*3 + (Math.random()-0.5)*1.5,
                        life: 20, color: 'var(--thrust)'
                    });
                }
            }

            if (keys['ArrowLeft'] || keys['KeyA'] || btnLeft) ship.angle -= ROTATE_SPEED;
            if (keys['ArrowRight'] || keys['KeyD'] || btnRight) ship.angle += ROTATE_SPEED;

            ship.x += ship.vx;
            ship.y += ship.vy;

            checkCollision();
        }

        function update() {
            for(let i=0; i<SUBSTEPS; i++) {
                if (isRunning) updatePhysics();
            }

            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Update UI
            let fuelPct = Math.max(0, Math.floor((ship.fuel / 1000) * 100));
            let fEl = document.getElementById('fuelEl');
            fEl.textContent = `FUEL: ${fuelPct}%`;
            if (fuelPct < 20) { fEl.classList.add('alert'); fEl.style.color = ''; }
            else { fEl.classList.remove('alert'); fEl.style.color = 'var(--ship)'; }
            
            let alt = pad.y - ship.y;
            document.getElementById('altEl').textContent = `ALT: ${Math.floor(alt)}m`;
            
            let vs = ship.vy * 60; 
            let vsEl = document.getElementById('vsEl');
            vsEl.textContent = `VS: ${vs.toFixed(1)} m/s`;
            if (vs > 100) { vsEl.classList.add('alert'); vsEl.classList.remove('safe'); }
            else { vsEl.classList.remove('alert'); vsEl.classList.add('safe'); }
            
            let hs = ship.vx * 60;
            let hsEl = document.getElementById('hsEl');
            hsEl.textContent = `HS: ${Math.abs(hs).toFixed(1)} m/s`;
            if (Math.abs(hs) > 40) { hsEl.classList.add('alert'); hsEl.classList.remove('safe'); }
            else { hsEl.classList.remove('alert'); hsEl.classList.add('safe'); }

            let a = ((ship.angle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
            if (a > Math.PI) a -= Math.PI*2;
            let angleDeg = Math.round(a * (180/Math.PI));
            let angEl = document.getElementById('angEl');
            angEl.textContent = `ANG: ${angleDeg}°`;
            if (Math.abs(angleDeg) > 15) { angEl.classList.add('alert'); angEl.classList.remove('safe'); }
            else { angEl.classList.remove('alert'); angEl.classList.add('safe'); }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Terrain
            ctx.strokeStyle = 'rgba(255, 42, 85, 0.8)';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = 'var(--terrain)';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(terrain[0].x, terrain[0].y);
            for(let i=1; i<terrain.length; i++) {
                ctx.lineTo(terrain[i].x, terrain[i].y);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            // Fill under terrain
            ctx.lineTo(width, height); ctx.lineTo(0, height);
            ctx.fillStyle = 'rgba(255, 42, 85, 0.05)';
            ctx.fill();

            // Draw Pad
            ctx.strokeStyle = 'var(--pad)';
            ctx.lineWidth = 6;
            ctx.shadowColor = 'var(--pad)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(pad.x, pad.y);
            ctx.lineTo(pad.x + pad.w, pad.y);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Draw Ship
            if (isRunning) { 
                ctx.save();
                ctx.translate(ship.x, ship.y);
                ctx.rotate(ship.angle);
                
                ctx.strokeStyle = 'var(--ship)';
                ctx.lineWidth = 2;
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.moveTo(0, -12); // nose
                ctx.lineTo(-8, 10);
                ctx.lineTo(8, 10);
                ctx.closePath();
                
                ctx.shadowColor = 'var(--ship)';
                ctx.shadowBlur = 10;
                ctx.fill(); ctx.stroke();
                ctx.shadowBlur = 0;
                
                // Legs
                ctx.beginPath(); ctx.moveTo(-8, 10); ctx.lineTo(-12, 16); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(8, 10); ctx.lineTo(12, 16); ctx.stroke();
                
                ctx.restore();
            }

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 50; 
                ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function loop() {
            if(!isRunning && particles.length === 0) return; 
            update(); // Handles physics if running, else just particles
            draw();
            requestAnimationFrame(loop);
        }

        function crash() {
            isRunning = false;
            createExplosion(ship.x, ship.y);
            
            let modal = document.getElementById('game-over-screen');
            let btn = document.getElementById('restart-btn');
            
            setTimeout(() => {
                document.getElementById('result-title').textContent = 'CRASHED';
                document.getElementById('result-title').style.color = 'var(--terrain)';
                document.getElementById('result-title').style.textShadow = '0 0 15px var(--terrain)';
                document.getElementById('final-stats').textContent = `Hull integrity compromised.`;
                
                btn.style.borderColor = 'rgba(255,42,85,0.5)';
                btn.style.background = 'linear-gradient(135deg, rgba(255,42,85,0.2), rgba(255,42,85,0.05))';
                btn.textContent = "RETRY MISSION";
                
                modal.classList.remove('hidden');
            }, 1000);
        }

        function winMission() {
            isRunning = false;
            score += 100 * level;
            document.getElementById('scoreEl').textContent = `SCORE: ${score}`;
            
            let modal = document.getElementById('game-over-screen');
            let btn = document.getElementById('restart-btn');
            
            setTimeout(() => {
                document.getElementById('result-title').textContent = 'PERFECT LANDING';
                document.getElementById('result-title').style.color = 'var(--pad)';
                document.getElementById('result-title').style.textShadow = '0 0 15px var(--pad)';
                document.getElementById('final-stats').textContent = `Mission ${level} successful.`;
                
                btn.style.borderColor = 'rgba(0,255,102,0.5)';
                btn.style.background = 'linear-gradient(135deg, rgba(0,255,102,0.2), rgba(0,255,102,0.05))';
                btn.textContent = "NEXT LEVEL";
                
                modal.classList.remove('hidden');
                level++;
            }, 1000);
        }

        // Input Handling
        let keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });
        
        let btnLeft=false, btnRight=false, btnThrust=false;
        const bindBtn = (id, setter) => {
            let el = document.getElementById(id);
            el.addEventListener('mousedown', e => { e.preventDefault(); setter(true); });
            el.addEventListener('mouseup', e => { e.preventDefault(); setter(false); });
            el.addEventListener('mouseleave', e => { e.preventDefault(); setter(false); });
            el.addEventListener('touchstart', e => { e.preventDefault(); setter(true); }, {passive:false});
            el.addEventListener('touchend', e => { e.preventDefault(); setter(false); });
        };

        bindBtn('btn-left', val => btnLeft = val);
        bindBtn('btn-right', val => btnRight = val);
        bindBtn('btn-thrust', val => btnThrust = val);

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            if (document.getElementById('result-title').textContent === 'CRASHED') {
                score = 0; level = 1; document.getElementById('scoreEl').textContent = `SCORE: 0`;
            }

            generateTerrain();
            
            ship = { x: 100, y: 100, vx: 2 * DT, vy: 0, angle: Math.PI/2, fuel: 1000 };
            particles = [];
            
            isRunning = true;
            loop();
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
