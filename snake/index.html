<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Cyberpunk Snake: 2 Player Battle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #050510;
            --grid-line: rgba(0, 255, 255, 0.1);
            --s1-color: #39ff14;
            --s1-glow: 0 0 10px #39ff14;
            --s2-color: #0ff;
            --s2-glow: 0 0 10px #0ff;
            --food-color: #ff00ff;
            --food-glow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            --ui-bg: rgba(0, 0, 0, 0.85);
            --border-color: #fff;
        }

        * {
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.6);
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            z-index: 10;
        }

        .s1-score { color: var(--s1-color); text-shadow: var(--s1-glow); }
        .s2-score { color: var(--s2-color); text-shadow: var(--s2-glow); }

        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--ui-bg);
            border: 2px solid var(--border-color);
            padding: 40px;
            text-align: center;
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            z-index: 20;
            width: 80%;
            max-width: 450px;
            display: none;
        }

        .modal.active {
            display: block;
        }

        h1 {
            color: #fff;
            text-shadow: 0 0 10px #fff;
            margin-bottom: 20px;
            font-size: 24px;
            line-height: 1.5;
        }

        p {
            margin-bottom: 20px;
            line-height: 1.6;
            font-size: 12px;
            color: #ccc;
        }

        button {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            padding: 15px 30px;
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            background: #fff;
            color: #000;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.6;
        }
        
        .controls-hint {
            margin-top: 15px;
            font-size: 10px;
            color: #888;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <div id="ui-layer">
            <div class="hud">
                <span class="s1-score" id="score1">P1(WASD): 0</span>
                <span class="s2-score" id="score2">P2(ARROWS): 0</span>
            </div>
        </div>

        <div class="modal active" id="start-screen">
            <h1>SNAKE 2-PLAYER</h1>
            <p><span class="s1-score">P1 (GREEN): WASD</span><br><br><span class="s2-score">P2 (BLUE): ARROWS</span></p>
            <p>Cut off your opponent to make them crash!<br>Grab pink food to grow.</p>
            <button id="start-btn">FIGHT</button>
        </div>

        <div class="modal" id="game-over-screen">
            <h1 id="winner-text">GAME OVER</h1>
            <p id="final-scores">P1: 0 | P2: 0</p>
            <button id="restart-btn">REMATCH</button>
        </div>
    </div>
    
    <div class="controls-hint">Local Multiplayer<br>P1: WASD | P2: Arrow Keys</div>

    <script>
        const CANVAS_SIZE = 600;
        const GRID_SIZE = 20;
        const TILE_COUNT = CANVAS_SIZE / GRID_SIZE;
        const BASE_SPEED = 90;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const score1El = document.getElementById('score1');
        const score2El = document.getElementById('score2');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const winnerText = document.getElementById('winner-text');
        const finalScores = document.getElementById('final-scores');
        const gameContainer = document.getElementById('game-container');

        let p1, p2, food;
        let isGameRunning = false;
        let lastTime = 0;
        let speed = BASE_SPEED;
        let foodBlink = 0;

        function resizeGame() {
            const maxWidth = window.innerWidth - 40;
            const maxHeight = window.innerHeight - 80;
            const size = Math.min(maxWidth, maxHeight, 600);
            
            canvas.style.width = `${size}px`;
            canvas.style.height = `${size}px`;
            gameContainer.style.width = `${size}px`;
            gameContainer.style.height = `${size}px`;
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();

        function initPlayer(x, y, vx, vy, color, name) {
            return {
                body: [{x, y}, {x: x-vx, y: y-vy}, {x: x-vx*2, y: y-vy*2}],
                vx, vy,
                nextVx: vx, nextVy: vy,
                color, name, score: 0, dead: false
            };
        }

        function initGame() {
            p1 = initPlayer(5, Math.floor(TILE_COUNT/2), 1, 0, '#39ff14', 'P1');
            p2 = initPlayer(TILE_COUNT-6, Math.floor(TILE_COUNT/2), -1, 0, '#0ff', 'P2');
            
            score1El.textContent = `P1: 0`;
            score2El.textContent = `P2: 0`;
            speed = BASE_SPEED;
            placeFood();
            
            isGameRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function placeFood() {
            let valid = false;
            while (!valid) {
                food = { x: Math.floor(Math.random() * TILE_COUNT), y: Math.floor(Math.random() * TILE_COUNT) };
                let onP1 = p1.body.some(s => s.x === food.x && s.y === food.y);
                let onP2 = p2.body.some(s => s.x === food.x && s.y === food.y);
                if (!onP1 && !onP2) valid = true;
            }
        }

        function gameLoop(ts) {
            if (!isGameRunning) return;
            requestAnimationFrame(gameLoop);

            let dt = ts - lastTime;
            foodBlink += dt;
            if (dt >= speed) {
                update();
                draw();
                lastTime = ts;
            }
        }

        function movePlayer(p) {
            if (p.dead) return;
            p.vx = p.nextVx; p.vy = p.nextVy;
            let h = p.body[0];
            p.headNext = { x: h.x + p.vx, y: h.y + p.vy };
        }

        function checkCollisions() {
            // Check walls
            [p1, p2].forEach(p => {
                if (!p.dead) {
                    if (p.headNext.x < 0 || p.headNext.x >= TILE_COUNT || p.headNext.y < 0 || p.headNext.y >= TILE_COUNT) {
                        p.dead = true;
                    }
                }
            });

            // Head to Head tie
            if (!p1.dead && !p2.dead && p1.headNext.x === p2.headNext.x && p1.headNext.y === p2.headNext.y) {
                p1.dead = true; p2.dead = true;
            }

            // Check against bodies
            let p1b = p1.body, p2b = p2.body;
            
            if (!p1.dead) {
                if (p1b.some(s => s.x === p1.headNext.x && s.y === p1.headNext.y)) p1.dead = true;
                if (p2b.some(s => s.x === p1.headNext.x && s.y === p1.headNext.y)) p1.dead = true;
            }
            if (!p2.dead) {
                if (p2b.some(s => s.x === p2.headNext.x && s.y === p2.headNext.y)) p2.dead = true;
                if (p1b.some(s => s.x === p2.headNext.x && s.y === p2.headNext.y)) p2.dead = true;
            }
        }

        function applyMoves() {
            [p1, p2].forEach(p => {
                if (!p.dead) {
                    p.body.unshift(p.headNext);
                    if (p.headNext.x === food.x && p.headNext.y === food.y) {
                        p.score += 10;
                        if (p === p1) score1El.textContent = `P1: ${p.score}`;
                        else score2El.textContent = `P2: ${p.score}`;
                        // speedup
                        if (speed > 40) speed -= 1;
                        placeFood();
                    } else {
                        p.body.pop();
                    }
                }
            });
        }

        function update() {
            movePlayer(p1);
            movePlayer(p2);
            checkCollisions();
            
            if (p1.dead || p2.dead) {
                gameOver();
                return;
            }
            
            applyMoves();
        }

        function draw() {
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for(let i=0; i<TILE_COUNT; i++) {
                ctx.beginPath(); ctx.moveTo(i*GRID_SIZE, 0); ctx.lineTo(i*GRID_SIZE, CANVAS_SIZE); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i*GRID_SIZE); ctx.lineTo(CANVAS_SIZE, i*GRID_SIZE); ctx.stroke();
            }

            // Draw Food
            if (Math.floor(foodBlink / 200) % 2 === 0) {
                ctx.fillStyle = "#ff00ff";
                ctx.beginPath();
                ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw Snakes
            [p1, p2].forEach(p => {
                ctx.fillStyle = p.color;
                p.body.forEach((s, i) => {
                    ctx.globalAlpha = p.dead ? 0.4 : (i===0 ? 1 : 0.8);
                    ctx.fillRect(s.x * GRID_SIZE + 1, s.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
                });
                ctx.globalAlpha = 1;
            });
        }

        function gameOver() {
            isGameRunning = false;
            draw(); // Draw final state
            
            let wText = "DRAW!";
            let wColor = "#fff";
            
            if (p1.dead && !p2.dead) { wText = "P2 WINS!"; wColor = p2.color; }
            else if (p2.dead && !p1.dead) { wText = "P1 WINS!"; wColor = p1.color; }
            else { 
                // Both died same frame, check score
                if (p1.score > p2.score) { wText = "P1 WINS ON SCORE!"; wColor = p1.color; }
                else if (p2.score > p1.score) { wText = "P2 WINS ON SCORE!"; wColor = p2.color; }
            }
            
            winnerText.textContent = wText;
            winnerText.style.color = wColor;
            winnerText.style.textShadow = `0 0 10px ${wColor}`;
            finalScores.textContent = `P1: ${p1.score} | P2: ${p2.score}`;
            
            setTimeout(() => {
                gameOverScreen.classList.add('active');
            }, 500);
        }

        // Input
        document.addEventListener('keydown', e => {
            if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","KeyW","KeyA","KeyS","KeyD"].includes(e.code)) {
                e.preventDefault();
            }
            
            if (!isGameRunning) return;

            // P1 WASD
            if (e.code === 'KeyW' && p1.vy === 0) { p1.nextVx = 0; p1.nextVy = -1; }
            if (e.code === 'KeyS' && p1.vy === 0) { p1.nextVx = 0; p1.nextVy = 1; }
            if (e.code === 'KeyA' && p1.vx === 0) { p1.nextVx = -1; p1.nextVy = 0; }
            if (e.code === 'KeyD' && p1.vx === 0) { p1.nextVx = 1; p1.nextVy = 0; }

            // P2 Arrows
            if (e.code === 'ArrowUp' && p2.vy === 0) { p2.nextVx = 0; p2.nextVy = -1; }
            if (e.code === 'ArrowDown' && p2.vy === 0) { p2.nextVx = 0; p2.nextVy = 1; }
            if (e.code === 'ArrowLeft' && p2.vx === 0) { p2.nextVx = -1; p2.nextVy = 0; }
            if (e.code === 'ArrowRight' && p2.vx === 0) { p2.nextVx = 1; p2.nextVy = 0; }
        });

        startBtn.addEventListener('click', () => {
            startScreen.classList.remove('active');
            initGame();
        });

        restartBtn.addEventListener('click', () => {
            gameOverScreen.classList.remove('active');
            initGame();
        });

    </script>
</body>
</html>
