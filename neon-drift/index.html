<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Drift</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Electrolize&display=swap');

        :root {
            --bg: #090a0f;
            --track: #1c1c28;
            --border: #e94560;
            --player: #00ffcc;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0; padding: 0; background-color: #000; color: #fff;
            font-family: 'Electrolize', sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        #game-container {
            position: relative; width: 100%; height: 100%; max-width: 800px; max-height: 600px;
            background-color: var(--bg);
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.2); border: 2px solid var(--border);
            overflow: hidden; border-radius: 5px;
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 5; }

        .hud {
            position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between;
            font-size: 24px; z-index: 10; pointer-events: none; text-shadow: 0 0 10px #00ffcc;
        }

        /* Modals */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(9, 10, 15, 0.9); border: 2px solid var(--player); padding: 40px;
            text-align: center; box-shadow: 0 0 30px rgba(0, 255, 204, 0.4); z-index: 30;
            border-radius: 10px; pointer-events: auto; width: 85%; max-width: 450px;
        }
        h1 { color: var(--player); margin-top: 0; font-size: 40px; text-shadow: 0 0 20px var(--player); margin-bottom: 10px; }
        p { color: #aaa; line-height: 1.5; font-size: 16px; margin-bottom: 30px; }
        button {
            background: transparent; color: var(--player); border: 2px solid var(--player);
            padding: 15px 40px; font-family: 'Electrolize', sans-serif; font-size: 24px; cursor: pointer; transition: 0.2s;
            border-radius: 5px; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); text-transform: uppercase;
        }
        button:hover { background: var(--player); color: #000; box-shadow: 0 0 30px var(--player); }
        .hidden { display: none !important; }

        #controls {
            position: absolute; bottom: 10px; left: 0; width: 100%; height: 100px;
            display: flex; justify-content: space-between; padding: 0 20px; z-index: 20;
        }
        .btn-zone { 
            width: 80px; height: 80px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.5);
        }
        .btn-zone:active { background: rgba(255,255,255,0.2); }
        .controls-left { display: flex; gap: 20px; }
        .controls-right { display: flex; gap: 20px; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
            <div id="lapEl">LAP: 1/3</div>
            <div id="timeEl">0.00s</div>
        </div>
        
        <div id="controls">
            <div class="controls-left">
                <div class="btn-zone" id="btn-left">L</div>
                <div class="btn-zone" id="btn-right">R</div>
            </div>
            <div class="controls-right">
                <div class="btn-zone" id="btn-brake">B</div>
                <div class="btn-zone" id="btn-gas">A</div>
            </div>
        </div>

        <div id="start-screen" class="modal">
            <h1>Neon Drift</h1>
            <p>Use Arrows or On-screen buttons to drive.<br>Drift around corners to keep speed.<br>Complete 3 laps!</p>
            <button id="start-btn">RACE</button>
        </div>
        
        <div id="game-over-screen" class="modal hidden">
            <h1 id="result-title">FINISHED</h1>
            <p id="final-stats">Time: 0.00s</p>
            <button id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        let width, height;
        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width; canvas.height = height;
        }
        window.addEventListener('resize', resize); resize();

        let isRunning = false;
        let timeElapsed = 0;
        let laps = 0;
        let maxLaps = 3;
        let checkpoints = [false, false, false, false];

        // Physics
        let car = {
            x: 0, y: 0, angle: 0, 
            vx: 0, vy: 0, speed: 0,
            w: 20, h: 40
        };

        const ACCEL = 0.2;
        const MAX_SPEED = 12;
        const FRICTION = 0.98;
        const OFFROAD_FRICTION = 0.90;
        const TURN_SPEED = 0.08;
        const DRIFT_FACTOR = 0.15; // How fast velocity aligns with facing angle

        let particles = [];
        let skidmarks = [];
        let cameraX = 0, cameraY = 0;

        // Track Design (Simple path loop)
        const trackPath = [
            {x: 400, y: 800}, // Start (bottom straight)
            {x: 1200, y: 800},
            {x: 1400, y: 600}, // curve up
            {x: 1400, y: -200},
            {x: 1200, y: -400}, // curve left
            {x: -400, y: -400},
            {x: -600, y: -200}, // curve down
            {x: -600, y: 600},
            {x: -400, y: 800} // back to start
        ];
        
        const TRACK_WIDTH = 200;

        function checkCheckpoint() {
            // Very simple checkpoint logic based on Y and X position
            if (car.x > 300 && car.x < 500 && car.y > 700) checkpoints[0] = true; // Start line
            if (car.x > 1200 && car.y < 200 && car.y > 0) checkpoints[1] = true; // Right side
            if (car.x < 400 && car.x > 200 && car.y < -300) checkpoints[2] = true; // Top side
            if (car.x < -500 && car.y < 400 && car.y > 200) checkpoints[3] = true; // Left side

            // Cross start line after getting all checkpoints
            if (checkpoints[0] && checkpoints[1] && checkpoints[2] && checkpoints[3]) {
                if (car.x > 300 && car.x < 500 && car.y > 700) {
                    laps++;
                    checkpoints = [true, false, false, false]; // Reset all except start
                    document.getElementById('lapEl').textContent = `LAP: ${Math.min(laps+1, maxLaps)}/${maxLaps}`;
                    if (laps >= maxLaps) winGame();
                }
            }
        }

        // Distance from point to line segment
        function distToSegmentSquared(p, v, w) {
            let l2 = (v.x - w.x)**2 + (v.y - w.y)**2;
            if (l2 === 0) return (p.x - v.x)**2 + (p.y - v.y)**2;
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return (p.x - (v.x + t * (w.x - v.x)))**2 + (p.y - (v.y + t * (w.y - v.y)))**2;
        }

        function isOffRoad(x, y) {
            let minD = Infinity;
            for(let i=0; i<trackPath.length-1; i++) {
                let d = distToSegmentSquared({x, y}, trackPath[i], trackPath[i+1]);
                if (d < minD) minD = d;
            }
            return Math.sqrt(minD) > TRACK_WIDTH/2;
        }

        function createSkidmark() {
            skidmarks.push({
                x: car.x, y: car.y, angle: car.angle,
                life: 300 // frames until fade
            });
            if (skidmarks.length > 200) skidmarks.shift();
        }

        function update() {
            timeElapsed += 1/60;
            document.getElementById('timeEl').textContent = timeElapsed.toFixed(2) + 's';

            // Input
            let steering = 0;
            if (keys['ArrowLeft'] || keys['KeyA'] || btnLeft) steering = -1;
            if (keys['ArrowRight'] || keys['KeyD'] || btnRight) steering = 1;
            
            let gas = 0;
            if (keys['ArrowUp'] || keys['KeyW'] || btnGas) gas = 1;
            if (keys['ArrowDown'] || keys['KeyS'] || btnBrake) gas = -1;

            // Apply steering
            // Can only steer if moving
            let moveDir = Math.sign(car.speed) || 1;
            if (Math.abs(car.speed) > 1) {
                car.angle += steering * TURN_SPEED * moveDir;
            }

            // Target velocity vector based on facing angle
            let targetVx = Math.sin(car.angle) * car.speed;
            let targetVy = -Math.cos(car.angle) * car.speed;

            // Drift interpolation
            car.vx += (targetVx - car.vx) * DRIFT_FACTOR;
            car.vy += (targetVy - car.vy) * DRIFT_FACTOR;

            // Gas / Brake applied to speed
            car.speed += gas * ACCEL;
            
            // Speed limits & friction
            let offRoad = isOffRoad(car.x, car.y);
            let currentFriction = offRoad ? OFFROAD_FRICTION : FRICTION;
            car.speed *= currentFriction;
            
            // Actual position update
            car.x += car.vx;
            car.y += car.vy;

            // Calculate drift amount (difference between velocity angle and facing angle)
            let velAngle = Math.atan2(car.vx, -car.vy); // 0 is up
            let angleDiff = Math.abs((car.angle - velAngle + Math.PI*3) % (Math.PI*2) - Math.PI);
            
            if (Math.abs(car.speed) > 3 && angleDiff > 0.5) {
                createSkidmark();
                // Sparks if drifting hard
                if (Math.random() < 0.3) {
                    particles.push({
                        x: car.x, y: car.y,
                        vx: -car.vx*0.5 + (Math.random()-0.5)*2,
                        vy: -car.vy*0.5 + (Math.random()-0.5)*2,
                        life: 20, color: '#e94560'
                    });
                }
            }

            // Camera follow
            cameraX += (car.x - width/2 - cameraX) * 0.1;
            cameraY += (car.y - height/2 - cameraY) * 0.1;

            checkCheckpoint();

            // Particles update
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                if(p.life <= 0) particles.splice(i, 1);
            }
            
            // Skidmarks fade
            for(let i=skidmarks.length-1; i>=0; i--) {
                skidmarks[i].life--;
                if(skidmarks[i].life <= 0) skidmarks.splice(i, 1);
            }
        }

        function draw() {
            // Draw grid bg
            ctx.fillStyle = 'var(--bg)';
            ctx.fillRect(0, 0, width, height);
            
            ctx.save();
            ctx.translate(-cameraX, -cameraY);

            // Draw Grid lines
            ctx.strokeStyle = 'rgba(233, 69, 96, 0.1)';
            ctx.lineWidth = 2;
            let startX = Math.floor(cameraX / 100) * 100;
            let startY = Math.floor(cameraY / 100) * 100;
            ctx.beginPath();
            for(let x = startX; x < cameraX + width; x+=100) { ctx.moveTo(x, cameraY); ctx.lineTo(x, cameraY+height); }
            for(let y = startY; y < cameraY + height; y+=100) { ctx.moveTo(cameraX, y); ctx.lineTo(cameraX+width, y); }
            ctx.stroke();

            // Draw Track
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'var(--track)';
            ctx.lineWidth = TRACK_WIDTH;
            ctx.beginPath();
            ctx.moveTo(trackPath[0].x, trackPath[0].y);
            for(let i=1; i<trackPath.length; i++) ctx.lineTo(trackPath[i].x, trackPath[i].y);
            ctx.stroke();

            // Track Borders
            ctx.strokeStyle = 'var(--border)';
            ctx.lineWidth = 10;
            ctx.stroke();
            
            // Center Line (Dashed)
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 20]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Start/Finish Line
            ctx.fillStyle = '#fff';
            for (let i=-TRACK_WIDTH/2; i<TRACK_WIDTH/2; i+=20) {
                ctx.fillStyle = (i/20)%2 === 0 ? '#fff' : '#000';
                ctx.fillRect(400 + i, 800 - 10, 20, 20); // Rough position of start line
            }

            // Draw Skidmarks
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            skidmarks.forEach(s => {
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.rotate(s.angle);
                ctx.globalAlpha = s.life / 300;
                // Tires are approx at x=+-10, y=+-15
                ctx.fillRect(-12, 10, 4, 8);
                ctx.fillRect(8, 10, 4, 8);
                ctx.restore();
            });
            ctx.globalAlpha = 1;

            // Draw Car
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            // Body
            ctx.fillStyle = 'var(--player)';
            ctx.shadowColor = 'var(--player)';
            ctx.shadowBlur = 10;
            ctx.fillRect(-car.w/2, -car.h/2, car.w, car.h);
            ctx.shadowBlur = 0;
            
            // Window
            ctx.fillStyle = '#111';
            ctx.fillRect(-car.w/2 + 2, -car.h/4, car.w - 4, car.h/2);
            
            // Headlights
            ctx.fillStyle = '#fff';
            ctx.fillRect(-car.w/2 + 2, -car.h/2 - 2, 6, 4);
            ctx.fillRect(car.w/2 - 8, -car.h/2 - 2, 6, 4);
            
            // Brake lights
            if (keys['ArrowDown'] || keys['KeyS'] || btnBrake) {
                ctx.fillStyle = '#ff0000';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 10;
                ctx.fillRect(-car.w/2 + 2, car.h/2 - 2, 6, 4);
                ctx.fillRect(car.w/2 - 8, car.h/2 - 2, 6, 4);
                ctx.shadowBlur = 0;
            }

            ctx.restore();

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 20;
                ctx.fillRect(p.x, p.y, 4, 4);
            });
            ctx.globalAlpha = 1;

            ctx.restore();
        }

        function loop() {
            if(!isRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function winGame() {
            isRunning = false;
            document.getElementById('final-stats').textContent = `Total Time: ${timeElapsed.toFixed(2)}s`;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // Input Handling
        let keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });
        
        let btnLeft=false, btnRight=false, btnGas=false, btnBrake=false;
        
        // Setup button listeners
        const bindBtn = (id, setter) => {
            let el = document.getElementById(id);
            el.addEventListener('mousedown', e => { e.preventDefault(); setter(true); });
            el.addEventListener('mouseup', e => { e.preventDefault(); setter(false); });
            el.addEventListener('mouseleave', e => { e.preventDefault(); setter(false); });
            el.addEventListener('touchstart', e => { e.preventDefault(); setter(true); }, {passive:false});
            el.addEventListener('touchend', e => { e.preventDefault(); setter(false); });
        };

        bindBtn('btn-left', val => btnLeft = val);
        bindBtn('btn-right', val => btnRight = val);
        bindBtn('btn-gas', val => btnGas = val);
        bindBtn('btn-brake', val => btnBrake = val);

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            timeElapsed = 0; laps = 0;
            checkpoints = [true, false, false, false];
            
            car = {
                x: 400, y: 800, angle: Math.PI/2, // Facing right at start
                vx: 0, vy: 0, speed: 0,
                w: 20, h: 40
            };
            
            skidmarks = []; particles = [];
            document.getElementById('lapEl').textContent = `LAP: 1/${maxLaps}`;
            
            isRunning = true;
            loop();
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
