<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Boss Rush</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #030108;
            --player-color: #00f3ff;
            --bullet-player: #39ff14;
            --boss-core: #ff00ff;
            --boss-armor: #ff3366;
            --bullet-boss: #ffaa00;
            --text-color: #fff;
            --ui-bg: rgba(0, 0, 0, 0.85);
            --border-color: #ff00ff;
        }

        * { box-sizing: border-box; touch-action: none; }
        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Press Start 2P', monospace; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        #game-container {
            position: relative; border: 2px solid var(--border-color);
            box-shadow: 0 0 20px var(--border-color);
            background-color: var(--bg-color);
            transition: transform 0.05s ease-in-out;
        }
        canvas { display: block; }

        #ui-layer {
            position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;
            display:flex; flex-direction:column; justify-content:space-between; padding:15px;
        }
        .hud { display: flex; justify-content: space-between; text-shadow: 0 0 5px var(--text-color); font-size: 12px; z-index: 10; }
        
        .boss-bar-wrap { width: 100%; text-align: center; margin-top: 10px; }
        .boss-name { font-size: 10px; color: var(--boss-core); text-shadow: 0 0 5px var(--boss-core); margin-bottom: 5px; }
        .boss-bar-container { width: 100%; height: 15px; background: #222; border: 2px solid var(--boss-core); overflow: hidden; }
        #boss-hp-fill { height: 100%; width: 100%; background: var(--boss-core); box-shadow: 0 0 10px var(--boss-core); transition: width 0.1s; }

        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: var(--ui-bg); border: 2px solid var(--border-color); padding: 30px;
            text-align: center; pointer-events: auto; box-shadow: 0 0 30px rgba(255,0,255,0.3); z-index: 20; width: 80%; max-width: 450px;
        }
        h1 { color: var(--player-color); text-shadow: 0 0 10px var(--player-color); margin-bottom: 20px; font-size: 20px; line-height: 1.5; }
        p { margin-bottom: 20px; font-size: 10px; color: #ccc; line-height: 1.6; }
        button {
            background: transparent; color: var(--player-color); border: 2px solid var(--player-color);
            padding: 12px 24px; font-family: 'Press Start 2P', monospace; font-size: 14px; cursor: pointer;
            text-shadow: 0 0 10px var(--player-color); box-shadow: 0 0 10px var(--player-color); transition: all 0.2s; text-transform: uppercase;
        }
        button:hover { background: var(--player-color); color: #000; box-shadow: 0 0 30px var(--player-color); }
        .hidden { display: none !important; }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px; pointer-events: none; z-index: 100; opacity: 0.5;
        }
        
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 2px, 0); }
            20%, 80% { transform: translate3d(4px, -3px, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 6px, 0); }
            40%, 60% { transform: translate3d(6px, -6px, 0); }
        }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; display: none;
        }
        .touch-btn {
            width: 70px; height: 70px; border-radius: 50%; border: 2px solid rgba(0, 243, 255, 0.3);
            background: rgba(0,0,0,0.5); pointer-events: auto; display: flex; align-items: center; justify-content: center;
            color: rgba(0,243,255,0.5); font-size: 24px; font-weight: bold; font-family: sans-serif;
        }
        @media (hover: none) and (pointer: coarse) {
            #mobile-controls { display: flex; }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="800"></canvas>
        <div id="ui-layer">
            <div class="hud">
                <span id="scoreEl">SCORE: 0</span>
                <span id="livesEl">LIVES: 3</span>
            </div>
            <div class="boss-bar-wrap hidden" id="boss-ui">
                <div class="boss-name" id="boss-name-el">TITAN-X OMEGA</div>
                <div class="boss-bar-container">
                    <div id="boss-hp-fill"></div>
                </div>
            </div>
        </div>
        <div id="mobile-controls">
            <div style="display:flex; gap:10px;">
                <div class="touch-btn" id="btn-left">&lt;</div>
                <div class="touch-btn" id="btn-right">&gt;</div>
            </div>
            <div class="touch-btn" style="border-color: rgba(57,255,20,0.3); color:rgba(57,255,20,0.5)" id="btn-fire">F</div>
        </div>
        <div id="start-screen" class="modal">
            <h1>BOSS RUSH</h1>
            <p>SKIP THE MINIONS. ENGAGE THE TITANS.<br><br>WASD TO MOVE. SPACE TO FIRE.<br>DESTROY MODULAR PARTS TO WEAKEN THE CORE.</p>
            <button id="start-btn">INITIATE COMBAT</button>
        </div>
        <div id="game-over-screen" class="modal hidden">
            <h1 id="end-title" style="color: #ff0044; text-shadow: 0 0 10px #ff0044;">HULL BREACH</h1>
            <p id="final-score">FINAL SCORE: 0</p>
            <button id="restart-btn">RETRY</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('game-container');
        
        let isGameRunning = false;
        let score = 0, lives = 3, frameCount = 0;

        // Player
        let player = { x: 300, y: 700, radius: 10, speed: 6, invuln: 0 };
        let fireTimer = 0;
        
        let keys = { w: false, a: false, s: false, d: false, space: false };
        let touchLeft = false, touchRight = false, touchUp = false, touchDown = false, touchFire = false;

        // Boss Logic
        let bossLevel = 1;
        let boss = null;
        let bossEntryTimer = 0;

        let playerBullets = [];
        let bossBullets = [];
        let particles = [];
        let stars = [];

        // Setup
        function resize() {
            const ratio = 600/800;
            const h = Math.min(window.innerHeight - 20, 800);
            const w = Math.min(window.innerWidth - 20, h * ratio);
            canvas.style.width = `${w}px`;
            canvas.style.height = `${w}px / ${ratio}`;
            gameContainer.style.width = `${w}px`;
            gameContainer.style.height = `${w}px / ${ratio}`;
        }
        window.addEventListener('resize', resize); resize();

        for(let i=0; i<50; i++) stars.push({ x: Math.random()*600, y: Math.random()*800, speed: 2+Math.random()*5, size: Math.random()*2 });

        function triggerShake() {
            gameContainer.classList.remove('shake');
            void gameContainer.offsetWidth; // trigger reflow
            gameContainer.classList.add('shake');
        }

        function createParticles(x, y, color, count, speed=5) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random()-0.5)*speed, vy: (Math.random()-0.5)*speed,
                    life: 1, color
                });
            }
        }

        function spawnBoss(level) {
            document.getElementById('boss-ui').classList.remove('hidden');
            bossEntryTimer = 100;
            if (level === 1) {
                document.getElementById('boss-name-el').textContent = 'TITAN-X OMEGA';
                boss = {
                    x: 300, y: -200, targetY: 150, maxHp: 3000, hp: 3000, state: 'entry', timer: 0,
                    parts: [
                        { id: 'core', offsetX: 0, offsetY: 0, radius: 40, hp: 3000, maxHp: 3000, color: 'var(--boss-core)' },
                        { id: 'l_wing', offsetX: -80, offsetY: -20, radius: 25, hp: 800, maxHp: 800, color: 'var(--boss-armor)' },
                        { id: 'r_wing', offsetX: 80, offsetY: -20, radius: 25, hp: 800, maxHp: 800, color: 'var(--boss-armor)' }
                    ]
                };
            } else if (level === 2) {
                document.getElementById('boss-name-el').textContent = 'SERAPHIM CONSTRUCT';
                boss = {
                    x: 300, y: -200, targetY: 200, maxHp: 6000, hp: 6000, state: 'entry', timer: 0,
                    parts: [
                        { id: 'core', offsetX: 0, offsetY: 0, radius: 35, hp: 6000, maxHp: 6000, color: 'var(--boss-core)' },
                        { id: 'l_arm', offsetX: -100, offsetY: 40, radius: 20, hp: 1200, maxHp: 1200, color: 'var(--boss-armor)' },
                        { id: 'r_arm', offsetX: 100, offsetY: 40, radius: 20, hp: 1200, maxHp: 1200, color: 'var(--boss-armor)' },
                        { id: 'shield', offsetX: 0, offsetY: 60, radius: 15, hp: 2000, maxHp: 2000, color: '#00f3ff' }
                    ]
                };
            }
        }

        function updateBoss() {
            if (!boss) return;
            
            // Sync overall HP with core
            let core = boss.parts.find(p => p.id === 'core');
            if (core) boss.hp = core.hp;

            document.getElementById('boss-hp-fill').style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;

            if (boss.state === 'entry') {
                boss.y += (boss.targetY - boss.y) * 0.05;
                if (Math.abs(boss.y - boss.targetY) < 1) boss.state = 'active';
                return;
            }

            boss.timer++;
            boss.x = 300 + Math.sin(boss.timer * 0.02) * 150; // Hover
            
            // Firing Logic based on living parts
            if (bossLevel === 1) {
                boss.parts.forEach(p => {
                    if (p.hp <= 0) return;
                    let px = boss.x + p.offsetX;
                    let py = boss.y + p.offsetY;
                    
                    if (p.id === 'core' && boss.timer % 60 === 0) {
                        // Core spread
                        for(let i=-2; i<=2; i++) {
                            bossBullets.push({ x: px, y: py, vx: i*1.5, vy: 5, radius: 6, color: 'var(--boss-core)' });
                        }
                    } else if ((p.id === 'l_wing' || p.id === 'r_wing') && boss.timer % 40 === 0) {
                        // Aimed shots from wings
                        let angle = Math.atan2(player.y - py, player.x - px);
                        bossBullets.push({ x: px, y: py, vx: Math.cos(angle)*6, vy: Math.sin(angle)*6, radius: 4, color: 'var(--bullet-boss)' });
                    }
                });
            } else if (bossLevel === 2) {
                boss.y = 200 + Math.sin(boss.timer * 0.05) * 50; // Extra vertical bobbing
                boss.parts.forEach(p => {
                    if (p.hp <= 0) return;
                    let px = boss.x + p.offsetX;
                    let py = boss.y + p.offsetY;
                    
                    if (p.id === 'core' && boss.timer % 90 === 0) {
                        // Massive ring
                        for(let i=0; i<Math.PI*2; i+=0.4) {
                            bossBullets.push({ x: px, y: py, vx: Math.cos(i)*4, vy: Math.sin(i)*4, radius: 5, color: 'var(--boss-core)' });
                        }
                    } else if ((p.id === 'l_arm' || p.id === 'r_arm') && boss.timer % 15 === 0) {
                        // Machine gun arms
                        bossBullets.push({ x: px, y: py, vx: (Math.random()-0.5)*2, vy: 8, radius: 3, color: 'var(--bullet-boss)' });
                    } else if (p.id === 'shield' && boss.timer % 120 === 0) {
                        // Laser beam warning (not implemented fully, just big bullet for now)
                        bossBullets.push({ x: px, y: py, vx: 0, vy: 12, radius: 15, color: '#00f3ff' });
                    }
                });
            }

            // Check Boss Death
            if (boss.hp <= 0) {
                score += boss.maxHp;
                triggerShake();
                createParticles(boss.x, boss.y, 'var(--boss-core)', 150, 15);
                boss = null;
                document.getElementById('boss-ui').classList.add('hidden');
                
                // Next level logic
                if (bossLevel === 1) {
                    bossLevel++;
                    setTimeout(() => { if(isGameRunning) spawnBoss(2); }, 3000);
                } else {
                    gameWin();
                }
            }
        }

        function update() {
            frameCount++;

            // Background
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > 800) { s.y = 0; s.x = Math.random()*600; }
            });

            // Player Movement
            let dx = 0, dy = 0;
            if (keys.a || touchLeft) dx -= 1;
            if (keys.d || touchRight) dx += 1;
            if (keys.w || touchUp) dy -= 1;
            if (keys.s || touchDown) dy += 1;
            
            if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; } // normalize
            
            player.x += dx * player.speed;
            player.y += dy * player.speed;
            
            player.x = Math.max(player.radius, Math.min(600 - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(800 - player.radius, player.y));
            if (player.invuln > 0) player.invuln--;

            // Player Fire
            if ((keys.space || touchFire) && fireTimer === 0) {
                playerBullets.push({ x: player.x - 5, y: player.y - 10, vy: -15 });
                playerBullets.push({ x: player.x + 5, y: player.y - 10, vy: -15 });
                fireTimer = 6;
            }
            if (fireTimer > 0) fireTimer--;

            updateBoss();

            // Update Player Bullets & Boss Collision
            playerBullets.forEach((b, i) => {
                b.y += b.vy;
                if (b.y < -20) {
                    playerBullets.splice(i, 1);
                    return;
                }
                
                if (boss && boss.state === 'active') {
                    // Check collision with parts (reverse order so shield/arms get hit first)
                    for(let j = boss.parts.length - 1; j >= 0; j--) {
                        let p = boss.parts[j];
                        if (p.hp <= 0) continue;
                        let px = boss.x + p.offsetX;
                        let py = boss.y + p.offsetY;
                        
                        if (Math.hypot(b.x - px, b.y - py) < p.radius) {
                            p.hp -= 20;
                            playerBullets.splice(i, 1);
                            createParticles(b.x, b.y, p.color, 3, 5);
                            score += 5;
                            document.getElementById('scoreEl').textContent = `SCORE: ${score}`;
                            
                            if (p.hp <= 0 && p.id !== 'core') {
                                triggerShake();
                                createParticles(px, py, p.color, 50, 10);
                                // Exploding a part damages core slightly
                                let core = boss.parts.find(c => c.id === 'core');
                                if (core) core.hp -= boss.maxHp * 0.1;
                            }
                            break; // Bullet absorbed
                        }
                    }
                }
            });

            // Update Boss Bullets & Player Collision
            bossBullets.forEach((b, i) => {
                b.x += b.vx; b.y += b.vy;
                if (b.x < -50 || b.x > 650 || b.y < -50 || b.y > 850) {
                    bossBullets.splice(i, 1);
                } else if (player.invuln <= 0 && Math.hypot(b.x - player.x, b.y - player.y) < player.radius + b.radius) {
                    lives--;
                    document.getElementById('livesEl').textContent = `LIVES: ${lives}`;
                    createParticles(player.x, player.y, 'var(--player-color)', 30, 10);
                    triggerShake();
                    player.invuln = 120;
                    if (lives <= 0) gameOver();
                }
            });

            // Particles
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.03;
                if(p.life <= 0) particles.splice(i, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, 600, 800);

            // Stars
            ctx.fillStyle = '#fff';
            stars.forEach(s => { ctx.globalAlpha = Math.random()*0.5+0.2; ctx.fillRect(s.x, s.y, s.size, s.size*2); });
            ctx.globalAlpha = 1;

            ctx.globalCompositeOperation = 'lighter';

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.shadowBlur = 10; ctx.shadowColor = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
            });
            ctx.globalAlpha = 1;

            // Boss
            if (boss) {
                // Draw connections
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 4;
                boss.parts.forEach(p => {
                    if (p.hp > 0 && p.id !== 'core') {
                        ctx.beginPath();
                        ctx.moveTo(boss.x, boss.y);
                        ctx.lineTo(boss.x + p.offsetX, boss.y + p.offsetY);
                        ctx.stroke();
                    }
                });

                // Draw parts
                boss.parts.forEach(p => {
                    if (p.hp > 0) {
                        let px = boss.x + p.offsetX;
                        let py = boss.y + p.offsetY;
                        
                        ctx.fillStyle = '#000';
                        ctx.strokeStyle = p.color;
                        ctx.lineWidth = 3;
                        ctx.shadowBlur = 15; ctx.shadowColor = p.color;
                        
                        ctx.beginPath();
                        if (p.id === 'shield') {
                            ctx.rect(px - p.radius*2, py - p.radius/2, p.radius*4, p.radius);
                        } else {
                            ctx.arc(px, py, p.radius, 0, Math.PI*2);
                        }
                        ctx.fill(); ctx.stroke();
                        
                        // Core pulse
                        if (p.id === 'core') {
                            ctx.fillStyle = p.color;
                            ctx.beginPath();
                            ctx.arc(px, py, p.radius * 0.5 + Math.sin(frameCount*0.2)*5, 0, Math.PI*2);
                            ctx.fill();
                        } else {
                            // Damage indicator
                            ctx.fillStyle = `rgba(255,0,0,${1 - (p.hp/p.maxHp)})`;
                            ctx.beginPath(); ctx.arc(px, py, p.radius*0.8, 0, Math.PI*2); ctx.fill();
                        }
                    }
                });
            }

            // Player Bullets
            ctx.fillStyle = 'var(--bullet-player)';
            ctx.shadowColor = 'var(--bullet-player)';
            ctx.shadowBlur = 10;
            playerBullets.forEach(b => {
                ctx.fillRect(b.x - 2, b.y - 10, 4, 20);
            });

            // Boss Bullets
            ctx.shadowBlur = 15;
            bossBullets.forEach(b => {
                ctx.fillStyle = '#fff';
                ctx.shadowColor = b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.fill();
            });

            // Player
            if (player.invuln % 10 < 5) {
                ctx.shadowBlur = 15; ctx.shadowColor = 'var(--player-color)';
                ctx.strokeStyle = 'var(--player-color)';
                ctx.fillStyle = '#000';
                ctx.lineWidth = 2;
                
                ctx.beginPath();
                ctx.moveTo(player.x, player.y - player.radius*1.5);
                ctx.lineTo(player.x + player.radius, player.y + player.radius);
                ctx.lineTo(player.x, player.y + player.radius*0.5);
                ctx.lineTo(player.x - player.radius, player.y + player.radius);
                ctx.closePath();
                ctx.fill(); ctx.stroke();
                
                ctx.fillStyle = 'var(--player-color)';
                ctx.beginPath(); ctx.arc(player.x, player.y, 3, 0, Math.PI*2); ctx.fill();
            }

            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 0;
        }

        function loop() {
            if(!isGameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Input
        window.addEventListener('keydown', e => { 
            if(e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
            if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if(e.key === 's' || e.key === 'ArrowDown') keys.s = true;
            if(e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
            if(e.code === 'Space') keys.space = true;
        });
        window.addEventListener('keyup', e => { 
            if(e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
            if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if(e.key === 's' || e.key === 'ArrowDown') keys.s = false;
            if(e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
            if(e.code === 'Space') keys.space = false;
        });

        // Touch Input
        const btnL = document.getElementById('btn-left');
        const btnR = document.getElementById('btn-right');
        const btnF = document.getElementById('btn-fire');
        
        btnL.addEventListener('touchstart', e => { e.preventDefault(); touchLeft = true; });
        btnL.addEventListener('touchend', e => { e.preventDefault(); touchLeft = false; });
        btnR.addEventListener('touchstart', e => { e.preventDefault(); touchRight = true; });
        btnR.addEventListener('touchend', e => { e.preventDefault(); touchRight = false; });
        btnF.addEventListener('touchstart', e => { e.preventDefault(); touchFire = true; });
        btnF.addEventListener('touchend', e => { e.preventDefault(); touchFire = false; });

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            score = 0; lives = 3; frameCount = 0;
            player.x = 300; player.y = 700; player.invuln = 60;
            bossLevel = 1;
            playerBullets = []; bossBullets = []; particles = [];
            
            document.getElementById('scoreEl').textContent = `SCORE: 0`;
            document.getElementById('livesEl').textContent = `LIVES: 3`;
            
            isGameRunning = true;
            spawnBoss(1);
            loop();
        }

        function gameOver() {
            isGameRunning = false;
            document.getElementById('end-title').textContent = "HULL BREACH";
            document.getElementById('end-title').style.color = "#ff0044";
            document.getElementById('final-score').textContent = `FINAL SCORE: ${score}`;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        function gameWin() {
            isGameRunning = false;
            document.getElementById('end-title').textContent = "ALL TITANS DESTROYED";
            document.getElementById('end-title').style.color = "var(--player-color)";
            document.getElementById('final-score').textContent = `FINAL SCORE: ${score + 50000}`; // Huge Bonus
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
