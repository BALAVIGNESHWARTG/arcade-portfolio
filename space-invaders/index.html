<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Space Invaders</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #050510;
            --grid-line: rgba(0, 255, 255, 0.05);
            --player-color: #00f3ff;
            --alien-color: #ff00ff;
            --bullet-color: #39ff14;
            --text-color: #0ff;
            --ui-bg: rgba(0, 0, 0, 0.85);
            --border-color: #0ff;
        }

        * {
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-color);
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 20px var(--border-color), inset 0 0 20px rgba(0, 255, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.7);
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            text-shadow: 0 0 5px var(--text-color);
            font-size: 14px;
            z-index: 10;
        }

        .modal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--ui-bg);
            border: 2px solid var(--border-color);
            padding: 30px;
            text-align: center;
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            z-index: 20;
            width: 80%; max-width: 400px;
        }

        h1 {
            color: var(--player-color);
            text-shadow: 0 0 10px var(--player-color);
            margin-bottom: 20px;
            font-size: 20px;
            line-height: 1.5;
        }

        p {
            margin-bottom: 20px; line-height: 1.6; font-size: 10px; color: #ccc;
        }

        button {
            background: transparent;
            color: var(--player-color);
            border: 2px solid var(--player-color);
            padding: 12px 24px;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px; cursor: pointer;
            text-shadow: 0 0 10px var(--player-color);
            box-shadow: 0 0 10px var(--player-color);
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            background: var(--player-color);
            color: #000;
            box-shadow: 0 0 30px var(--player-color);
        }

        .hidden { display: none !important; }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px; pointer-events: none; z-index: 100; opacity: 0.6;
        }

        .controls-hint {
            margin-top: 10px; font-size: 10px; color: #888; text-align: center;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div id="ui-layer">
            <div class="hud">
                <span id="scoreEl">SCORE: 0</span>
                <span id="livesEl">LIVES: 3</span>
            </div>
        </div>
        <div id="start-screen" class="modal">
            <h1>NEON INVADERS</h1>
            <p>ARROWS / TOUCH = MOVE<br>SPACE / TAP = FIRE</p>
            <button id="start-btn">INSERT COIN</button>
        </div>
        <div id="game-over-screen" class="modal hidden">
            <h1 id="status-text" style="color: #ff0000; text-shadow: 0 0 10px #ff0000;">GAME OVER</h1>
            <p id="final-score">SCORE: 0</p>
            <button id="restart-btn">TRY AGAIN</button>
        </div>
    </div>
    <div class="controls-hint">Desktop: Arrow Keys + Space | Mobile: Touch & Drag to move, Tap to shoot</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreEl');
        const livesEl = document.getElementById('livesEl');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const statusText = document.getElementById('status-text');
        const finalScoreEl = document.getElementById('final-score');
        
        let isGameRunning = false;
        let animationId;
        
        // Game Entities
        const player = { x: 275, y: 530, width: 50, height: 20, speed: 5, color: '#00f3ff', lives: 3 };
        let bullets = [];
        let alienBullets = [];
        let aliens = [];
        let particles = [];
        
        let alienDirection = 1;
        let alienSpeed = 1;
        let score = 0;
        let keys = {};
        let touchX = null;
        let isShooting = false;

        function resizeGame() {
            const size = Math.min(window.innerWidth - 20, window.innerHeight - 60, 600);
            canvas.style.width = `${size}px`;
            canvas.style.height = `${size}px`;
            document.getElementById('game-container').style.width = `${size}px`;
            document.getElementById('game-container').style.height = `${size}px`;
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();

        function createAliens() {
            aliens = [];
            alienDirection = 1;
            alienSpeed = 1 + (score / 1000); // Speed up slightly on next level
            for(let row=0; row<5; row++) {
                for(let col=0; col<10; col++) {
                    aliens.push({
                        x: 50 + col * 40,
                        y: 50 + row * 40,
                        width: 25,
                        height: 20,
                        alive: true
                    });
                }
            }
        }

        function createParticles(x, y, color) {
            for(let i=0; i<15; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1,
                    color: color
                });
            }
        }

        function initGame() {
            player.x = canvas.width/2 - player.width/2;
            player.lives = 3;
            score = 0;
            bullets = [];
            alienBullets = [];
            particles = [];
            createAliens();
            updateHUD();
            isGameRunning = true;
            gameLoop();
        }

        function updateHUD() {
            scoreEl.textContent = `SCORE: ${score}`;
            livesEl.textContent = `LIVES: ${player.lives}`;
        }

        function shoot() {
            if (bullets.length < 3) { // Max 3 player bullets on screen
                bullets.push({ x: player.x + player.width/2 - 2, y: player.y, width: 4, height: 10, speed: 7 });
            }
        }

        function update() {
            // Player movement
            if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) player.x += player.speed;
            if (keys['Space']) {
                if(!isShooting) { shoot(); isShooting = true; }
            } else {
                isShooting = false;
            }

            // Touch logic
            if (touchX !== null) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const targetX = (touchX - rect.left) * scaleX - player.width/2;
                player.x += (targetX - player.x) * 0.2; // Smooth follow
            }

            // Bullets
            bullets.forEach((b, index) => {
                b.y -= b.speed;
                if(b.y < 0) bullets.splice(index, 1);
            });

            alienBullets.forEach((b, index) => {
                b.y += b.speed;
                if(b.y > canvas.height) alienBullets.splice(index, 1);
            });

            // Particles
            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.05;
                if(p.life <= 0) particles.splice(index, 1);
            });

            // Alien movement
            let edgeHit = false;
            let livingAliens = 0;
            aliens.forEach(a => {
                if(!a.alive) return;
                livingAliens++;
                a.x += alienSpeed * alienDirection;
                if (a.x <= 0 || a.x + a.width >= canvas.width) {
                    edgeHit = true;
                }
                // Random alien shoot
                if (Math.random() < 0.001) {
                    alienBullets.push({ x: a.x + a.width/2 - 2, y: a.y + a.height, width: 4, height: 10, speed: 4 });
                }
            });

            if (edgeHit) {
                alienDirection *= -1;
                aliens.forEach(a => { if(a.alive) a.y += 20; });
            }

            // Level Clear
            if (livingAliens === 0) {
                createAliens();
            }

            // Collisions
            // Player bullet hits alien
            bullets.forEach((b, bIdx) => {
                aliens.forEach(a => {
                    if (a.alive && b.x < a.x + a.width && b.x + b.width > a.x && b.y < a.y + a.height && b.y + b.height > a.y) {
                        a.alive = false;
                        bullets.splice(bIdx, 1);
                        score += 10;
                        updateHUD();
                        createParticles(a.x + a.width/2, a.y + a.height/2, '#ff00ff');
                    }
                });
            });

            // Alien bullet hits player
            alienBullets.forEach((b, bIdx) => {
                if (b.x < player.x + player.width && b.x + b.width > player.x && b.y < player.y + player.height && b.y + b.height > player.y) {
                    alienBullets.splice(bIdx, 1);
                    player.lives--;
                    updateHUD();
                    createParticles(player.x + player.width/2, player.y + player.height/2, '#00f3ff');
                    if (player.lives <= 0) gameOver();
                }
            });

            // Alien touches player
            aliens.forEach(a => {
                if (a.alive && a.y + a.height > player.y) {
                    gameOver();
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Player
            ctx.shadowBlur = 10;
            ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillRect(player.x + 20, player.y - 10, 10, 10); // Ship nose

            // Aliens
            ctx.shadowColor = '#ff00ff';
            ctx.fillStyle = '#ff00ff';
            aliens.forEach(a => {
                if(a.alive) ctx.fillRect(a.x, a.y, a.width, a.height);
            });

            // Bullets
            ctx.shadowColor = '#39ff14';
            ctx.fillStyle = '#39ff14';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

            ctx.shadowColor = '#ff3333';
            ctx.fillStyle = '#ff3333';
            alienBullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

            // Particles
            particles.forEach(p => {
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 3, 3);
            });
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            if(!isGameRunning) return;
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isGameRunning = false;
            statusText.textContent = "GAME OVER";
            statusText.style.color = "#ff3333";
            finalScoreEl.textContent = `SCORE: ${score}`;
            gameOverScreen.classList.remove('hidden');
        }

        // Input
        window.addEventListener('keydown', e => {
            if(e.code === 'Space' || e.code === 'ArrowLeft' || e.code === 'ArrowRight') e.preventDefault();
            keys[e.code] = true;
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        document.getElementById('start-btn').addEventListener('click', () => {
            startScreen.classList.add('hidden');
            initGame();
        });
        document.getElementById('restart-btn').addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            initGame();
        });

        const gameContainer = document.getElementById('game-container');
        gameContainer.addEventListener('touchstart', e => {
            touchX = e.touches[0].clientX;
        }, {passive: false});
        gameContainer.addEventListener('touchmove', e => {
            e.preventDefault();
            touchX = e.touches[0].clientX;
        }, {passive: false});
        gameContainer.addEventListener('touchend', e => {
            touchX = null;
            shoot(); // Tap to shoot
        }, {passive: false});
    </script>
</body>
</html>
