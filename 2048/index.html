<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 Pastel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');

        :root {
            --bg-color: #faf8ef;
            --text-color: #776e65;
            --grid-bg: #bbada0;
            --cell-bg: #cdc1b4;
            --btn-bg: #8f7a66;
            --btn-text: #f9f6f2;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Outfit', sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        .header {
            width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 0 10px;
        }

        .title { font-size: 48px; font-weight: 900; margin: 0; }
        
        .scores { display: flex; gap: 10px; }
        .score-box {
            background: var(--grid-bg); color: #fff; padding: 5px 15px;
            border-radius: 6px; text-align: center; font-weight: bold; min-width: 70px;
        }
        .score-label { font-size: 10px; color: #eee; text-transform: uppercase; margin-bottom: 2px;}
        .score-val { font-size: 20px; }

        .game-intro {
            width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; padding: 0 10px; font-size: 14px;
        }
        
        .restart-btn {
            background: var(--btn-bg); color: var(--btn-text); border: none; padding: 10px 20px;
            border-radius: 5px; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 16px;
            transition: background 0.2s;
        }
        .restart-btn:hover { background: #9f8b77; }

        .game-container {
            position: relative; width: 400px; height: 400px; background: var(--grid-bg);
            border-radius: 10px; padding: 10px;
        }

        .grid-container {
            display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
            gap: 10px; width: 100%; height: 100%;
        }

        .grid-cell {
            background: var(--cell-bg); border-radius: 6px;
        }

        .tile-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            padding: 10px;
        }

        .tile {
            position: absolute; width: 87.5px; height: 87.5px; /* (400 - 20 pad - 30 gap) / 4 */
            background: #eee4da; border-radius: 6px; display: flex; justify-content: center; align-items: center;
            font-size: 35px; font-weight: 700; color: #776e65;
            transition: transform 0.15s ease-in-out;
            animation: pop 0.2s ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .merged { animation: mergedPop 0.2s ease-in-out; }
        @keyframes mergedPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Tile Colors */
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 30px; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 30px; box-shadow: 0 0 10px rgba(243,215,116,0.5); }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 30px; box-shadow: 0 0 15px rgba(243,215,116,0.6); }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 25px; box-shadow: 0 0 20px rgba(243,215,116,0.7); }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 25px; box-shadow: 0 0 30px rgba(243,215,116,0.8); }

        .game-over-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(238, 228, 218, 0.73); border-radius: 10px; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s;
        }
        .game-over-overlay.active { opacity: 1; pointer-events: auto; }
        
        .game-over-text { font-size: 40px; font-weight: 900; color: #776e65; margin-bottom: 20px; }

        @media (max-width: 450px) {
            .game-container { width: 300px; height: 300px; }
            .tile { width: 62.5px; height: 62.5px; font-size: 25px; }
            .tile-128, .tile-256, .tile-512 { font-size: 20px; }
            .tile-1024, .tile-2048 { font-size: 16px; }
            .header, .game-intro { max-width: 300px; }
            .title { font-size: 36px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">2048</h1>
        <div class="scores">
            <div class="score-box">
                <div class="score-label">SCORE</div>
                <div class="score-val" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">BEST</div>
                <div class="score-val" id="best">0</div>
            </div>
        </div>
    </div>

    <div class="game-intro">
        <span>Join the numbers and get to the <strong>2048 tile!</strong></span>
        <button class="restart-btn" id="restartBtn">New Game</button>
    </div>

    <div class="game-container" id="game-container">
        <div class="grid-container">
            <!-- 16 empty cells for background -->
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>
        <div class="tile-container" id="tile-container">
            <!-- Dynamic Tiles go here -->
        </div>

        <div class="game-over-overlay" id="game-over">
            <div class="game-over-text">Game Over!</div>
            <button class="restart-btn" onclick="init()">Try again</button>
        </div>
    </div>

    <script>
        const size = 4;
        let grid = [];
        let score = 0;
        let best = localStorage.getItem('2048best') || 0;
        const container = document.getElementById('tile-container');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const gameOverEl = document.getElementById('game-over');

        let isAnimating = false;
        
        // Setup Swipes
        let startX, startY;
        document.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        }, {passive: false});

        document.addEventListener('touchend', e => {
            if (isAnimating) return;
            let dx = e.changedTouches[0].clientX - startX;
            let dy = e.changedTouches[0].clientY - startY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) move(dx > 0 ? 1 : 3); // Right : Left
            } else {
                if (Math.abs(dy) > 30) move(dy > 0 ? 2 : 0); // Down : Up
            }
        });

        document.addEventListener('keydown', e => {
            if (isAnimating) return;
            if (e.key === 'ArrowUp') move(0);
            if (e.key === 'ArrowRight') move(1);
            if (e.key === 'ArrowDown') move(2);
            if (e.key === 'ArrowLeft') move(3);
        });

        document.getElementById('restartBtn').addEventListener('click', init);

        function init() {
            grid = Array(size).fill().map(() => Array(size).fill(0));
            score = 0;
            updateScore();
            bestEl.textContent = best;
            gameOverEl.classList.remove('active');
            container.innerHTML = '';
            addRandomTile();
            addRandomTile();
            renderGrid();
        }

        function addRandomTile() {
            let emptyCells = [];
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (grid[r][c] === 0) emptyCells.push({r, c});
                }
            }
            if (emptyCells.length > 0) {
                let pos = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                grid[pos.r][pos.c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        // Logic for sliding arrays
        function slide(row) {
            let arr = row.filter(val => val);
            let merged = [];
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] === arr[i+1]) {
                    merged.push(arr[i] * 2);
                    score += arr[i] * 2;
                    i++;
                } else {
                    merged.push(arr[i]);
                }
            }
            while (merged.length < size) merged.push(0);
            return merged;
        }

        function rotateLeft(matrix) {
            let result = Array(size).fill().map(() => Array(size).fill(0));
            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    result[size-1-c][r] = matrix[r][c];
                }
            }
            return result;
        }
        function rotateRight(matrix) {
            let result = Array(size).fill().map(() => Array(size).fill(0));
            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    result[c][size-1-r] = matrix[r][c];
                }
            }
            return result;
        }

        function move(dir) {
            // 0: Up, 1: Right, 2: Down, 3: Left
            let originalGrid = JSON.stringify(grid);
            
            // Align to left-slide orientation
            for(let i=0; i<dir; i++) grid = rotateLeft(grid);
            
            for(let r=0; r<size; r++) grid[r] = slide(grid[r]);
            
            // Revert rotation
            for(let i=0; i<dir; i++) grid = rotateRight(grid);

            if (originalGrid !== JSON.stringify(grid)) {
                isAnimating = true;
                addRandomTile();
                updateScore();
                renderGrid();
                setTimeout(() => {
                    isAnimating = false;
                    checkGameOver();
                }, 150); // wait for css transition
            }
        }

        function updateScore() {
            scoreEl.textContent = score;
            if (score > best) {
                best = score;
                bestEl.textContent = best;
                localStorage.setItem('2048best', best);
            }
        }

        function renderGrid() {
            container.innerHTML = '';
            
            // Calc sizes based on container
            let cWidth = document.getElementById('game-container').clientWidth;
            let pad = 10;
            let gap = 10;
            let tileSize = (cWidth - (pad*2) - (gap*3)) / 4;

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    let val = grid[r][c];
                    if (val > 0) {
                        let el = document.createElement('div');
                        el.className = `tile tile-${val}`;
                        el.textContent = val;
                        
                        let x = c * (tileSize + gap);
                        let y = r * (tileSize + gap);
                        
                        el.style.transform = `translate(${x}px, ${y}px)`;
                        
                        // Small fix to keep transition working smoothly
                        // We set translation via transform. Pop animation uses scale, so they fight if not careful.
                        // We wrap pop inside an inner div to prevent fighting.
                        
                        let inner = document.createElement('div');
                        inner.style.width = '100%'; inner.style.height = '100%';
                        inner.style.display = 'flex'; inner.style.justifyContent = 'center'; inner.style.alignItems = 'center';
                        inner.textContent = val;
                        inner.style.animation = 'pop 0.15s ease-in-out';
                        
                        el.textContent = '';
                        el.appendChild(inner);
                        container.appendChild(el);
                    }
                }
            }
        }

        function checkGameOver() {
            let over = true;
            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    if (grid[r][c] === 0) over = false;
                    if (c < size-1 && grid[r][c] === grid[r][c+1]) over = false;
                    if (r < size-1 && grid[r][c] === grid[r+1][c]) over = false;
                }
            }
            if (over) gameOverEl.classList.add('active');
        }

        init();
    </script>
</body>
</html>
