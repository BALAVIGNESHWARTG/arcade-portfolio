<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Switch</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Righteous&display=swap');

        :root {
            --bg: #222;
            --c1: #ff0055; /* Pink */
            --c2: #00ffcc; /* Cyan */
            --c3: #f1c40f; /* Yellow */
            --c4: #9b59b6; /* Purple */
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0; padding: 0; background-color: #111; color: #fff;
            font-family: 'Righteous', cursive; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        #game-container {
            position: relative; width: 100%; height: 100%; max-width: 500px; max-height: 800px;
            background-color: var(--bg); border-left: 2px solid #444; border-right: 2px solid #444;
            overflow: hidden;
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 5; }

        .hud {
            position: absolute; top: 20px; left: 20px; right: 20px; text-align: center;
            font-size: 36px; z-index: 10; pointer-events: none; text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Modals */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(17, 17, 17, 0.95); border: 3px solid #fff; padding: 40px;
            text-align: center; box-shadow: 0 0 40px rgba(255, 255, 255, 0.2); z-index: 30;
            border-radius: 20px; pointer-events: auto; width: 85%; max-width: 400px;
        }
        h1 { margin-top: 0; font-size: 48px; margin-bottom: 20px; background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c4)); -webkit-background-clip: text; color: transparent; }
        p { color: #ccc; line-height: 1.5; font-size: 18px; margin-bottom: 30px; }
        button {
            background: #fff; color: #111; border: none;
            padding: 15px 40px; font-family: 'Righteous', cursive; font-size: 24px; cursor: pointer; transition: 0.2s;
            border-radius: 30px; box-shadow: 0 0 20px rgba(255, 255, 255, 0.5); text-transform: uppercase;
        }
        button:hover { transform: scale(1.05); }
        .hidden { display: none !important; }

        #tap-zone {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="hud" id="scoreEl">0</div>
        
        <div id="tap-zone"></div>

        <div id="start-screen" class="modal">
            <h1>COLOR SWITCH</h1>
            <p>Tap to bounce.<br>Pass through the matching color.<br>Grab stars to switch colors.</p>
            <button id="start-btn">PLAY</button>
        </div>
        
        <div id="game-over-screen" class="modal hidden">
            <h1 style="background: none; color: #fff;">GAME OVER</h1>
            <p id="final-stats">Score: 0</p>
            <button id="restart-btn">RETRY</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        let width, height;
        const LOGICAL_W = 500;
        const LOGICAL_H = 800;
        let scaleX = 1, scaleY = 1;

        function resize() {
            let cw = container.clientWidth;
            let ch = container.clientHeight;
            canvas.width = cw; canvas.height = ch;
            scaleX = cw / LOGICAL_W;
            scaleY = ch / LOGICAL_H;
        }
        window.addEventListener('resize', resize); resize();

        let isRunning = false;
        let score = 0;
        let cameraY = 0;

        const COLORS = [
            getComputedStyle(document.documentElement).getPropertyValue('--c1').trim(),
            getComputedStyle(document.documentElement).getPropertyValue('--c2').trim(),
            getComputedStyle(document.documentElement).getPropertyValue('--c3').trim(),
            getComputedStyle(document.documentElement).getPropertyValue('--c4').trim()
        ];

        let ball = { x: 250, y: 600, vy: 0, radius: 12, colorIndex: 0 };
        const GRAVITY = 0.35;
        const JUMP_FORCE = -7.5;

        let obstacles = [];
        let particles = [];

        function spawnObstacle(yPos) {
            let type = Math.random() > 0.5 ? 'circle' : 'cross';
            let rotSpeed = (Math.random() * 0.02 + 0.015) * (Math.random() > 0.5 ? 1 : -1);
            
            // Add the obstacle
            obstacles.push({
                type: type,
                x: 250, y: yPos,
                radius: 80, thickness: 15,
                rotation: 0, rotSpeed: rotSpeed,
                passed: false
            });
            
            // Add color switcher star inside/above
            obstacles.push({
                type: 'star',
                x: 250, y: yPos, // inside the obstacle
                radius: 15,
                collected: false
            });
            
            // Add points star between obstacles
            obstacles.push({
                type: 'point',
                x: 250, y: yPos - 150,
                radius: 10,
                collected: false
            });
        }

        function initLevel() {
            obstacles = [];
            ball = { x: 250, y: 600, vy: 0, radius: 12, colorIndex: Math.floor(Math.random() * 4) };
            cameraY = 0;
            score = 0;
            
            // Spawn initial obstacles
            for (let i=0; i<5; i++) {
                spawnObstacle(400 - i * 350);
            }
        }

        function drawStar(ctx, x, y, r, p, m, color) {
            ctx.save();
            ctx.beginPath();
            ctx.translate(x, y);
            ctx.moveTo(0, 0 - r);
            for (let i = 0; i < p; i++) {
                ctx.rotate(Math.PI / p);
                ctx.lineTo(0, 0 - (r * m));
                ctx.rotate(Math.PI / p);
                ctx.lineTo(0, 0 - r);
            }
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.restore();
        }

        function drawArc(ctx, x, y, r, thickness, startAngle, endAngle, color) {
            ctx.beginPath();
            ctx.arc(x, y, r, startAngle, endAngle);
            ctx.strokeStyle = color;
            ctx.lineWidth = thickness;
            ctx.lineCap = 'butt';
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function checkCollision() {
            // Screen bottom limit (Camera follows up, so if ball drops too far from camera, it dies)
            if (ball.y > cameraY + LOGICAL_H - 50) {
                die();
                return;
            }

            for (let ob of obstacles) {
                if (ob.type === 'circle') {
                    // Check intersection with circular band
                    let dist = Math.hypot(ball.x - ob.x, ball.y - ob.y);
                    if (dist > ob.radius - ob.thickness/2 - ball.radius && dist < ob.radius + ob.thickness/2 + ball.radius) {
                        // Find which quadrant the ball is in relative to the obstacle
                        let angle = Math.atan2(ball.y - ob.y, ball.x - ob.x);
                        // Adjust angle by obstacle rotation
                        angle = (angle - ob.rotation + Math.PI*4) % (Math.PI*2);
                        
                        let segment = Math.floor(angle / (Math.PI/2)); // 0, 1, 2, 3
                        
                        // Compare segment color to ball color (order in draw loop)
                        // 0: c1, 1: c2, 2: c3, 3: c4
                        if (segment !== ball.colorIndex) {
                            die();
                            return;
                        }
                    }
                } else if (ob.type === 'cross') {
                    // Approximate cross hitboxes
                    let length = ob.radius;
                    let thick = ob.thickness;
                    
                    for (let i=0; i<4; i++) {
                        let rotAngle = ob.rotation + i * (Math.PI/2);
                        // Convert ball to local space of the arm
                        let dx = ball.x - ob.x;
                        let dy = ball.y - ob.y;
                        
                        let localX = dx * Math.cos(-rotAngle) - dy * Math.sin(-rotAngle);
                        let localY = dx * Math.sin(-rotAngle) + dy * Math.cos(-rotAngle);
                        
                        // Arm is from x=0 to x=length, y=-thick/2 to y=thick/2
                        if (localX > 0 && localX < length && localY > -thick/2 - ball.radius && localY < thick/2 + ball.radius) {
                            if (i !== ball.colorIndex) {
                                die();
                                return;
                            }
                        }
                    }
                } else if (ob.type === 'star' && !ob.collected) {
                    let dist = Math.hypot(ball.x - ob.x, ball.y - ob.y);
                    if (dist < ball.radius + ob.radius) {
                        ob.collected = true;
                        // Switch to a DIFFERENT color
                        let nextColor;
                        do { nextColor = Math.floor(Math.random() * 4); } while(nextColor === ball.colorIndex);
                        ball.colorIndex = nextColor;
                        
                        // Particle burst
                        createBurst(ob.x, ob.y, '#fff');
                    }
                } else if (ob.type === 'point' && !ob.collected) {
                    let dist = Math.hypot(ball.x - ob.x, ball.y - ob.y);
                    if (dist < ball.radius + ob.radius) {
                        ob.collected = true;
                        score++;
                        document.getElementById('scoreEl').textContent = score;
                        createBurst(ob.x, ob.y, '#f1c40f');
                    }
                }
            }
        }

        function createBurst(x, y, color) {
            for(let i=0; i<15; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                    life: 20, color: color
                });
            }
        }

        function update() {
            // Physics
            ball.vy += GRAVITY;
            ball.y += ball.vy;

            // Camera follow (only up)
            if (ball.y < cameraY + LOGICAL_H/2) {
                cameraY = ball.y - LOGICAL_H/2;
            }

            // Spawn new obstacles as we go up
            let highestOb = obstacles[obstacles.length-1];
            if (cameraY < highestOb.y) {
                spawnObstacle(highestOb.y - 350);
            }

            // Clean up off-screen obstacles
            obstacles = obstacles.filter(ob => ob.y < cameraY + LOGICAL_H + 200);

            // Rotate obstacles
            obstacles.forEach(ob => {
                if (ob.rotSpeed) ob.rotation += ob.rotSpeed;
            });

            checkCollision();

            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                if(p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.scale(scaleX, scaleY);
            ctx.translate(0, -cameraY);

            // Draw Obstacles
            obstacles.forEach(ob => {
                if (ob.type === 'circle') {
                    for(let i=0; i<4; i++) {
                        let start = ob.rotation + i*(Math.PI/2);
                        let end = start + (Math.PI/2) - 0.05; // slight gap
                        drawArc(ctx, ob.x, ob.y, ob.radius, ob.thickness, start, end, COLORS[i]);
                    }
                } else if (ob.type === 'cross') {
                    for(let i=0; i<4; i++) {
                        ctx.save();
                        ctx.translate(ob.x, ob.y);
                        ctx.rotate(ob.rotation + i*(Math.PI/2));
                        ctx.fillStyle = COLORS[i];
                        ctx.shadowColor = COLORS[i];
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        // Rounded rect arm
                        ctx.roundRect(0, -ob.thickness/2, ob.radius, ob.thickness, ob.thickness/2);
                        ctx.fill();
                        ctx.restore();
                    }
                } else if (ob.type === 'star' && !ob.collected) {
                    // Multi-colored switcher
                    let t = Date.now() / 1000;
                    let c = COLORS[Math.floor((t*2)%4)];
                    drawStar(ctx, ob.x, ob.y, ob.radius, 5, 0.4, c);
                } else if (ob.type === 'point' && !ob.collected) {
                    // Simple white star
                    drawStar(ctx, ob.x, ob.y, ob.radius, 4, 0.3, '#fff');
                }
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 20;
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Draw Ball
            if (isRunning) {
                let bc = COLORS[ball.colorIndex];
                ctx.fillStyle = bc;
                ctx.shadowColor = bc;
                ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        // Add roundRect polyfill for older browsers if needed, though canvas in modern supports it.
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x+r, y);
                this.arcTo(x+w, y,   x+w, y+h, r);
                this.arcTo(x+w, y+h, x,   y+h, r);
                this.arcTo(x,   y+h, x,   y,   r);
                this.arcTo(x,   y,   x+w, y,   r);
                this.closePath();
                return this;
            }
        }

        function jump() {
            if (isRunning) ball.vy = JUMP_FORCE;
        }

        function loop() {
            if(!isRunning && particles.length === 0) return;
            if(isRunning) update();
            else {
                for(let i=particles.length-1; i>=0; i--) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.life--;
                    if(p.life <= 0) particles.splice(i, 1);
                }
            }
            draw();
            requestAnimationFrame(loop);
        }

        function die() {
            isRunning = false;
            createBurst(ball.x, ball.y, COLORS[ball.colorIndex]);
            
            setTimeout(() => {
                document.getElementById('final-stats').textContent = `Score: ${score}`;
                document.getElementById('game-over-screen').classList.remove('hidden');
            }, 800);
        }

        let tapZone = document.getElementById('tap-zone');
        tapZone.addEventListener('mousedown', jump);
        tapZone.addEventListener('touchstart', (e)=>{e.preventDefault(); jump();}, {passive:false});
        window.addEventListener('keydown', (e)=>{ if(e.code==='Space' || e.code==='ArrowUp') jump(); });

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('scoreEl').textContent = `0`;
            
            initLevel();
            particles = [];
            isRunning = true;
            jump(); // initial bounce
            loop();
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
