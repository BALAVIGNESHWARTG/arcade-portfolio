<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI vs Player Snake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0; padding: 0;
            background-color: #050510;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            padding: 15px;
            width: 100%;
            background: linear-gradient(180deg, rgba(0, 243, 255, 0.1) 0%, transparent 100%);
            border-bottom: 1px solid #333;
            z-index: 10;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #fff;
            letter-spacing: 2px;
        }

        .score-box {
            font-size: 18px;
            padding: 5px 15px;
            border-radius: 5px;
        }

        .score-blue { color: #00f3ff; text-shadow: 0 0 10px #00f3ff; border: 1px solid #00f3ff; }
        .score-red { color: #ff003c; text-shadow: 0 0 10px #ff003c; border: 1px solid #ff003c; }

        #main-container {
            display: flex;
            flex: 1;
            width: 100%;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            background-color: #0a0a1a;
            border: 2px solid #333;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 20;
            display: none;
        }

        .game-over h1 { font-size: 40px; margin-bottom: 10px; }
        .game-over p { font-size: 20px; margin-bottom: 30px; color: #aaa; }

        button {
            background: transparent;
            border: 2px solid #00f3ff;
            color: #00f3ff;
            font-family: inherit;
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 15px #00f3ff;
        }

        /* Mobile Controls */
        #mobile-controls {
            display: none;
            width: 100%;
            max-width: 400px;
            padding: 10px;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            #mobile-controls { display: grid; }
        }

        .d-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border-radius: 10px;
            padding: 15px 0;
            cursor: pointer;
        }
        .d-btn:active { background: rgba(0,243,255,0.3); border-color: #00f3ff; }
        
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

    </style>
</head>
<body>

    <header>
        <div class="score-box score-blue">YOU: <span id="score-p1">0</span></div>
        <div class="title">VS AI</div>
        <div class="score-box score-red">AI: <span id="score-p2">0</span></div>
    </header>

    <div id="main-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="game-over" id="game-over">
            <h1 id="go-title">GAME OVER</h1>
            <p id="go-desc">Somebody crashed!</p>
            <button onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <div id="mobile-controls">
        <div class="d-btn" id="btn-up">▲</div>
        <div class="d-btn" id="btn-left">◀</div>
        <div class="d-btn" id="btn-down">▼</div>
        <div class="d-btn" id="btn-right">▶</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreP1El = document.getElementById('score-p1');
        const scoreP2El = document.getElementById('score-p2');
        const gameOverScreen = document.getElementById('game-over');
        const goTitle = document.getElementById('go-title');
        const goDesc = document.getElementById('go-desc');

        const TILE = 20;
        let COLS = canvas.width / TILE;
        let ROWS = canvas.height / TILE;

        let p1, ai, food;
        let gameLoop;
        let isGameOver = false;

        function resizeCanvas() {
            let container = document.getElementById('main-container');
            let size = Math.min(container.clientWidth - 20, container.clientHeight - 20, 600);
            size = Math.floor(size / TILE) * TILE; // snap to grid
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Snake {
            constructor(x, y, dx, dy, color, isAI) {
                this.body = [{x, y}];
                this.dx = dx;
                this.dy = dy;
                this.nextDx = dx;
                this.nextDy = dy;
                this.color = color;
                this.isAI = isAI;
                this.score = 0;
                this.dead = false;
            }
            
            update(gridOccupied) {
                if(this.dead) return;

                if (this.isAI) {
                    this.computeAIMove(gridOccupied);
                }

                this.dx = this.nextDx;
                this.dy = this.nextDy;
                
                let head = this.body[0];
                let newHead = { x: head.x + this.dx, y: head.y + this.dy };
                this.body.unshift(newHead);
                
                // Note: collision and eating is handled in main loop
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                this.body.forEach((part, index) => {
                    if(index === 0) ctx.fillStyle = '#fff'; // head
                    else ctx.fillStyle = this.color;
                    ctx.fillRect(part.x * TILE + 1, part.y * TILE + 1, TILE - 2, TILE - 2);
                });
                ctx.shadowBlur = 0;
            }

            // --- A* Pathfinding for AI ---
            computeAIMove(gridOccupied) {
                let head = this.body[0];
                let path = aStar(head, food, gridOccupied);
                
                if (path && path.length > 1) {
                    let nextStep = path[1];
                    this.nextDx = nextStep.x - head.x;
                    this.nextDy = nextStep.y - head.y;
                } else {
                    // Fallback: try to survive if no path to food
                    let dirs = [{x:0,y:-1}, {x:0,y:1}, {x:-1,y:0}, {x:1,y:0}];
                    // Randomize to avoid getting stuck in loops
                    dirs.sort(() => Math.random() - 0.5);
                    
                    let bestDir = null;
                    let maxFree = -1;

                    for(let d of dirs) {
                        // Prevent 180 turn
                        if(d.x === -this.dx && d.y === -this.dy && this.body.length > 1) continue;
                        
                        let nx = head.x + d.x;
                        let ny = head.y + d.y;
                        
                        if(nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                            if(!gridOccupied[ny][nx]) {
                                // Flood fill to see how much space is available
                                let freeSpace = floodFillScore(nx, ny, gridOccupied);
                                if(freeSpace > maxFree) {
                                    maxFree = freeSpace;
                                    bestDir = d;
                                }
                            }
                        }
                    }

                    if(bestDir) {
                        this.nextDx = bestDir.x;
                        this.nextDy = bestDir.y;
                    }
                }
            }
        }

        // Flood fill to evaluate survivability of a move
        function floodFillScore(startX, startY, gridOccupied) {
            let visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));
            let queue = [{x: startX, y: startY}];
            visited[startY][startX] = true;
            let count = 0;

            while(queue.length > 0 && count < 50) { // Limit search depth for perf
                let cur = queue.shift();
                count++;
                
                let dirs = [[0,-1], [0,1], [-1,0], [1,0]];
                for(let d of dirs) {
                    let nx = cur.x + d[0];
                    let ny = cur.y + d[1];
                    if(nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                        if(!gridOccupied[ny][nx] && !visited[ny][nx]) {
                            visited[ny][nx] = true;
                            queue.push({x: nx, y: ny});
                        }
                    }
                }
            }
            return count;
        }

        // A* Algorithm
        function aStar(start, goal, gridOccupied) {
            let openSet = [ {x: start.x, y: start.y, g: 0, f: h(start, goal), parent: null} ];
            let closedSet = Array.from({length: ROWS}, () => Array(COLS).fill(false));
            
            while(openSet.length > 0) {
                // Get node with lowest f
                openSet.sort((a,b) => a.f - b.f);
                let cur = openSet.shift();
                
                if (cur.x === goal.x && cur.y === goal.y) {
                    // Reconstruct path
                    let path = [];
                    let curr = cur;
                    while(curr) {
                        path.push({x: curr.x, y: curr.y});
                        curr = curr.parent;
                    }
                    return path.reverse();
                }
                
                closedSet[cur.y][cur.x] = true;
                
                let dirs = [[0,-1], [0,1], [-1,0], [1,0]];
                for(let d of dirs) {
                    let nx = cur.x + d[0];
                    let ny = cur.y + d[1];
                    
                    if(nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                        if(closedSet[ny][nx] || gridOccupied[ny][nx]) continue;
                        
                        let gScore = cur.g + 1;
                        let existing = openSet.find(n => n.x === nx && n.y === ny);
                        
                        if(!existing) {
                            openSet.push({x: nx, y: ny, g: gScore, f: gScore + h({x:nx, y:ny}, goal), parent: cur});
                        } else if(gScore < existing.g) {
                            existing.g = gScore;
                            existing.f = gScore + h({x:nx, y:ny}, goal);
                            existing.parent = cur;
                        }
                    }
                }
            }
            return null; // No path
        }

        function h(a, b) {
            return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); // Manhattan distance
        }

        function spawnFood() {
            let emptySpots = [];
            for(let y=0; y<ROWS; y++) {
                for(let x=0; x<COLS; x++) {
                    let p1Hit = p1.body.some(b => b.x === x && b.y === y);
                    let aiHit = ai.body.some(b => b.x === x && b.y === y);
                    if(!p1Hit && !aiHit) {
                        emptySpots.push({x, y});
                    }
                }
            }
            if(emptySpots.length > 0) {
                let spot = emptySpots[Math.floor(Math.random() * emptySpots.length)];
                food = spot;
            }
        }

        function resetGame() {
            p1 = new Snake(5, Math.floor(ROWS/2), 1, 0, '#00f3ff', false);
            ai = new Snake(COLS - 6, Math.floor(ROWS/2), -1, 0, '#ff003c', true);
            
            scoreP1El.innerText = 0;
            scoreP2El.innerText = 0;
            
            spawnFood();
            isGameOver = false;
            gameOverScreen.style.display = 'none';
            
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 100);
        }

        function checkCollisions(snake, otherSnake) {
            let head = snake.body[0];
            
            // Wall
            if(head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return true;
            
            // Self
            for(let i=1; i<snake.body.length; i++) {
                if(head.x === snake.body[i].x && head.y === snake.body[i].y) return true;
            }
            
            // Other
            for(let i=0; i<otherSnake.body.length; i++) {
                if(head.x === otherSnake.body[i].x && head.y === otherSnake.body[i].y) return true;
            }
            
            return false;
        }

        function update() {
            if(isGameOver) return;

            // Create grid representing occupied spaces for AI
            let gridOccupied = Array.from({length: ROWS}, () => Array(COLS).fill(false));
            p1.body.forEach(b => gridOccupied[b.y][b.x] = true);
            // Ignore AI tail if it's going to move (approximated by making last segment passable unless eating)
            ai.body.forEach((b, i) => {
                if(i !== ai.body.length - 1) gridOccupied[b.y][b.x] = true;
            });

            // Move
            p1.update();
            ai.update(gridOccupied);

            // Check Food
            let p1Ate = p1.body[0].x === food.x && p1.body[0].y === food.y;
            let aiAte = ai.body[0].x === food.x && ai.body[0].y === food.y;

            if(!p1Ate) p1.body.pop(); else { p1.score++; scoreP1El.innerText = p1.score; }
            if(!aiAte) ai.body.pop(); else { ai.score++; scoreP2El.innerText = ai.score; }

            if(p1Ate || aiAte) spawnFood();

            // Head to head tie check
            if(p1.body[0].x === ai.body[0].x && p1.body[0].y === ai.body[0].y) {
                p1.dead = true; ai.dead = true;
            } else {
                if(checkCollisions(p1, ai)) p1.dead = true;
                if(checkCollisions(ai, p1)) ai.dead = true;
            }

            if(p1.dead || ai.dead) {
                isGameOver = true;
                clearInterval(gameLoop);
                gameOverScreen.style.display = 'flex';
                
                if(p1.dead && ai.dead) {
                    goTitle.innerText = "DRAW!";
                    goTitle.style.color = '#fff';
                    goDesc.innerText = "Mutual destruction.";
                } else if(p1.dead) {
                    goTitle.innerText = "AI WINS!";
                    goTitle.style.color = '#ff003c';
                    goDesc.innerText = "The machine was superior.";
                } else {
                    goTitle.innerText = "YOU WIN!";
                    goTitle.style.color = '#00f3ff';
                    goDesc.innerText = "Humanity prevails!";
                }
            }

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Grid
            ctx.strokeStyle = '#1a1a2a';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let x=0; x<=canvas.width; x+=TILE) { ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); }
            for(let y=0; y<=canvas.height; y+=TILE) { ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); }
            ctx.stroke();

            // Food
            ctx.fillStyle = '#39ff14';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#39ff14';
            ctx.fillRect(food.x * TILE + 2, food.y * TILE + 2, TILE - 4, TILE - 4);
            ctx.shadowBlur = 0;

            p1.draw();
            ai.draw();
        }

        // Input
        window.addEventListener('keydown', e => {
            if(isGameOver) return;
            if((e.key === 'ArrowUp' || e.key === 'w') && p1.dy === 0) { p1.nextDx = 0; p1.nextDy = -1; }
            if((e.key === 'ArrowDown' || e.key === 's') && p1.dy === 0) { p1.nextDx = 0; p1.nextDy = 1; }
            if((e.key === 'ArrowLeft' || e.key === 'a') && p1.dx === 0) { p1.nextDx = -1; p1.nextDy = 0; }
            if((e.key === 'ArrowRight' || e.key === 'd') && p1.dx === 0) { p1.nextDx = 1; p1.nextDy = 0; }
        });

        // Mobile Controls
        document.getElementById('btn-up').onclick = () => { if(p1.dy === 0) { p1.nextDx = 0; p1.nextDy = -1; } };
        document.getElementById('btn-down').onclick = () => { if(p1.dy === 0) { p1.nextDx = 0; p1.nextDy = 1; } };
        document.getElementById('btn-left').onclick = () => { if(p1.dx === 0) { p1.nextDx = -1; p1.nextDy = 0; } };
        document.getElementById('btn-right').onclick = () => { if(p1.dx === 0) { p1.nextDx = 1; p1.nextDy = 0; } };

        // Swipe support
        let touchStartX = 0;
        let touchStartY = 0;
        window.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive:false});
        
        window.addEventListener('touchmove', e => { e.preventDefault(); }, {passive:false}); // prevent scroll

        window.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;
            
            if(Math.abs(dx) > Math.abs(dy)) {
                if(dx > 30 && p1.dx === 0) { p1.nextDx = 1; p1.nextDy = 0; }
                else if(dx < -30 && p1.dx === 0) { p1.nextDx = -1; p1.nextDy = 0; }
            } else {
                if(dy > 30 && p1.dy === 0) { p1.nextDx = 0; p1.nextDy = 1; }
                else if(dy < -30 && p1.dy === 0) { p1.nextDx = 0; p1.nextDy = -1; }
            }
        });

        // Start
        resetGame();

    </script>
</body>
</html>
