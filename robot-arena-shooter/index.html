<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Robot Arena</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #000;
            --player-color: #39ff14;
            --bullet-color: #39ff14;
            --grunt-color: #ff0044;
            --hulk-color: #ffaa00;
            --brain-color: #00f3ff;
            --text-color: #fff;
            --ui-bg: rgba(0, 0, 0, 0.85);
            --border-color: #ff0044;
        }

        * { box-sizing: border-box; touch-action: none; }
        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Press Start 2P', monospace; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        #game-container {
            position: relative; border: 4px solid var(--border-color);
            box-shadow: 0 0 30px var(--border-color);
            background-color: var(--bg-color);
            border-radius: 10px;
        }
        canvas { display: block; }

        #ui-layer {
            position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;
            display:flex; flex-direction:column; justify-content:space-between; padding:15px; z-index: 10;
        }
        .hud { display: flex; justify-content: space-between; text-shadow: 0 0 5px var(--text-color); font-size: 14px; }

        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: var(--ui-bg); border: 2px solid var(--border-color); padding: 30px;
            text-align: center; pointer-events: auto; box-shadow: 0 0 30px rgba(255,0,68,0.3); z-index: 20; width: 80%; max-width: 450px;
        }
        h1 { color: var(--player-color); text-shadow: 0 0 10px var(--player-color); margin-bottom: 20px; font-size: 20px; line-height: 1.5; }
        p { margin-bottom: 20px; font-size: 10px; color: #ccc; line-height: 1.6; }
        button {
            background: transparent; color: var(--player-color); border: 2px solid var(--player-color);
            padding: 12px 24px; font-family: 'Press Start 2P', monospace; font-size: 14px; cursor: pointer;
            text-shadow: 0 0 10px var(--player-color); box-shadow: 0 0 10px var(--player-color); transition: all 0.2s; text-transform: uppercase;
        }
        button:hover { background: var(--player-color); color: #000; box-shadow: 0 0 30px var(--player-color); }
        .hidden { display: none !important; }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.3));
            background-size: 100% 4px; pointer-events: none; z-index: 100; opacity: 0.6;
        }

        /* Dual Joysticks */
        .joystick-zone {
            position: absolute; bottom: 20px; width: 100px; height: 100px;
            border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.2); pointer-events: auto; display: none; z-index: 15;
        }
        #joy-left { left: 20px; border-color: rgba(57, 255, 20, 0.3); }
        #joy-right { right: 20px; border-color: rgba(255, 0, 68, 0.3); }
        
        .joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
            border-radius: 50%; transform: translate(-50%, -50%);
        }
        #joy-left .joystick-knob { background: rgba(57, 255, 20, 0.5); }
        #joy-right .joystick-knob { background: rgba(255, 0, 68, 0.5); }

        @media (hover: none) and (pointer: coarse) {
            .joystick-zone { display: block; }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-layer">
            <div class="hud">
                <span id="scoreEl">SCORE: 0</span>
                <span id="waveEl">WAVE: 1</span>
            </div>
            
            <div class="joystick-zone" id="joy-left">
                <div class="joystick-knob" id="knob-left"></div>
            </div>
            <div class="joystick-zone" id="joy-right">
                <div class="joystick-knob" id="knob-right"></div>
            </div>
        </div>
        <div id="start-screen" class="modal">
            <h1>ROBOT ARENA</h1>
            <p>CROWD CONTROL DIRECTIVE.<br><br>DESKTOP: WASD MOVES. ARROWS SHOOT.<br>MOBILE: DUAL STICKS.<br><br>GRUNTS: RED (CHASE)<br>HULKS: ORANGE (INDESTRUCTIBLE)<br>BRAINS: BLUE (ERRATIC)</p>
            <button id="start-btn">INITIALIZE</button>
        </div>
        <div id="game-over-screen" class="modal hidden">
            <h1 style="color: var(--grunt-color); text-shadow: 0 0 10px var(--grunt-color);">OVERRUN</h1>
            <p id="final-score">FINAL SCORE: 0</p>
            <button id="restart-btn">REBOOT</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('game-container');
        
        let isGameRunning = false;
        let score = 0, wave = 1;

        // Player
        let player = { x: 400, y: 300, radius: 10, speed: 5 };
        let fireCooldown = 0;
        
        // Input
        let keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        let moveJoy = { active: false, x: 0, y: 0 };
        let fireJoy = { active: false, x: 0, y: 0 };

        // Entities
        let enemies = [];
        let bullets = [];
        let particles = [];

        // Setup
        function resize() {
            const ratio = 800/600;
            const h = Math.min(window.innerHeight - 40, 600);
            const w = Math.min(window.innerWidth - 20, h * ratio);
            canvas.style.width = `${w}px`;
            canvas.style.height = `${w}px / ${ratio}`;
            gameContainer.style.width = `${w}px`;
            gameContainer.style.height = `${w}px / ${ratio}`;
        }
        window.addEventListener('resize', resize); resize();

        function createParticles(x, y, color, count, speed = 8) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random()-0.5)*speed, vy: (Math.random()-0.5)*speed,
                    life: 1, color
                });
            }
        }

        function spawnWave(w) {
            enemies = [];
            document.getElementById('waveEl').textContent = `WAVE: ${w}`;
            
            let gruntCount = 20 + w * 5;
            let hulkCount = Math.min(10, Math.floor(w / 2));
            let brainCount = Math.floor(w / 3);

            for(let i=0; i<gruntCount; i++) {
                let ex, ey;
                do { ex = Math.random()*800; ey = Math.random()*600; } while (Math.hypot(ex-player.x, ey-player.y) < 200);
                enemies.push({ x: ex, y: ey, type: 'grunt', radius: 10, speed: 2 + Math.random()*w*0.1 });
            }

            for(let i=0; i<hulkCount; i++) {
                let ex, ey;
                do { ex = Math.random()*800; ey = Math.random()*600; } while (Math.hypot(ex-player.x, ey-player.y) < 200);
                enemies.push({ x: ex, y: ey, type: 'hulk', radius: 15, speed: 1 });
            }

            for(let i=0; i<brainCount; i++) {
                let ex, ey;
                do { ex = Math.random()*800; ey = Math.random()*600; } while (Math.hypot(ex-player.x, ey-player.y) < 200);
                enemies.push({ x: ex, y: ey, type: 'brain', radius: 12, speed: 3, timer: 0, targetX: ex, targetY: ey });
            }
        }

        function update() {
            // Movement
            let mx = 0, my = 0;
            if (moveJoy.active) {
                mx = moveJoy.x; my = moveJoy.y;
            } else {
                if (keys.w) my -= 1; if (keys.s) my += 1;
                if (keys.a) mx -= 1; if (keys.d) mx += 1;
                if (mx !== 0 && my !== 0) { mx *= 0.707; my *= 0.707; }
            }
            player.x += mx * player.speed;
            player.y += my * player.speed;
            
            player.x = Math.max(player.radius, Math.min(800 - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(600 - player.radius, player.y));

            // Firing (8-way or analog)
            if (fireCooldown > 0) fireCooldown--;
            let fx = 0, fy = 0, firing = false;
            
            if (fireJoy.active && Math.hypot(fireJoy.x, fireJoy.y) > 0.2) {
                fx = fireJoy.x; fy = fireJoy.y;
                let len = Math.hypot(fx, fy);
                fx /= len; fy /= len; // Normalize for consistent speed
                firing = true;
            } else {
                if (keys.ArrowUp) fy -= 1; if (keys.ArrowDown) fy += 1;
                if (keys.ArrowLeft) fx -= 1; if (keys.ArrowRight) fx += 1;
                if (fx !== 0 || fy !== 0) {
                    if (fx !== 0 && fy !== 0) { fx *= 0.707; fy *= 0.707; }
                    firing = true;
                }
            }

            if (firing && fireCooldown <= 0) {
                bullets.push({ x: player.x, y: player.y, vx: fx * 15, vy: fy * 15, life: 60 });
                fireCooldown = 6;
            }

            // Enemies
            let gruntsRemaining = 0;

            enemies.forEach((e, i) => {
                if (e.type === 'grunt') {
                    gruntsRemaining++;
                    let angle = Math.atan2(player.y - e.y, player.x - e.x);
                    e.x += Math.cos(angle) * e.speed;
                    e.y += Math.sin(angle) * e.speed;
                } else if (e.type === 'hulk') {
                    // Hulks move slowly towards player, wander a bit
                    let angle = Math.atan2(player.y - e.y, player.x - e.x) + (Math.random()-0.5)*0.5;
                    e.x += Math.cos(angle) * e.speed;
                    e.y += Math.sin(angle) * e.speed;
                } else if (e.type === 'brain') {
                    gruntsRemaining++; // Brains also must die
                    e.timer--;
                    if (e.timer <= 0) {
                        e.targetX = player.x + (Math.random()-0.5)*300;
                        e.targetY = player.y + (Math.random()-0.5)*300;
                        e.timer = 60 + Math.random()*60;
                    }
                    let angle = Math.atan2(e.targetY - e.y, e.targetX - e.x);
                    e.x += Math.cos(angle) * e.speed;
                    e.y += Math.sin(angle) * e.speed;
                }

                // Contain
                e.x = Math.max(e.radius, Math.min(800 - e.radius, e.x));
                e.y = Math.max(e.radius, Math.min(600 - e.radius, e.y));

                // Player Death
                if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius - 2) {
                    createParticles(player.x, player.y, 'var(--player-color)', 50, 20);
                    gameOver();
                }
            });

            // Bullets & Collisions
            bullets.forEach((b, bIdx) => {
                b.x += b.vx; b.y += b.vy; b.life--;
                if (b.life <= 0) { bullets.splice(bIdx, 1); return; }

                for(let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
                    let e = enemies[eIdx];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + 3) {
                        bullets.splice(bIdx, 1); // Bullet destroyed
                        
                        if (e.type === 'hulk') {
                            // Hulks are invincible, bullet absorbed
                            createParticles(b.x, b.y, 'var(--hulk-color)', 5, 2);
                        } else {
                            // Grunts/Brains destroyed
                            score += e.type === 'brain' ? 50 : 10;
                            document.getElementById('scoreEl').textContent = `SCORE: ${score}`;
                            createParticles(e.x, e.y, e.type === 'brain' ? 'var(--brain-color)' : 'var(--grunt-color)', 20, 10);
                            enemies.splice(eIdx, 1);
                        }
                        break;
                    }
                }
            });

            // Wave clear check
            if (gruntsRemaining === 0) {
                wave++;
                spawnWave(wave);
            }

            // Particles
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.05;
                if(p.life <= 0) particles.splice(i, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, 800, 600);

            // Arena Grid
            ctx.strokeStyle = 'rgba(255, 0, 68, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i=0; i<800; i+=40) { ctx.moveTo(i,0); ctx.lineTo(i,600); }
            for(let j=0; j<600; j+=40) { ctx.moveTo(0,j); ctx.lineTo(800,j); }
            ctx.stroke();

            ctx.globalCompositeOperation = 'lighter';

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                 
                ctx.fillRect(p.x, p.y, 4, 4);
            });
            ctx.globalAlpha = 1;

            // Bullets
            ctx.fillStyle = 'var(--bullet-color)';
             
            bullets.forEach(b => {
                ctx.fillRect(b.x-2, b.y-2, 4, 4);
            });

            // Enemies
            ctx.lineWidth = 2;
            enemies.forEach(e => {
                ctx.fillStyle = '#000';
                if (e.type === 'grunt') {
                    ctx.strokeStyle = 'var(--grunt-color)';
                     
                    ctx.beginPath(); ctx.rect(e.x - e.radius, e.y - e.radius, e.radius*2, e.radius*2);
                    ctx.fill(); ctx.stroke();
                } else if (e.type === 'hulk') {
                    ctx.strokeStyle = 'var(--hulk-color)';
                     
                    ctx.beginPath(); ctx.rect(e.x - e.radius, e.y - e.radius, e.radius*2, e.radius*2);
                    ctx.moveTo(e.x - e.radius, e.y - e.radius); ctx.lineTo(e.x + e.radius, e.y + e.radius);
                    ctx.moveTo(e.x + e.radius, e.y - e.radius); ctx.lineTo(e.x - e.radius, e.y + e.radius);
                    ctx.fill(); ctx.stroke();
                } else if (e.type === 'brain') {
                    ctx.strokeStyle = 'var(--brain-color)';
                     
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
                    ctx.fill(); ctx.stroke();
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius/2, 0, Math.PI*2); ctx.stroke();
                }
            });

            // Player
            ctx.strokeStyle = 'var(--player-color)';
            ctx.fillStyle = '#000';
            ctx.lineWidth = 3;
             
            
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.radius);
            ctx.lineTo(player.x + player.radius, player.y);
            ctx.lineTo(player.x, player.y + player.radius);
            ctx.lineTo(player.x - player.radius, player.y);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.globalCompositeOperation = 'source-over';
            
        }

        function loop() {
            if(!isGameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Desktop Input
        window.addEventListener('keydown', e => { 
            if(keys.hasOwnProperty(e.key)) keys[e.key] = true; 
        });
        window.addEventListener('keyup', e => { 
            if(keys.hasOwnProperty(e.key)) keys[e.key] = false; 
        });

        // Mobile Dual Joystick Input
        function bindJoystick(zoneId, knobId, joyObj) {
            const zone = document.getElementById(zoneId);
            const knob = document.getElementById(knobId);
            
            function handle(e) {
                e.preventDefault();
                let touch = e.changedTouches[0];
                let rect = zone.getBoundingClientRect();
                let cx = rect.left + rect.width/2;
                let cy = rect.top + rect.height/2;
                let dx = touch.clientX - cx;
                let dy = touch.clientY - cy;
                let dist = Math.hypot(dx, dy);
                let maxDist = rect.width/2;
                
                if (dist > maxDist) {
                    dx = (dx/dist) * maxDist;
                    dy = (dy/dist) * maxDist;
                }
                
                knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                joyObj.x = dx / maxDist;
                joyObj.y = dy / maxDist;
                joyObj.active = true;
            }
            
            zone.addEventListener('touchstart', handle, {passive:false});
            zone.addEventListener('touchmove', handle, {passive:false});
            zone.addEventListener('touchend', e => {
                e.preventDefault();
                knob.style.transform = 'translate(-50%, -50%)';
                joyObj.active = false;
                joyObj.x = 0; joyObj.y = 0;
            }, {passive:false});
        }

        bindJoystick('joy-left', 'knob-left', moveJoy);
        bindJoystick('joy-right', 'knob-right', fireJoy);

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            score = 0; wave = 1;
            player.x = 400; player.y = 300;
            bullets = []; particles = [];
            
            document.getElementById('scoreEl').textContent = `SCORE: 0`;
            
            isGameRunning = true;
            spawnWave(wave);
            loop();
        }

        function gameOver() {
            isGameRunning = false;
            document.getElementById('final-score').textContent = `FINAL SCORE: ${score}\nWAVES CLEARED: ${wave-1}`;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
