<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Defense</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700&display=swap');

        :root {
            --bg: #0d1117;
            --path: #1f2937;
            --grid: #374151;
            --turret: #00ffcc;
            --enemy: #ff0055;
            --laser: #f1c40f;
            --base: #3b82f6;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0; padding: 0; background-color: #000; color: #fff;
            font-family: 'Exo 2', sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        #game-container {
            position: relative; width: 100%; height: 100%; max-width: 800px; max-height: 600px;
            background-color: var(--bg); border: 1px solid rgba(55, 65, 81, 0.5);
            overflow: hidden; border-radius: 10px; box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 5; }

        .hud {
            position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between;
            font-size: 20px; z-index: 10; pointer-events: none; font-weight: 700;
        }
        .hud-panel {
            background: rgba(13, 17, 23, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            padding: 10px 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; z-index: 10;
        }
        
        .build-btn {
            background: rgba(13, 17, 23, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0,255,204,0.3); color: var(--turret);
            padding: 12px 25px; border-radius: 8px; cursor: pointer; font-family: 'Exo 2', sans-serif; font-weight: 700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: all 0.2s;
        }
        .build-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,255,204,0.2); }
        .build-btn.selected {
            background: rgba(0,255,204,0.15); border: 1px solid var(--turret); box-shadow: 0 0 15px rgba(0,255,204,0.4);
        }

        /* Glassmorphism Modals */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(13, 17, 23, 0.6); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.05); z-index: 30;
            border-radius: 15px; pointer-events: auto; width: 85%; max-width: 450px;
        }
        h1 { color: #fff; margin-top: 0; font-size: 38px; text-shadow: 0 0 15px var(--base); margin-bottom: 20px; letter-spacing: 2px;}
        p { color: #cbd5e1; line-height: 1.6; font-size: 16px; margin-bottom: 30px; }
        button {
            background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(59,130,246,0.05));
            color: #fff; border: 1px solid rgba(59,130,246,0.4);
            padding: 15px 40px; font-family: 'Exo 2', sans-serif; font-size: 20px; font-weight: 700;
            cursor: pointer; transition: 0.2s; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            text-transform: uppercase; letter-spacing: 1px;
        }
        button:hover { background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(59,130,246,0.1)); transform: translateY(-2px); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
            <div class="hud-panel" style="color:var(--turret)" id="moneyEl">CREDITS: $100</div>
            <div class="hud-panel" id="waveEl">WAVE: 1</div>
            <div class="hud-panel" style="color:var(--enemy)" id="livesEl">BASE: 10</div>
        </div>
        
        <div class="controls">
            <div class="build-btn selected" id="btn-turret">TURRET ($50)</div>
        </div>

        <div id="start-screen" class="modal">
            <h1>NEON DEFENSE</h1>
            <p>Tap empty grid squares to build turrets.<br>Defend your base from incoming viruses.<br>Survive all waves!</p>
            <button id="start-btn">INITIATE</button>
        </div>
        
        <div id="game-over-screen" class="modal hidden">
            <h1 id="result-title" style="color:var(--enemy); text-shadow: 0 0 15px var(--enemy);">BREACHED</h1>
            <p id="final-stats">You survived X waves.</p>
            <button id="restart-btn" style="border-color:rgba(255,0,85,0.5); background: linear-gradient(135deg, rgba(255,0,85,0.2), rgba(255,0,85,0.05));">RETRY</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        let width, height;
        const GRID_SIZE = 40;
        let cols, rows;
        let offsetX = 0, offsetY = 0;

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width; canvas.height = height;
            
            cols = Math.floor(width / GRID_SIZE);
            rows = Math.floor(height / GRID_SIZE);
            offsetX = (width - cols * GRID_SIZE) / 2;
            offsetY = (height - rows * GRID_SIZE) / 2;
        }
        window.addEventListener('resize', resize); resize();

        let isRunning = false;
        let money = 100;
        let lives = 10;
        let wave = 1;
        let frame = 0;
        let enemiesSpawned = 0;
        let enemiesToSpawn = 10;
        let waveDelay = 300;

        let grid = [];
        let path = [];
        
        let turrets = [];
        let enemies = [];
        let particles = [];

        function initLevel() {
            grid = [];
            for (let x = 0; x < cols; x++) {
                grid[x] = [];
                for (let y = 0; y < rows; y++) {
                    grid[x][y] = 0; 
                }
            }

            path = [];
            let cx = 0; let cy = 2; // start a bit lower
            path.push({x: cx, y: cy});
            grid[cx][cy] = 1;

            let dir = 0; 
            while (cx < cols - 1) {
                if (cx < cols - 2 && (dir === 0 || (dir !== 0 && Math.random() < 0.3))) {
                    cx++; dir = 0;
                } else if (cy < rows - 2 && dir === 0 && Math.random() < 0.4) {
                    cy++; dir = 1;
                } else if (cy > 1 && dir === 0 && Math.random() < 0.4) {
                    cy--; dir = 3; 
                } else {
                    cx++; dir = 0;
                }
                
                cy = Math.max(1, Math.min(rows-2, cy));
                if (grid[cx][cy] === 1) break; 
                
                path.push({x: cx, y: cy});
                grid[cx][cy] = 1;
            }
            grid[cx][cy] = 3; 
        }

        function spawnEnemy() {
            enemies.push({
                x: path[0].x * GRID_SIZE + GRID_SIZE/2,
                y: path[0].y * GRID_SIZE + GRID_SIZE/2,
                pathIndex: 0,
                hp: 10 + wave * 5,
                maxHp: 10 + wave * 5,
                speed: 1.0 + wave * 0.1,
                reward: 5,
                vx: 0, vy: 0 // For boids separation
            });
        }

        function lerpAngle(a, b, t) {
            let diff = b - a;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            return a + diff * t;
        }

        function update() {
            frame++;
            
            if (waveDelay > 0) {
                waveDelay--;
            } else if (enemiesSpawned < enemiesToSpawn) {
                if (frame % 40 === 0) { // spawn a bit faster
                    spawnEnemy();
                    enemiesSpawned++;
                }
            } else if (enemies.length === 0) {
                wave++;
                enemiesSpawned = 0;
                enemiesToSpawn = 10 + wave * 2;
                waveDelay = 180;
                money += 50; 
            }

            // Turret logic
            turrets.forEach(t => {
                t.cooldown--;
                let target = null;
                let minD = Infinity;
                for (let e of enemies) {
                    let d = Math.hypot(e.x - t.x, e.y - t.y);
                    if (d < t.range && d < minD) {
                        minD = d; target = e;
                    }
                }
                
                if (target) {
                    let targetAngle = Math.atan2(target.y - t.y, target.x - t.x);
                    // Smooth rotation (lerp)
                    t.angle = lerpAngle(t.angle, targetAngle, 0.15);
                    
                    // Fire if roughly facing target and cooldown is ready
                    let angleDiff = Math.abs(t.angle - targetAngle);
                    if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;
                    
                    if (t.cooldown <= 0 && angleDiff < 0.2) {
                        target.hp -= t.damage;
                        t.cooldown = 20; // fire rate
                        
                        particles.push({
                            type: 'laser',
                            x1: t.x + Math.cos(t.angle)*15, 
                            y1: t.y + Math.sin(t.angle)*15,
                            x2: target.x, y2: target.y,
                            life: 6
                        });
                    }
                }
            });

            // Enemy logic with Boids separation
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                if (e.hp <= 0) {
                    money += e.reward;
                    for(let j=0; j<15; j++) {
                        particles.push({
                            type: 'spark',
                            x: e.x, y: e.y,
                            vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6,
                            life: 25
                        });
                    }
                    enemies.splice(i, 1);
                    continue;
                }

                let targetPoint = path[e.pathIndex + 1];
                if (!targetPoint) {
                    lives--;
                    enemies.splice(i, 1);
                    if (lives <= 0) loseGame();
                    continue;
                }

                let tx = targetPoint.x * GRID_SIZE + GRID_SIZE/2;
                let ty = targetPoint.y * GRID_SIZE + GRID_SIZE/2;
                
                // Path following force
                let dx = tx - e.x;
                let dy = ty - e.y;
                let dist = Math.hypot(dx, dy);

                let dirX = (dx / dist) * e.speed;
                let dirY = (dy / dist) * e.speed;

                // Separation force (Boids)
                let sepX = 0, sepY = 0;
                let count = 0;
                for (let other of enemies) {
                    if (other !== e) {
                        let sd = Math.hypot(e.x - other.x, e.y - other.y);
                        if (sd > 0 && sd < 20) { // Separation radius
                            sepX += (e.x - other.x) / sd;
                            sepY += (e.y - other.y) / sd;
                            count++;
                        }
                    }
                }
                
                if (count > 0) {
                    sepX = (sepX / count) * 0.5; // Separation strength
                    sepY = (sepY / count) * 0.5;
                }

                // Apply forces
                e.vx = dirX + sepX;
                e.vy = dirY + sepY;
                
                // Normalize to speed to prevent flying off path
                let vel = Math.hypot(e.vx, e.vy);
                e.x += (e.vx / vel) * e.speed;
                e.y += (e.vy / vel) * e.speed;

                // Progress to next path node
                let newDist = Math.hypot(tx - e.x, ty - e.y);
                if (newDist < e.speed * 1.5) {
                    e.pathIndex++;
                }
            }

            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.life--;
                if (p.type === 'spark') {
                    p.x += p.vx; p.y += p.vy;
                }
                if (p.life <= 0) particles.splice(i, 1);
            }

            document.getElementById('moneyEl').textContent = `CREDITS: $${money}`;
            document.getElementById('waveEl').textContent = `WAVE: ${wave}`;
            document.getElementById('livesEl').textContent = `BASE: ${lives}`;
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.save();
            ctx.translate(offsetX, offsetY);

            // Draw Grid (Subtle)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for(let x=0; x<=cols; x++) { ctx.beginPath(); ctx.moveTo(x*GRID_SIZE, 0); ctx.lineTo(x*GRID_SIZE, rows*GRID_SIZE); ctx.stroke(); }
            for(let y=0; y<=rows; y++) { ctx.beginPath(); ctx.moveTo(0, y*GRID_SIZE); ctx.lineTo(cols*GRID_SIZE, y*GRID_SIZE); ctx.stroke(); }

            // Draw Path
            ctx.fillStyle = 'rgba(31, 41, 55, 0.6)'; // slightly translucent path
            path.forEach(p => {
                ctx.fillRect(p.x * GRID_SIZE, p.y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
            });
            
            // Draw Base
            let baseP = path[path.length-1];
            ctx.fillStyle = 'var(--base)';
            ctx.shadowColor = 'var(--base)';
            ctx.shadowBlur = 20;
            ctx.fillRect(baseP.x * GRID_SIZE, baseP.y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
            ctx.shadowBlur = 0;

            // Draw Turrets
            turrets.forEach(t => {
                // Base
                ctx.fillStyle = '#222';
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(t.gx * GRID_SIZE + 4, t.gy * GRID_SIZE + 4, GRID_SIZE - 8, GRID_SIZE - 8, 4);
                ctx.fill(); ctx.stroke();
                
                // Gun barrel (Rotated)
                ctx.save();
                ctx.translate(t.x, t.y);
                ctx.rotate(t.angle);
                
                ctx.fillStyle = 'var(--turret)';
                ctx.shadowColor = 'var(--turret)';
                ctx.shadowBlur = 10;
                ctx.fillRect(0, -3, 16, 6); // barrel
                
                ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI*2); ctx.fill(); // pivot
                ctx.shadowBlur = 0;
                
                // inner detail
                ctx.fillStyle = '#111';
                ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI*2); ctx.fill(); 
                
                ctx.restore();
            });

            // Draw Enemies
            enemies.forEach(e => {
                ctx.fillStyle = 'var(--enemy)';
                ctx.shadowColor = 'var(--enemy)';
                ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.arc(e.x, e.y, GRID_SIZE * 0.25, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
                
                // HP bar
                let hpPercent = e.hp / e.maxHp;
                ctx.fillStyle = 'rgba(255,0,0,0.5)';
                ctx.fillRect(e.x - 12, e.y - 18, 24, 3);
                ctx.fillStyle = '#0f0';
                ctx.fillRect(e.x - 12, e.y - 18, 24 * hpPercent, 3);
            });

            // Draw Particles (Lasers & Sparks)
            particles.forEach(p => {
                if (p.type === 'laser') {
                    ctx.strokeStyle = 'var(--laser)';
                    ctx.lineWidth = 2.5;
                    ctx.shadowColor = 'var(--laser)';
                    ctx.shadowBlur = 12;
                    ctx.beginPath(); ctx.moveTo(p.x1, p.y1); ctx.lineTo(p.x2, p.y2); ctx.stroke();
                    ctx.shadowBlur = 0;
                } else if (p.type === 'spark') {
                    ctx.fillStyle = 'var(--enemy)';
                    ctx.globalAlpha = p.life / 25;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 1;
                }
            });

            ctx.restore();
        }

        // Polyfill for roundRect
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x+r, y);
                this.arcTo(x+w, y,   x+w, y+h, r);
                this.arcTo(x+w, y+h, x,   y+h, r);
                this.arcTo(x,   y+h, x,   y,   r);
                this.arcTo(x,   y,   x+w, y,   r);
                this.closePath();
                return this;
            }
        }

        function loop() {
            if(!isRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function loseGame() {
            isRunning = false;
            document.getElementById('final-stats').textContent = `You survived to Wave ${wave}.`;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // Input
        canvas.addEventListener('mousedown', e => {
            if(!isRunning) return;
            let rect = canvas.getBoundingClientRect();
            let mx = e.clientX - rect.left - offsetX;
            let my = e.clientY - rect.top - offsetY;
            
            let gx = Math.floor(mx / GRID_SIZE);
            let gy = Math.floor(my / GRID_SIZE);
            
            if (gx >= 0 && gx < cols && gy >= 0 && gy < rows) {
                if (grid[gx][gy] === 0) { // empty
                    if (money >= 50) {
                        money -= 50;
                        grid[gx][gy] = 2;
                        turrets.push({
                            gx: gx, gy: gy,
                            x: gx * GRID_SIZE + GRID_SIZE/2,
                            y: gy * GRID_SIZE + GRID_SIZE/2,
                            angle: -Math.PI/2, // default facing up
                            cooldown: 0,
                            range: 130,
                            damage: 5
                        });
                    }
                }
            }
        });

        canvas.addEventListener('touchstart', e => {
            if(!isRunning) return;
            e.preventDefault();
            let rect = canvas.getBoundingClientRect();
            let mx = e.touches[0].clientX - rect.left - offsetX;
            let my = e.touches[0].clientY - rect.top - offsetY;
            
            let gx = Math.floor(mx / GRID_SIZE);
            let gy = Math.floor(my / GRID_SIZE);
            
            if (gx >= 0 && gx < cols && gy >= 0 && gy < rows) {
                if (grid[gx][gy] === 0) {
                    if (money >= 50) {
                        money -= 50;
                        grid[gx][gy] = 2;
                        turrets.push({
                            gx: gx, gy: gy,
                            x: gx * GRID_SIZE + GRID_SIZE/2,
                            y: gy * GRID_SIZE + GRID_SIZE/2,
                            angle: -Math.PI/2,
                            cooldown: 0,
                            range: 130,
                            damage: 5
                        });
                    }
                }
            }
        }, {passive: false});

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            money = 100; lives = 10; wave = 1; frame = 0;
            enemiesSpawned = 0; enemiesToSpawn = 10; waveDelay = 120;
            turrets = []; enemies = []; particles = [];
            
            initLevel();
            
            isRunning = true;
            loop();
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
