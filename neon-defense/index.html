<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Defense</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@700&display=swap');

        :root {
            --bg: #0d1117;
            --path: #1f2937;
            --grid: #374151;
            --turret: #00ffcc;
            --enemy: #ff0055;
            --laser: #f1c40f;
            --base: #3b82f6;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0; padding: 0; background-color: #000; color: #fff;
            font-family: 'Exo 2', sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        #game-container {
            position: relative; width: 100%; height: 100%; max-width: 800px; max-height: 600px;
            background-color: var(--bg); border: 2px solid var(--grid);
            overflow: hidden; border-radius: 5px; box-shadow: 0 0 20px rgba(55, 65, 81, 0.5);
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 5; }

        .hud {
            position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between;
            font-size: 20px; z-index: 10; pointer-events: none; text-shadow: 0 0 5px #fff;
        }

        .controls {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; z-index: 10;
        }
        
        .build-btn {
            background: rgba(0,0,0,0.8); border: 2px solid var(--turret); color: var(--turret);
            padding: 10px 20px; border-radius: 5px; cursor: pointer; font-family: 'Exo 2', sans-serif;
            box-shadow: 0 0 10px rgba(0,255,204,0.3);
        }
        .build-btn.selected {
            background: var(--turret); color: #000;
        }

        /* Modals */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(13, 17, 23, 0.95); border: 2px solid var(--base); padding: 40px;
            text-align: center; box-shadow: 0 0 30px rgba(59, 130, 246, 0.5); z-index: 30;
            border-radius: 10px; pointer-events: auto; width: 85%; max-width: 450px;
        }
        h1 { color: var(--base); margin-top: 0; font-size: 36px; text-shadow: 0 0 15px var(--base); margin-bottom: 20px; }
        p { color: #ccc; line-height: 1.5; font-size: 16px; margin-bottom: 30px; }
        button {
            background: transparent; color: var(--base); border: 2px solid var(--base);
            padding: 15px 40px; font-family: 'Exo 2', sans-serif; font-size: 20px; cursor: pointer; transition: 0.2s;
            border-radius: 5px; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); text-transform: uppercase;
        }
        button:hover { background: var(--base); color: #000; box-shadow: 0 0 30px var(--base); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
            <div id="moneyEl" style="color:#00ffcc">MONEY: $100</div>
            <div id="waveEl">WAVE: 1</div>
            <div id="livesEl" style="color:#ff0055">BASE HP: 10</div>
        </div>
        
        <div class="controls">
            <div class="build-btn selected" id="btn-turret">Turret ($50)</div>
        </div>

        <div id="start-screen" class="modal">
            <h1>NEON DEFENSE</h1>
            <p>Tap empty grid squares to build turrets.<br>Defend your base from red viruses.<br>Survive all waves!</p>
            <button id="start-btn">INITIATE</button>
        </div>
        
        <div id="game-over-screen" class="modal hidden">
            <h1 id="result-title" style="color:var(--enemy); text-shadow: 0 0 15px var(--enemy);">BREACHED</h1>
            <p id="final-stats">You survived X waves.</p>
            <button id="restart-btn">RETRY</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        let width, height;
        const GRID_SIZE = 40;
        let cols, rows;
        let offsetX = 0, offsetY = 0;

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width; canvas.height = height;
            
            cols = Math.floor(width / GRID_SIZE);
            rows = Math.floor(height / GRID_SIZE);
            offsetX = (width - cols * GRID_SIZE) / 2;
            offsetY = (height - rows * GRID_SIZE) / 2;
        }
        window.addEventListener('resize', resize); resize();

        let isRunning = false;
        let money = 100;
        let lives = 10;
        let wave = 1;
        let frame = 0;
        let enemiesSpawned = 0;
        let enemiesToSpawn = 10;
        let waveDelay = 300;

        let grid = [];
        let path = [];
        
        let turrets = [];
        let enemies = [];
        let particles = [];

        function initLevel() {
            // Initialize empty grid
            grid = [];
            for (let x = 0; x < cols; x++) {
                grid[x] = [];
                for (let y = 0; y < rows; y++) {
                    grid[x][y] = 0; // 0 = empty, 1 = path, 2 = turret
                }
            }

            // Create a simple zig-zag path
            path = [];
            let cx = 0; let cy = 1;
            path.push({x: cx, y: cy});
            grid[cx][cy] = 1;

            let dir = 0; // 0=right, 1=down, 2=left
            while (cx < cols - 1) {
                if (cx < cols - 2 && (dir === 0 || (dir !== 0 && Math.random() < 0.3))) {
                    cx++; dir = 0;
                } else if (cy < rows - 2 && dir === 0 && Math.random() < 0.4) {
                    cy++; dir = 1;
                } else if (cy > 1 && dir === 0 && Math.random() < 0.4) {
                    cy--; dir = 3; // up
                } else {
                    cx++; dir = 0;
                }
                
                // bounds check
                cy = Math.max(1, Math.min(rows-2, cy));
                
                // prevent backtracking on itself
                if (grid[cx][cy] === 1) break; 
                
                path.push({x: cx, y: cy});
                grid[cx][cy] = 1;
            }
            
            // End base
            grid[cx][cy] = 3; 
        }

        function spawnEnemy() {
            enemies.push({
                x: path[0].x * GRID_SIZE + GRID_SIZE/2,
                y: path[0].y * GRID_SIZE + GRID_SIZE/2,
                pathIndex: 0,
                hp: 10 + wave * 5,
                maxHp: 10 + wave * 5,
                speed: 1.0 + wave * 0.1,
                reward: 5
            });
        }

        function update() {
            frame++;
            
            // Wave spawning logic
            if (waveDelay > 0) {
                waveDelay--;
            } else if (enemiesSpawned < enemiesToSpawn) {
                if (frame % 60 === 0) {
                    spawnEnemy();
                    enemiesSpawned++;
                }
            } else if (enemies.length === 0) {
                // Wave Complete
                wave++;
                enemiesSpawned = 0;
                enemiesToSpawn = 10 + wave * 2;
                waveDelay = 180;
                money += 50; // wave bonus
            }

            // Turret logic
            turrets.forEach(t => {
                t.cooldown--;
                if (t.cooldown <= 0) {
                    // Find target
                    let target = null;
                    let minD = Infinity;
                    for (let e of enemies) {
                        let d = Math.hypot(e.x - t.x, e.y - t.y);
                        if (d < t.range && d < minD) {
                            minD = d; target = e;
                        }
                    }
                    if (target) {
                        t.angle = Math.atan2(target.y - t.y, target.x - t.x);
                        target.hp -= t.damage;
                        t.cooldown = 30; // fire rate
                        
                        // Laser particle visual
                        particles.push({
                            type: 'laser',
                            x1: t.x, y1: t.y,
                            x2: target.x, y2: target.y,
                            life: 5
                        });
                    }
                }
            });

            // Enemy logic
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                if (e.hp <= 0) {
                    money += e.reward;
                    // Death explosion
                    for(let j=0; j<10; j++) {
                        particles.push({
                            type: 'spark',
                            x: e.x, y: e.y,
                            vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5,
                            life: 20
                        });
                    }
                    enemies.splice(i, 1);
                    continue;
                }

                let targetPoint = path[e.pathIndex + 1];
                if (!targetPoint) {
                    // Reached end!
                    lives--;
                    enemies.splice(i, 1);
                    if (lives <= 0) loseGame();
                    continue;
                }

                let tx = targetPoint.x * GRID_SIZE + GRID_SIZE/2;
                let ty = targetPoint.y * GRID_SIZE + GRID_SIZE/2;
                
                let dx = tx - e.x;
                let dy = ty - e.y;
                let dist = Math.hypot(dx, dy);

                if (dist < e.speed) {
                    e.x = tx; e.y = ty;
                    e.pathIndex++;
                } else {
                    e.x += (dx / dist) * e.speed;
                    e.y += (dy / dist) * e.speed;
                }
            }

            // Particles
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.life--;
                if (p.type === 'spark') {
                    p.x += p.vx; p.y += p.vy;
                }
                if (p.life <= 0) particles.splice(i, 1);
            }

            // UI
            document.getElementById('moneyEl').textContent = `MONEY: $${money}`;
            document.getElementById('waveEl').textContent = `WAVE: ${wave}`;
            document.getElementById('livesEl').textContent = `BASE HP: ${lives}`;
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.save();
            ctx.translate(offsetX, offsetY);

            // Draw Grid
            ctx.strokeStyle = 'var(--grid)';
            ctx.lineWidth = 1;
            for(let x=0; x<=cols; x++) { ctx.beginPath(); ctx.moveTo(x*GRID_SIZE, 0); ctx.lineTo(x*GRID_SIZE, rows*GRID_SIZE); ctx.stroke(); }
            for(let y=0; y<=rows; y++) { ctx.beginPath(); ctx.moveTo(0, y*GRID_SIZE); ctx.lineTo(cols*GRID_SIZE, y*GRID_SIZE); ctx.stroke(); }

            // Draw Path
            ctx.fillStyle = 'var(--path)';
            path.forEach(p => {
                ctx.fillRect(p.x * GRID_SIZE, p.y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
            });
            
            // Draw Base
            let baseP = path[path.length-1];
            ctx.fillStyle = 'var(--base)';
            ctx.shadowColor = 'var(--base)';
            ctx.shadowBlur = 20;
            ctx.fillRect(baseP.x * GRID_SIZE, baseP.y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
            ctx.shadowBlur = 0;

            // Draw Turrets
            turrets.forEach(t => {
                // Base
                ctx.fillStyle = '#222';
                ctx.fillRect(t.gx * GRID_SIZE + 4, t.gy * GRID_SIZE + 4, GRID_SIZE - 8, GRID_SIZE - 8);
                
                // Gun barrel
                ctx.save();
                ctx.translate(t.x, t.y);
                ctx.rotate(t.angle);
                ctx.fillStyle = 'var(--turret)';
                ctx.fillRect(0, -4, 15, 8);
                ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            });

            // Draw Enemies
            enemies.forEach(e => {
                ctx.fillStyle = 'var(--enemy)';
                ctx.shadowColor = 'var(--enemy)';
                ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.arc(e.x, e.y, GRID_SIZE * 0.3, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
                
                // HP bar
                let hpPercent = e.hp / e.maxHp;
                ctx.fillStyle = '#f00';
                ctx.fillRect(e.x - 10, e.y - 15, 20, 3);
                ctx.fillStyle = '#0f0';
                ctx.fillRect(e.x - 10, e.y - 15, 20 * hpPercent, 3);
            });

            // Draw Particles
            particles.forEach(p => {
                if (p.type === 'laser') {
                    ctx.strokeStyle = 'var(--laser)';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = 'var(--laser)';
                    ctx.shadowBlur = 10;
                    ctx.beginPath(); ctx.moveTo(p.x1, p.y1); ctx.lineTo(p.x2, p.y2); ctx.stroke();
                    ctx.shadowBlur = 0;
                } else if (p.type === 'spark') {
                    ctx.fillStyle = 'var(--enemy)';
                    ctx.globalAlpha = p.life / 20;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 1;
                }
            });

            ctx.restore();
        }

        function loop() {
            if(!isRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function loseGame() {
            isRunning = false;
            document.getElementById('result-title').textContent = 'BASE DESTROYED';
            document.getElementById('result-title').style.color = 'var(--enemy)';
            document.getElementById('final-stats').textContent = `You survived to Wave ${wave}.`;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // Input
        canvas.addEventListener('mousedown', e => {
            if(!isRunning) return;
            let rect = canvas.getBoundingClientRect();
            let mx = e.clientX - rect.left - offsetX;
            let my = e.clientY - rect.top - offsetY;
            
            let gx = Math.floor(mx / GRID_SIZE);
            let gy = Math.floor(my / GRID_SIZE);
            
            if (gx >= 0 && gx < cols && gy >= 0 && gy < rows) {
                if (grid[gx][gy] === 0) { // empty
                    if (money >= 50) {
                        money -= 50;
                        grid[gx][gy] = 2;
                        turrets.push({
                            gx: gx, gy: gy,
                            x: gx * GRID_SIZE + GRID_SIZE/2,
                            y: gy * GRID_SIZE + GRID_SIZE/2,
                            angle: 0,
                            cooldown: 0,
                            range: 120,
                            damage: 5
                        });
                    }
                }
            }
        });

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            money = 100; lives = 10; wave = 1; frame = 0;
            enemiesSpawned = 0; enemiesToSpawn = 10; waveDelay = 120;
            turrets = []; enemies = []; particles = [];
            
            initLevel();
            
            isRunning = true;
            loop();
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
