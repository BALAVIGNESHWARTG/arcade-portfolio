<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Swarm: Survivor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;1,900&display=swap');

        :root {
            --bg: #050010;
            --player: #00f3ff;
            --enemy-chaser: #ff00ff;
            --enemy-tank: #ff2a2a;
            --enemy-swarm: #bd00ff;
            --gem: #39ff14;
            --bullet: #ffff00;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0; padding: 0; background-color: #000; color: #fff;
            font-family: 'Exo 2', sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        #game-container {
            position: relative; width: 100%; height: 100%; max-width: 800px; max-height: 600px;
            background-color: var(--bg);
            border: 2px solid var(--player);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            overflow: hidden;
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 5; }

        .hud {
            position: absolute; top: 10px; left: 15px; right: 15px; display: flex; justify-content: space-between;
            font-size: 20px; font-weight: 700; z-index: 15; pointer-events: none;
            text-shadow: 2px 2px 0px #000;
        }

        /* XP Bar */
        #xp-bar-container {
            position: absolute; top: 40px; left: 15px; right: 15px; height: 10px;
            background: rgba(255,255,255,0.1); border: 1px solid var(--gem); border-radius: 5px;
            z-index: 15; pointer-events: none;
        }
        #xp-bar-fill {
            height: 100%; width: 0%; background: var(--gem); box-shadow: 0 0 10px var(--gem);
            border-radius: 4px; transition: width 0.2s;
        }

        /* Modals */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(5, 0, 16, 0.95); border: 2px solid var(--enemy-chaser); padding: 30px;
            text-align: center; box-shadow: 0 0 40px rgba(255, 0, 255, 0.3); z-index: 30;
            border-radius: 10px; pointer-events: auto; width: 85%; max-width: 450px;
        }
        h1 { color: var(--player); margin-top: 0; font-size: 36px; text-transform: uppercase; font-style: italic; }
        p { color: #ccc; line-height: 1.5; font-size: 16px; margin-bottom: 25px; }
        button {
            background: transparent; color: var(--player); border: 2px solid var(--player);
            padding: 15px 30px; font-family: 'Exo 2', sans-serif; font-size: 20px; font-weight: 900;
            cursor: pointer; transition: 0.2s; border-radius: 5px; text-transform: uppercase;
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2);
        }
        button:hover { background: var(--player); color: #000; box-shadow: 0 0 20px var(--player); }
        .hidden { display: none !important; }

        /* Level Up Popup */
        #level-up-popup {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 40px; color: var(--gem); font-style: italic; font-weight: 900;
            text-shadow: 0 0 20px var(--gem), 2px 2px 0 #000;
            opacity: 0; pointer-events: none; z-index: 25; transition: all 0.5s;
        }

        /* Joystick */
        #joystick-area {
            position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px;
            border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.2); pointer-events: auto;
            z-index: 20; display: none; background: rgba(0,0,0,0.3);
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: rgba(0, 243, 255, 0.5); border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5);
        }
        @media (hover: none) and (pointer: coarse) {
            #joystick-area { display: block; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="hud">
            <div id="scoreEl">LVL: 1</div>
            <div id="timeEl">00:00</div>
            <div id="hpEl" style="color:var(--enemy-tank);">HP: 100</div>
        </div>
        <div id="xp-bar-container"><div id="xp-bar-fill"></div></div>
        
        <div id="level-up-popup">LEVEL UP!</div>

        <div id="joystick-area">
            <div id="joystick-knob"></div>
        </div>

        <div id="start-screen" class="modal">
            <h1>NEON SWARM</h1>
            <p>SURVIVE THE HORDE.<br>COLLECT GEMS TO UPGRADE.<br><br>WASD/Arrows or Virtual Joystick to Move. Auto-firing.</p>
            <button id="start-btn">ENGAGE</button>
        </div>
        
        <div id="game-over-screen" class="modal hidden">
            <h1 style="color:var(--enemy-tank);">ASSIMILATED</h1>
            <p id="final-stats">SURVIVED: 00:00<br>LEVEL REACHED: 1</p>
            <button id="restart-btn" style="border-color:var(--enemy-tank); color:var(--enemy-tank);">REBOOT</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        let width, height;
        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width; canvas.height = height;
        }
        window.addEventListener('resize', resize); resize();

        const WORLD_SIZE = 2500;
        let isRunning = false;
        let time = 0; let hp = 100;
        let level = 1; let xp = 0; let xpNeeded = 10;
        let frameCount = 0;
        let screenShake = 0;

        // Player
        let player = {
            x: WORLD_SIZE/2, y: WORLD_SIZE/2, radius: 15, speed: 5,
            fireRate: 30, // frames between shots
            fireTimer: 0,
            weaponLevel: 1 // 1: single, 2: double, 3: triple, 4: quad, 5+: fast rate
        };

        let keys = { w: false, a: false, s: false, d: false };
        let joystick = { x: 0, y: 0, active: false };

        let camera = { x: 0, y: 0 };
        let enemies = [];
        let bullets = [];
        let gems = [];
        let particles = [];
        let splatters = []; // Persistent floor marks

        // Enemy Types
        const ENEMY_TYPES = [
            { name: 'swarm', hp: 2, speed: 2, radius: 10, color: 'var(--enemy-swarm)', xp: 1 },
            { name: 'chaser', hp: 1, speed: 3.5, radius: 8, color: 'var(--enemy-chaser)', xp: 1 },
            { name: 'tank', hp: 15, speed: 1, radius: 20, color: 'var(--enemy-tank)', xp: 5 }
        ];

        function spawnEnemy() {
            let angle = Math.random() * Math.PI * 2;
            let dist = Math.max(width, height) / 1.5 + 50; // Spawn outside camera view
            let sx = player.x + Math.cos(angle) * dist;
            let sy = player.y + Math.sin(angle) * dist;
            
            // Keep in bounds
            sx = Math.max(0, Math.min(WORLD_SIZE, sx));
            sy = Math.max(0, Math.min(WORLD_SIZE, sy));

            // Determine type based on time
            let typeIdx = 0;
            let r = Math.random();
            if (time > 30 && r > 0.7) typeIdx = 1; // Chaser
            if (time > 60 && r > 0.9) typeIdx = 2; // Tank

            let type = ENEMY_TYPES[typeIdx];
            // Scale HP with time
            let hpScale = 1 + Math.floor(time / 60) * 0.5;

            enemies.push({
                type: type,
                x: sx, y: sy,
                hp: type.hp * hpScale, maxHp: type.hp * hpScale,
                vx: 0, vy: 0,
                radius: type.radius, color: type.color
            });
        }

        function createParticles(x, y, color, count, isExplosion) {
            for(let i=0; i<count; i++) {
                let speed = isExplosion ? Math.random()*8 : Math.random()*4;
                let angle = Math.random() * Math.PI * 2;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    life: isExplosion ? 30 : 20, maxLife: isExplosion ? 30 : 20,
                    color: color
                });
            }
        }

        function levelUp() {
            level++;
            xp -= xpNeeded;
            xpNeeded = Math.floor(xpNeeded * 1.5);
            player.weaponLevel++;
            
            // Cap weapon level spread, start reducing fire rate
            if (player.weaponLevel > 4) {
                player.fireRate = Math.max(5, player.fireRate - 3);
            }

            document.getElementById('scoreEl').textContent = `LVL: ${level}`;
            document.getElementById('xp-bar-fill').style.width = `${(xp/xpNeeded)*100}%`;

            let popup = document.getElementById('level-up-popup');
            popup.style.transition = 'none';
            popup.style.opacity = '1';
            popup.style.top = '35%';
            screenShake = 10;
            
            // Blast wave clears nearby enemies
            enemies.forEach(e => {
                if (Math.hypot(e.x - player.x, e.y - player.y) < 300) {
                    e.hp -= 20; // Massive damage
                }
            });
            
            createParticles(player.x, player.y, 'var(--gem)', 50, true);

            setTimeout(() => {
                popup.style.transition = 'all 1s ease-in';
                popup.style.opacity = '0';
                popup.style.top = '25%';
            }, 1000);
        }

        function getNearestEnemy() {
            let nearest = null; let minDist = 600; // range limit
            enemies.forEach(e => {
                let d = Math.hypot(e.x - player.x, e.y - player.y);
                if (d < minDist) { minDist = d; nearest = e; }
            });
            return nearest;
        }

        function fireWeapon() {
            let target = getNearestEnemy();
            if (!target) return;

            let angle = Math.atan2(target.y - player.y, target.x - player.x);
            let speed = 15;

            function addBullet(a) {
                bullets.push({
                    x: player.x, y: player.y,
                    vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
                    life: 60
                });
            }

            screenShake = 3;

            if (player.weaponLevel === 1) {
                addBullet(angle);
            } else if (player.weaponLevel === 2) {
                addBullet(angle - 0.1); addBullet(angle + 0.1);
            } else if (player.weaponLevel === 3) {
                addBullet(angle - 0.2); addBullet(angle); addBullet(angle + 0.2);
            } else {
                // 4 or more
                addBullet(angle - 0.3); addBullet(angle - 0.1); 
                addBullet(angle + 0.1); addBullet(angle + 0.3);
            }
        }

        function update() {
            frameCount++;
            if (frameCount % 60 === 0) {
                time++;
                let m = Math.floor(time / 60).toString().padStart(2, '0');
                let s = (time % 60).toString().padStart(2, '0');
                document.getElementById('timeEl').textContent = `${m}:${s}`;
            }

            if (screenShake > 0) screenShake *= 0.8;
            if (screenShake < 0.5) screenShake = 0;

            // Spawning (faster over time)
            let spawnRate = Math.max(5, 40 - Math.floor(time / 10));
            if (frameCount % spawnRate === 0) spawnEnemy();

            // Player Movement
            let dx = 0, dy = 0;
            if (keys.w) dy -= 1; if (keys.s) dy += 1;
            if (keys.a) dx -= 1; if (keys.d) dx += 1;
            
            if (joystick.active) { dx = joystick.x; dy = joystick.y; }

            if (dx !== 0 || dy !== 0) {
                let mag = Math.hypot(dx, dy);
                player.x += (dx/mag) * player.speed;
                player.y += (dy/mag) * player.speed;
            }

            player.x = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.y));

            // Camera follow
            camera.x = player.x - width/2;
            camera.y = player.y - height/2;

            // Auto Fire
            player.fireTimer++;
            if (player.fireTimer >= player.fireRate) {
                player.fireTimer = 0;
                fireWeapon();
            }

            // Bullets
            for(let i=bullets.length-1; i>=0; i--) {
                let b = bullets[i];
                b.x += b.vx; b.y += b.vy; b.life--;
                
                // Collision with enemies
                let hit = false;
                for(let j=0; j<enemies.length; j++) {
                    let e = enemies[j];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + 5) {
                        e.hp -= 1;
                        hit = true;
                        createParticles(b.x, b.y, 'var(--bullet)', 3, false);
                        break;
                    }
                }

                if (hit || b.life <= 0) bullets.splice(i, 1);
            }

            // Enemies
            for(let i=enemies.length-1; i>=0; i--) {
                let e = enemies[i];
                if (e.hp <= 0) {
                    // Death
                    createParticles(e.x, e.y, e.color, 15, true);
                    splatters.push({x: e.x, y: e.y, r: e.radius, c: e.color});
                    if(splatters.length > 200) splatters.shift();
                    
                    // Drop Gem
                    gems.push({x: e.x, y: e.y, val: e.type.xp, life: 1800}); // 30 sec life
                    
                    enemies.splice(i, 1);
                    continue;
                }

                // AI (Move towards player, simple separation)
                let a = Math.atan2(player.y - e.y, player.x - e.x);
                let ax = Math.cos(a); let ay = Math.sin(a);

                // Separation from other enemies (optimized, only check 10 random or nearby)
                // To keep 60fps, we don't do O(N^2) fully. We do random sampling.
                for(let k=0; k<3; k++) {
                    let other = enemies[Math.floor(Math.random()*enemies.length)];
                    if (other && other !== e) {
                        let d = Math.hypot(e.x - other.x, e.y - other.y);
                        if (d < e.radius + other.radius + 5) {
                            ax -= (other.x - e.x) / d;
                            ay -= (other.y - e.y) / d;
                        }
                    }
                }

                let mag = Math.hypot(ax, ay);
                if(mag > 0) {
                    e.vx = (ax/mag) * e.type.speed;
                    e.vy = (ay/mag) * e.type.speed;
                }
                
                e.x += e.vx; e.y += e.vy;

                // Hit Player
                if (Math.hypot(e.x - player.x, e.y - player.y) < player.radius + e.radius) {
                    hp -= (e.type.name === 'tank' ? 2 : 0.5); // Damage over time
                    if (frameCount % 10 === 0) {
                        screenShake = 5;
                        document.getElementById('hpEl').textContent = `HP: ${Math.max(0, Math.floor(hp))}`;
                    }
                }
            }

            if (hp <= 0) gameOver();

            // Gems
            let pickupRadius = 80;
            for(let i=gems.length-1; i>=0; i--) {
                let g = gems[i];
                let d = Math.hypot(g.x - player.x, g.y - player.y);
                
                if (d < pickupRadius) {
                    // Magnetize towards player
                    let a = Math.atan2(player.y - g.y, player.x - g.x);
                    g.x += Math.cos(a) * 8;
                    g.y += Math.sin(a) * 8;
                    
                    if (d < player.radius + 5) {
                        xp += g.val;
                        document.getElementById('xp-bar-fill').style.width = `${Math.min(100, (xp/xpNeeded)*100)}%`;
                        if (xp >= xpNeeded) levelUp();
                        gems.splice(i, 1);
                        continue;
                    }
                } else {
                    g.life--;
                    if (g.life <= 0) gems.splice(i, 1);
                }
            }

            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life--;
                if(p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            ctx.save();
            // Screen shake
            if (screenShake > 0) {
                ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
            }
            
            // Camera
            ctx.translate(-camera.x, -camera.y);

            // World bounds (optional grid drawing)
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            // Draw grid lines only within camera view for perf
            let startX = Math.floor(camera.x / 100) * 100;
            let startY = Math.floor(camera.y / 100) * 100;
            ctx.beginPath();
            for(let x = startX; x < camera.x + width; x+=100) { if(x>0 && x<WORLD_SIZE) { ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); } }
            for(let y = startY; y < camera.y + height; y+=100) { if(y>0 && y<WORLD_SIZE) { ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); } }
            ctx.stroke();

            // Border
            ctx.strokeStyle = 'var(--player)'; ctx.lineWidth = 5;
            ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

            // Splatters
            splatters.forEach(s => {
                ctx.fillStyle = s.c;
                ctx.globalAlpha = 0.2;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r*1.5, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Gems
            gems.forEach(g => {
                ctx.fillStyle = 'var(--gem)';
                ctx.globalAlpha = g.life < 180 ? (g.life % 10 > 5 ? 1 : 0.2) : 1; // flicker before expire
                ctx.beginPath();
                ctx.moveTo(g.x, g.y - 6);
                ctx.lineTo(g.x + 5, g.y);
                ctx.lineTo(g.x, g.y + 6);
                ctx.lineTo(g.x - 5, g.y);
                ctx.closePath();
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillRect(p.x-2, p.y-2, 4, 4);
            });
            ctx.globalAlpha = 1;

            // Bullets
            ctx.fillStyle = 'var(--bullet)';
            bullets.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
            });

            // Enemies
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2); ctx.fill();
                
                // Inner design based on type
                ctx.fillStyle = '#000';
                if (e.type.name === 'chaser') {
                    ctx.beginPath(); ctx.moveTo(e.x, e.y-e.radius); ctx.lineTo(e.x+e.radius, e.y); ctx.lineTo(e.x, e.y+e.radius); ctx.lineTo(e.x-e.radius, e.y); ctx.fill();
                } else if (e.type.name === 'tank') {
                    ctx.fillRect(e.x - e.radius*0.6, e.y - e.radius*0.6, e.radius*1.2, e.radius*1.2);
                } else {
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius*0.5, 0, Math.PI*2); ctx.fill();
                }
            });

            // Player
            ctx.fillStyle = 'var(--player)';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fill();
            
            // Player Core (Spinning)
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(frameCount * 0.1);
            ctx.fillStyle = '#fff';
            ctx.fillRect(-player.radius*0.4, -player.radius*0.4, player.radius*0.8, player.radius*0.8);
            ctx.restore();

            // Player pickup radius ring (faint)
            ctx.strokeStyle = 'var(--gem)';
            ctx.globalAlpha = 0.1;
            ctx.beginPath(); ctx.arc(player.x, player.y, 80, 0, Math.PI*2); ctx.stroke();
            ctx.globalAlpha = 1;

            ctx.restore();
        }

        function loop() {
            if(!isRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Input Setup
        window.addEventListener('keydown', e => {
            if(['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = true;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = false;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
        });

        // Joystick logic
        const joyArea = document.getElementById('joystick-area');
        const joyKnob = document.getElementById('joystick-knob');
        
        function handleJoy(e) {
            e.preventDefault();
            let touch = e.touches[0];
            let rect = joyArea.getBoundingClientRect();
            let cx = rect.left + rect.width/2;
            let cy = rect.top + rect.height/2;
            let dx = touch.clientX - cx;
            let dy = touch.clientY - cy;
            let dist = Math.hypot(dx, dy);
            let maxDist = rect.width/2 - 25; // knob boundary
            
            if (dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
            
            joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joystick.x = dx / maxDist; joystick.y = dy / maxDist;
            joystick.active = true;
        }

        joyArea.addEventListener('touchstart', handleJoy, {passive:false});
        joyArea.addEventListener('touchmove', handleJoy, {passive:false});
        joyArea.addEventListener('touchend', () => {
            joyKnob.style.transform = 'translate(-50%, -50%)';
            joystick.active = false; joystick.x = 0; joystick.y = 0;
        });

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            hp = 100; time = 0; level = 1; xp = 0; xpNeeded = 10;
            player.x = WORLD_SIZE/2; player.y = WORLD_SIZE/2;
            player.weaponLevel = 1; player.fireRate = 30;
            enemies = []; bullets = []; gems = []; particles = []; splatters = [];
            
            document.getElementById('scoreEl').textContent = `LVL: 1`;
            document.getElementById('hpEl').textContent = `HP: 100`;
            document.getElementById('timeEl').textContent = `00:00`;
            document.getElementById('xp-bar-fill').style.width = `0%`;
            
            isRunning = true;
            loop();
        }

        function gameOver() {
            isRunning = false;
            let m = Math.floor(time / 60).toString().padStart(2, '0');
            let s = (time % 60).toString().padStart(2, '0');
            document.getElementById('final-stats').innerHTML = `SURVIVED: ${m}:${s}<br>LEVEL REACHED: ${level}`;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
