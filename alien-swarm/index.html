<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Alien Swarm</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #03000a;
            --player-color: #00f3ff;
            --bullet-color: #39ff14;
            --enemy-color: #ff00ff;
            --text-color: #fff;
            --ui-bg: rgba(0, 0, 0, 0.85);
            --border-color: #ff00ff;
        }

        * { box-sizing: border-box; touch-action: none; }
        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Press Start 2P', monospace; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        #game-container {
            position: relative; border: 2px solid var(--border-color);
            box-shadow: 0 0 20px var(--border-color);
            background-color: var(--bg-color);
        }
        canvas { display: block; }

        #ui-layer {
            position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;
            display:flex; flex-direction:column; justify-content:space-between; padding:15px;
        }
        .hud { display: flex; justify-content: space-between; text-shadow: 0 0 5px var(--text-color); font-size: 14px; z-index: 10; }

        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: var(--ui-bg); border: 2px solid var(--border-color); padding: 30px;
            text-align: center; pointer-events: auto; box-shadow: 0 0 30px rgba(255,0,255,0.3); z-index: 20; width: 80%; max-width: 450px;
        }
        h1 { color: var(--enemy-color); text-shadow: 0 0 10px var(--enemy-color); margin-bottom: 20px; font-size: 20px; line-height: 1.5; }
        p { margin-bottom: 20px; font-size: 10px; color: #ccc; line-height: 1.6; }
        button {
            background: transparent; color: var(--player-color); border: 2px solid var(--player-color);
            padding: 12px 24px; font-family: 'Press Start 2P', monospace; font-size: 14px; cursor: pointer;
            text-shadow: 0 0 10px var(--player-color); box-shadow: 0 0 10px var(--player-color); transition: all 0.2s; text-transform: uppercase;
        }
        button:hover { background: var(--player-color); color: #000; box-shadow: 0 0 30px var(--player-color); }
        .hidden { display: none !important; }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px; pointer-events: none; z-index: 100; opacity: 0.5;
        }
        
        #joystick-area {
            position: absolute; bottom: 20px; left: 20px; width: 100px; height: 100px;
            border-radius: 50%; border: 2px solid rgba(0, 243, 255, 0.3); pointer-events: auto;
            display: none;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
            background: rgba(0, 243, 255, 0.5); border-radius: 50%; transform: translate(-50%, -50%);
        }
        @media (hover: none) and (pointer: coarse) {
            #joystick-area { display: block; }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-layer">
            <div class="hud">
                <span id="scoreEl">SCORE: 0</span>
                <span id="healthEl">HP: 100</span>
                <span id="timeEl">TIME: 0s</span>
            </div>
            <div id="joystick-area">
                <div id="joystick-knob"></div>
            </div>
        </div>
        <div id="start-screen" class="modal">
            <h1>NEON SWARM</h1>
            <p>SURVIVE THE BIOMECHANICAL HORDE.<br><br>WASD / VIRTUAL JOYSTICK TO MOVE. WEAPONS AUTO-TARGET THE NEAREST THREAT.</p>
            <button id="start-btn">ENGAGE</button>
        </div>
        <div id="game-over-screen" class="modal hidden">
            <h1 style="color: #ff0044; text-shadow: 0 0 10px #ff0044;">ASSIMILATED</h1>
            <p id="final-score">FINAL SCORE: 0</p>
            <button id="restart-btn">REBOOT SEQUENCE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('game-container');
        
        let isGameRunning = false;
        let score = 0, hp = 100, time = 0;
        let lastTime = Date.now();
        let fireTimer = 0;
        let spawnRate = 1000;
        let lastSpawn = Date.now();

        // Player
        let player = { x: 400, y: 300, radius: 12, speed: 4, color: 'var(--player-color)' };
        
        // Input
        let keys = { w: false, a: false, s: false, d: false };
        let joystick = { x: 0, y: 0, active: false };

        // Entities
        let enemies = [];
        let bullets = [];
        let particles = [];
        let grid = [];

        // Setup
        function resize() {
            const ratio = 800/600;
            const h = Math.min(window.innerHeight - 80, 600);
            const w = Math.min(window.innerWidth - 20, h * ratio);
            canvas.style.width = `${w}px`;
            canvas.style.height = `${w}px / ${ratio}`;
            gameContainer.style.width = `${w}px`;
            gameContainer.style.height = `${w}px / ${ratio}`;
        }
        window.addEventListener('resize', resize); resize();

        // Background Grid
        for(let i=0; i<800; i+=40) {
            for(let j=0; j<600; j+=40) {
                grid.push({x: i, y: j});
            }
        }

        function spawnEnemy() {
            let side = Math.floor(Math.random() * 4);
            let x, y;
            if (side === 0) { x = Math.random()*canvas.width; y = -20; }
            else if (side === 1) { x = canvas.width+20; y = Math.random()*canvas.height; }
            else if (side === 2) { x = Math.random()*canvas.width; y = canvas.height+20; }
            else { x = -20; y = Math.random()*canvas.height; }
            
            enemies.push({
                x, y, vx: 0, vy: 0, radius: 10,
                speed: 1.5 + Math.random() * (time/60), // Speed up over time
                hp: 1 + Math.floor(time/30),
                color: 'var(--enemy-color)'
            });
        }

        function createParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
                    life: 1, color
                });
            }
        }

        function getNearestEnemy() {
            let nearest = null;
            let minDist = Infinity;
            enemies.forEach(e => {
                let d = Math.hypot(e.x - player.x, e.y - player.y);
                if (d < minDist) { minDist = d; nearest = e; }
            });
            return nearest;
        }

        function update() {
            let now = Date.now();
            let dt = (now - lastTime) / 1000;
            lastTime = now;
            
            // Movement logic
            let dx = 0, dy = 0;
            if (keys.w) dy -= 1; if (keys.s) dy += 1;
            if (keys.a) dx -= 1; if (keys.d) dx += 1;
            
            if (joystick.active) {
                dx = joystick.x; dy = joystick.y;
            }

            if (dx !== 0 || dy !== 0) {
                let mag = Math.hypot(dx, dy);
                player.x += (dx/mag) * player.speed;
                player.y += (dy/mag) * player.speed;
                
                // Trail
                if(Math.random() < 0.3) {
                    particles.push({x: player.x, y: player.y, vx: 0, vy: 0, life: 0.5, color: player.color});
                }
            }
            
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // Auto Fire
            fireTimer += dt;
            if (fireTimer > 0.15) {
                fireTimer = 0;
                let target = getNearestEnemy();
                if (target) {
                    let angle = Math.atan2(target.y - player.y, target.x - player.x);
                    bullets.push({
                        x: player.x, y: player.y,
                        vx: Math.cos(angle) * 15, vy: Math.sin(angle) * 15,
                        life: 2, color: 'var(--bullet-color)'
                    });
                }
            }

            // Update Bullets
            bullets.forEach((b, i) => {
                b.x += b.vx; b.y += b.vy;
                b.life -= dt;
                if (b.life <= 0) bullets.splice(i, 1);
            });

            // Update Enemies (Flocking AI)
            enemies.forEach((e, i) => {
                let tx = player.x - e.x;
                let ty = player.y - e.y;
                let distToPlayer = Math.hypot(tx, ty);
                
                // Towards player
                let ax = (tx / distToPlayer);
                let ay = (ty / distToPlayer);

                // Repulsion from other enemies (Separation)
                let rx = 0, ry = 0;
                let neighbors = 0;
                enemies.forEach((other, j) => {
                    if (i !== j) {
                        let d = Math.hypot(e.x - other.x, e.y - other.y);
                        if (d < 25) {
                            rx -= (other.x - e.x) / d;
                            ry -= (other.y - e.y) / d;
                            neighbors++;
                        }
                    }
                });
                if (neighbors > 0) { ax += rx * 1.5; ay += ry * 1.5; }

                // Normalize direction and apply speed
                let mag = Math.hypot(ax, ay);
                if (mag > 0) {
                    e.vx = (ax / mag) * e.speed;
                    e.vy = (ay / mag) * e.speed;
                }

                e.x += e.vx; e.y += e.vy;

                // Collision with player
                if (distToPlayer < player.radius + e.radius) {
                    hp -= 10;
                    document.getElementById('healthEl').textContent = `HP: ${Math.max(0, hp)}`;
                    createParticles(player.x, player.y, 'var(--enemy-color)', 5);
                    e.hp = 0; // Destroy enemy on hit
                }

                // Trail
                if(Math.random() < 0.1) {
                    particles.push({x: e.x, y: e.y, vx: 0, vy: 0, life: 0.3, color: e.color});
                }
            });

            // Bullet - Enemy Collision
            bullets.forEach((b, bIdx) => {
                enemies.forEach((e, eIdx) => {
                    if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + 3) {
                        e.hp -= 1;
                        bullets.splice(bIdx, 1);
                        createParticles(b.x, b.y, b.color, 3);
                        if (e.hp <= 0) {
                            createParticles(e.x, e.y, e.color, 10);
                            score += 10;
                            document.getElementById('scoreEl').textContent = `SCORE: ${score}`;
                        }
                    }
                });
            });

            // Clean dead enemies
            enemies = enemies.filter(e => e.hp > 0);

            // Particles
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                p.life -= dt * 2;
                if(p.life <= 0) particles.splice(i, 1);
            });

            // Spawning
            if (now - lastSpawn > spawnRate) {
                lastSpawn = now;
                spawnEnemy();
                spawnRate = Math.max(200, spawnRate - 10); // Ramp up difficulty
            }

            // Time tracking
            time += dt;
            if (Math.floor(time) % 1 === 0) {
                document.getElementById('timeEl').textContent = `TIME: ${Math.floor(time)}s`;
            }

            if (hp <= 0) gameOver();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Grid
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
            ctx.beginPath();
            for(let i=0; i<=canvas.width; i+=40) { ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); }
            for(let j=0; j<=canvas.height; j+=40) { ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); }
            ctx.stroke();

            ctx.globalCompositeOperation = 'lighter';

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.shadowBlur = 5; ctx.shadowColor = p.color;
                ctx.fillRect(p.x, p.y, 3, 3);
            });
            ctx.globalAlpha = 1;

            // Bullets
            bullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 10; ctx.shadowColor = b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI*2); ctx.fill();
            });

            // Enemies
            enemies.forEach(e => {
                ctx.strokeStyle = e.color;
                ctx.fillStyle = '#000';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 15; ctx.shadowColor = e.color;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
                ctx.fill(); ctx.stroke();
                
                // Enemy Core
                ctx.fillStyle = e.color;
                ctx.beginPath(); ctx.arc(e.x, e.y, e.radius*0.4, 0, Math.PI*2); ctx.fill();
            });

            // Player
            ctx.strokeStyle = player.color;
            ctx.fillStyle = '#000';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 20; ctx.shadowColor = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fill(); ctx.stroke();
            
            // Player Core
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius*0.3, 0, Math.PI*2); ctx.fill();

            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 0;
        }

        function loop() {
            if(!isGameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = true;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = true;
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = false;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = false;
        });

        // Joystick logic
        const joyArea = document.getElementById('joystick-area');
        const joyKnob = document.getElementById('joystick-knob');
        
        function handleJoy(e) {
            e.preventDefault();
            let touch = e.touches[0];
            let rect = joyArea.getBoundingClientRect();
            let cx = rect.left + rect.width/2;
            let cy = rect.top + rect.height/2;
            let dx = touch.clientX - cx;
            let dy = touch.clientY - cy;
            let dist = Math.hypot(dx, dy);
            let maxDist = rect.width/2;
            
            if (dist > maxDist) {
                dx = (dx/dist) * maxDist;
                dy = (dy/dist) * maxDist;
            }
            
            joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joystick.x = dx / maxDist;
            joystick.y = dy / maxDist;
            joystick.active = true;
        }

        joyArea.addEventListener('touchstart', handleJoy, {passive:false});
        joyArea.addEventListener('touchmove', handleJoy, {passive:false});
        joyArea.addEventListener('touchend', () => {
            joyKnob.style.transform = 'translate(-50%, -50%)';
            joystick.active = false;
        });

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            score = 0; hp = 100; time = 0; fireTimer = 0; spawnRate = 1000;
            player.x = canvas.width/2; player.y = canvas.height/2;
            enemies = []; bullets = []; particles = [];
            
            document.getElementById('scoreEl').textContent = `SCORE: 0`;
            document.getElementById('healthEl').textContent = `HP: 100`;
            document.getElementById('timeEl').textContent = `TIME: 0s`;
            
            isGameRunning = true;
            lastTime = Date.now();
            lastSpawn = Date.now();
            loop();
        }

        function gameOver() {
            isGameRunning = false;
            document.getElementById('final-score').textContent = `SURVIVED: ${Math.floor(time)}s | SCORE: ${score}`;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
