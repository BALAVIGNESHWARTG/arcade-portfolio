<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grid Bomber</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --bg-color: #1a1a1a;
            --wall-color: #333;
            --crate-color: #8b4513;
            --floor-color: #2a2a2a;
            --player-color: #fff;
            --bomb-color: #222;
            --fire-core: #fff;
            --fire-edge: #ff4500;
            --enemy-color: #ff003c;
            --ui-text: #ff8c00;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0; padding: 0; background-color: #000; color: var(--ui-text);
            font-family: 'Share Tech Mono', monospace; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        #game-container {
            position: relative; width: 100%; height: 100%; max-width: 650px; max-height: 650px;
            background-color: var(--floor-color);
            border: 8px solid var(--wall-color);
            box-shadow: 0 0 30px rgba(255,140,0,0.2);
            image-rendering: pixelated;
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        .hud {
            position: absolute; top: -40px; left: 0; width: 100%; display: flex; justify-content: space-between;
            font-size: 20px; font-weight: bold; text-shadow: 0 0 5px var(--ui-text); z-index: 10;
        }

        /* Modals */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); border: 4px solid var(--ui-text); padding: 30px;
            text-align: center; box-shadow: 0 0 20px rgba(255,140,0,0.5); z-index: 30;
            border-radius: 5px; pointer-events: auto; width: 80%; max-width: 400px;
        }
        h1 { color: var(--ui-text); margin-top: 0; font-size: 30px; text-transform: uppercase; }
        p { color: #ccc; line-height: 1.5; font-size: 14px; margin-bottom: 20px; }
        button {
            background: transparent; color: var(--ui-text); border: 2px solid var(--ui-text);
            padding: 15px 30px; font-family: 'Share Tech Mono', monospace; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }
        button:hover { background: var(--ui-text); color: #000; }
        .hidden { display: none !important; }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute; bottom: -80px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; z-index: 20; display: none;
        }
        .dpad { display: grid; grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px 50px; gap: 5px; pointer-events: auto; }
        .touch-btn {
            background: rgba(255,140,0,0.2); border: 2px solid rgba(255,140,0,0.5); border-radius: 5px;
            display: flex; align-items: center; justify-content: center; color: var(--ui-text); font-weight: bold; font-size: 20px;
        }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
        
        .action-btn { width: 80px; height: 80px; border-radius: 50%; pointer-events: auto; margin-top: 35px; }

        @media (hover: none) and (pointer: coarse) {
            #mobile-controls { display: flex; }
            #game-container { transform: translateY(-40px); } /* shift up to make room */
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="hud">
            <span id="scoreEl">SCORE: 0</span>
            <span id="levelEl">LEVEL: 1</span>
        </div>
        <canvas id="gameCanvas" width="650" height="650"></canvas>
        
        <div id="mobile-controls">
            <div class="dpad">
                <div class="touch-btn btn-up" id="btn-up">W</div>
                <div class="touch-btn btn-left" id="btn-left">A</div>
                <div class="touch-btn btn-right" id="btn-right">D</div>
                <div class="touch-btn btn-down" id="btn-down">S</div>
            </div>
            <div>
                <div class="touch-btn action-btn" id="btn-bomb">BOMB</div>
            </div>
        </div>

        <div id="start-screen" class="modal">
            <h1>GRID BOMBER</h1>
            <p>TACTICAL DEMOLITION.<br><br>WASD/Arrows to Move.<br>SPACE to place Bombs.<br>Destroy crates. Eliminate threats.<br>Don't blow yourself up.</p>
            <button id="start-btn">DEPLOY</button>
        </div>
        
        <div id="game-over-screen" class="modal hidden">
            <h1 style="color:var(--enemy-color);">K.I.A.</h1>
            <p id="final-stats">SCORE: 0</p>
            <button id="restart-btn" style="color:var(--enemy-color); border-color:var(--enemy-color);">REDEPLOY</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        let width = 650; let height = 650;
        function resize() {
            const ratio = 1;
            const ch = Math.min(window.innerHeight - (window.matchMedia("(hover: none)").matches ? 150 : 60), 650);
            const cw = Math.min(window.innerWidth - 20, ch * ratio);
            canvas.style.width = `${cw}px`;
            canvas.style.height = `${cw}px / ${ratio}`;
            container.style.width = `${cw}px`;
            container.style.height = `${cw}px / ${ratio}`;
        }
        window.addEventListener('resize', resize); resize();

        // Game Config
        const TILE_SIZE = 50; // 13x13 grid
        const COLS = 13; const ROWS = 13;
        
        let isRunning = false;
        let frameCount = 0;
        let score = 0; let level = 1;
        let screenShake = 0;

        // Grid (0: empty, 1: wall, 2: crate)
        let grid = [];
        
        // Player
        let player = {
            r: 0, c: 0, x: 0, y: 0, speed: 3, 
            bombMax: 1, bombsActive: 0, blastRadius: 1, dead: false,
            movingDir: null // {r, c}
        };

        let keys = { w: false, a: false, s: false, d: false, space: false };
        let touchKeys = { w: false, a: false, s: false, d: false, bomb: false };

        let bombs = [];
        let explosions = [];
        let powerups = [];
        let enemies = [];
        let particles = [];
        let exitDoor = null;

        function buildLevel() {
            grid = []; bombs = []; explosions = []; powerups = []; enemies = []; particles = [];
            
            // Initialize Grid
            for(let r=0; r<ROWS; r++) {
                grid[r] = [];
                for(let c=0; c<COLS; c++) {
                    if (r % 2 !== 0 && c % 2 !== 0) {
                        grid[r][c] = 1; // Solid Wall
                    } else {
                        // Safe zone top left
                        if ((r === 0 && c === 0) || (r === 0 && c === 1) || (r === 1 && c === 0)) {
                            grid[r][c] = 0;
                        } else {
                            grid[r][c] = Math.random() < 0.6 ? 2 : 0; // Crate
                        }
                    }
                }
            }

            player.r = 0; player.c = 0; player.x = 0; player.y = 0; player.movingDir = null; player.dead = false;

            // Spawn Enemies
            let numEnemies = 2 + level;
            for(let i=0; i<numEnemies; i++) {
                let er, ec;
                do {
                    er = Math.floor(Math.random() * ROWS);
                    ec = Math.floor(Math.random() * COLS);
                } while (grid[er][ec] !== 0 || (er < 3 && ec < 3));
                
                enemies.push({ r: er, c: ec, x: ec*TILE_SIZE, y: er*TILE_SIZE, speed: 1.5, dir: {r:0, c:0}, dead: false });
            }

            // Hide Exit door under a random crate
            let crates = [];
            for(let r=0; r<ROWS; r++) {
                for(let c=0; c<COLS; c++) {
                    if (grid[r][c] === 2) crates.push({r, c});
                }
            }
            if(crates.length > 0) {
                let doorCrate = crates[Math.floor(Math.random() * crates.length)];
                exitDoor = { r: doorCrate.r, c: doorCrate.c, revealed: false };
            }
        }

        function placeBomb() {
            if (player.bombsActive >= player.bombMax || player.dead) return;
            
            let br = Math.round(player.y / TILE_SIZE);
            let bc = Math.round(player.x / TILE_SIZE);
            
            // Check if bomb already there
            if (bombs.some(b => b.r === br && b.c === bc)) return;

            bombs.push({ r: br, c: bc, timer: 180, radius: player.blastRadius });
            player.bombsActive++;
        }

        function createExplosionLine(br, bc, radius) {
            let cells = [{r: br, c: bc}];
            
            const dirs = [[-1,0], [1,0], [0,-1], [0,1]];
            for(let d of dirs) {
                for(let i=1; i<=radius; i++) {
                    let nr = br + d[0]*i;
                    let nc = bc + d[1]*i;
                    
                    if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) break;
                    if (grid[nr][nc] === 1) break; // Hit Wall
                    
                    cells.push({r: nr, c: nc});
                    
                    if (grid[nr][nc] === 2) {
                        grid[nr][nc] = 0; // Destroy crate
                        score += 50;
                        
                        // Particle explosion
                        for(let p=0; p<10; p++) {
                            particles.push({
                                x: nc*TILE_SIZE+TILE_SIZE/2, y: nr*TILE_SIZE+TILE_SIZE/2,
                                vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
                                life: 30, color: 'var(--crate-color)'
                            });
                        }

                        // Reveal Door or Drop Powerup
                        if (exitDoor && exitDoor.r === nr && exitDoor.c === nc) {
                            exitDoor.revealed = true;
                        } else if (Math.random() < 0.2) {
                            powerups.push({ r: nr, c: nc, type: Math.random() < 0.5 ? 'bomb' : 'fire' });
                        }
                        
                        break; // Stop explosion line
                    }
                }
            }
            return cells;
        }

        function triggerBomb(b, bIdx) {
            screenShake = 10;
            let cells = createExplosionLine(b.r, b.c, b.radius);
            
            cells.forEach(cell => {
                explosions.push({ r: cell.r, c: cell.c, life: 30 });
                
                // Fire particles
                for(let p=0; p<5; p++) {
                    particles.push({
                        x: cell.c*TILE_SIZE+Math.random()*TILE_SIZE, 
                        y: cell.r*TILE_SIZE+Math.random()*TILE_SIZE,
                        vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4,
                        life: 20, color: 'var(--fire-edge)'
                    });
                }
            });

            player.bombsActive--;
            bombs.splice(bIdx, 1);
            
            document.getElementById('scoreEl').textContent = `SCORE: ${score}`;
        }

        function update() {
            frameCount++;

            // Screen shake
            if (screenShake > 0) screenShake *= 0.8;
            if (screenShake < 0.5) screenShake = 0;

            // Update Bombs
            for(let i=bombs.length-1; i>=0; i--) {
                bombs[i].timer--;
                if(bombs[i].timer <= 0) {
                    triggerBomb(bombs[i], i);
                }
            }

            // Explode chain reactions
            for(let i=bombs.length-1; i>=0; i--) {
                let b = bombs[i];
                if (explosions.some(ex => ex.r === b.r && ex.c === b.c)) {
                    triggerBomb(b, i);
                }
            }

            // Input
            if ((keys.space || touchKeys.bomb) && frameCount % 10 === 0) placeBomb();

            // Player Movement (Grid Snapping)
            if (!player.dead) {
                let targetX = player.c * TILE_SIZE;
                let targetY = player.r * TILE_SIZE;
                
                // Snap if close
                if (Math.abs(player.x - targetX) < player.speed) player.x = targetX;
                if (Math.abs(player.y - targetY) < player.speed) player.y = targetY;

                if (player.x === targetX && player.y === targetY) {
                    // Choose next tile based on input
                    let dr = 0, dc = 0;
                    if (keys.w || touchKeys.w) dr = -1;
                    else if (keys.s || touchKeys.s) dr = 1;
                    else if (keys.a || touchKeys.a) dc = -1;
                    else if (keys.d || touchKeys.d) dc = 1;

                    if (dr !== 0 || dc !== 0) {
                        let nr = player.r + dr; let nc = player.c + dc;
                        // Collision check
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === 0) {
                            // Check if bomb in way
                            if (!bombs.some(b => b.r === nr && b.c === nc)) {
                                player.r = nr; player.c = nc;
                            }
                        }
                    }
                }
                
                // Move towards logical grid position
                targetX = player.c * TILE_SIZE;
                targetY = player.r * TILE_SIZE;
                
                if (player.x < targetX) player.x += player.speed;
                else if (player.x > targetX) player.x -= player.speed;
                
                if (player.y < targetY) player.y += player.speed;
                else if (player.y > targetY) player.y -= player.speed;
            }

            // Enemy Movement
            enemies.forEach(e => {
                if (e.dead) return;
                
                let targetX = e.c * TILE_SIZE;
                let targetY = e.r * TILE_SIZE;
                
                if (Math.abs(e.x - targetX) < e.speed) e.x = targetX;
                if (Math.abs(e.y - targetY) < e.speed) e.y = targetY;

                if (e.x === targetX && e.y === targetY) {
                    // Pick new direction
                    let possibleDirs = [];
                    const dirs = [[-1,0], [1,0], [0,-1], [0,1]];
                    dirs.forEach(d => {
                        let nr = e.r + d[0]; let nc = e.c + d[1];
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === 0 && !bombs.some(b => b.r === nr && b.c === nc)) {
                            possibleDirs.push(d);
                        }
                    });
                    
                    if (possibleDirs.length > 0) {
                        // Prefer continuing in same direction
                        let keepGoing = possibleDirs.find(d => d[0] === e.dir.r && d[1] === e.dir.c);
                        if (keepGoing && Math.random() < 0.7) {
                            e.r += e.dir.r; e.c += e.dir.c;
                        } else {
                            let randomDir = possibleDirs[Math.floor(Math.random() * possibleDirs.length)];
                            e.dir = {r: randomDir[0], c: randomDir[1]};
                            e.r += e.dir.r; e.c += e.dir.c;
                        }
                    } else {
                        e.dir = {r:0, c:0};
                    }
                }

                targetX = e.c * TILE_SIZE; targetY = e.r * TILE_SIZE;
                if (e.x < targetX) e.x += e.speed;
                else if (e.x > targetX) e.x -= e.speed;
                if (e.y < targetY) e.y += e.speed;
                else if (e.y > targetY) e.y -= e.speed;

                // Hit Player
                if (!player.dead && Math.hypot((e.x+TILE_SIZE/2) - (player.x+TILE_SIZE/2), (e.y+TILE_SIZE/2) - (player.y+TILE_SIZE/2)) < TILE_SIZE/1.5) {
                    player.dead = true;
                    gameOver();
                }
            });

            // Lethal Explosions logic
            explosions.forEach(ex => {
                let exCenterX = ex.c * TILE_SIZE + TILE_SIZE/2;
                let exCenterY = ex.r * TILE_SIZE + TILE_SIZE/2;
                
                // Hit Player
                if (!player.dead && Math.hypot(exCenterX - (player.x+TILE_SIZE/2), exCenterY - (player.y+TILE_SIZE/2)) < TILE_SIZE/1.5) {
                    player.dead = true;
                    gameOver();
                }

                // Hit Enemies
                enemies.forEach((e, i) => {
                    if(!e.dead && Math.hypot(exCenterX - (e.x+TILE_SIZE/2), exCenterY - (e.y+TILE_SIZE/2)) < TILE_SIZE/1.5) {
                        e.dead = true;
                        score += 100;
                        document.getElementById('scoreEl').textContent = `SCORE: ${score}`;
                    }
                });
            });
            enemies = enemies.filter(e => !e.dead);

            // Powerup Pickup
            for(let i=powerups.length-1; i>=0; i--) {
                let p = powerups[i];
                if (Math.hypot((p.c*TILE_SIZE+TILE_SIZE/2) - (player.x+TILE_SIZE/2), (p.r*TILE_SIZE+TILE_SIZE/2) - (player.y+TILE_SIZE/2)) < TILE_SIZE/2) {
                    if (p.type === 'bomb') player.bombMax++;
                    else if (p.type === 'fire') player.blastRadius++;
                    score += 50;
                    document.getElementById('scoreEl').textContent = `SCORE: ${score}`;
                    powerups.splice(i, 1);
                }
                // Destroyed by blast
                else if (explosions.some(ex => ex.r === p.r && ex.c === p.c)) {
                    powerups.splice(i, 1);
                }
            }

            // Exit Door Logic
            if (exitDoor && exitDoor.revealed && enemies.length === 0) {
                if (Math.hypot((exitDoor.c*TILE_SIZE+TILE_SIZE/2) - (player.x+TILE_SIZE/2), (exitDoor.r*TILE_SIZE+TILE_SIZE/2) - (player.y+TILE_SIZE/2)) < TILE_SIZE/3) {
                    level++;
                    document.getElementById('levelEl').textContent = `LEVEL: ${level}`;
                    buildLevel(); // Next Level
                }
            }

            // Clean up explosions
            for(let i=explosions.length-1; i>=0; i--) {
                explosions[i].life--;
                if(explosions[i].life <= 0) explosions.splice(i, 1);
            }

            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life--;
                if(p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            ctx.save();
            if (screenShake > 0) {
                let dx = (Math.random() - 0.5) * screenShake;
                let dy = (Math.random() - 0.5) * screenShake;
                ctx.translate(dx, dy);
            }

            // Draw Grid
            for(let r=0; r<ROWS; r++) {
                for(let c=0; c<COLS; c++) {
                    let x = c*TILE_SIZE; let y = r*TILE_SIZE;
                    
                    // Exit Door
                    if (exitDoor && exitDoor.revealed && exitDoor.r === r && exitDoor.c === c) {
                        ctx.fillStyle = enemies.length === 0 ? '#0f0' : '#555';
                        ctx.fillRect(x+5, y+5, TILE_SIZE-10, TILE_SIZE-10);
                        ctx.fillStyle = '#000'; ctx.fillRect(x+15, y+15, TILE_SIZE-30, TILE_SIZE-30);
                    }
                    
                    if (grid[r][c] === 1) { // Solid Wall
                        ctx.fillStyle = 'var(--wall-color)';
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.strokeStyle = '#111'; ctx.lineWidth=4; ctx.strokeRect(x,y,TILE_SIZE,TILE_SIZE);
                        // Rivets
                        ctx.fillStyle = '#555';
                        ctx.beginPath(); ctx.arc(x+8,y+8,3,0,Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(x+TILE_SIZE-8,y+8,3,0,Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(x+8,y+TILE_SIZE-8,3,0,Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(x+TILE_SIZE-8,y+TILE_SIZE-8,3,0,Math.PI*2); ctx.fill();
                    } else if (grid[r][c] === 2) { // Crate
                        ctx.fillStyle = 'var(--crate-color)';
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.strokeStyle = '#5c2a00'; ctx.lineWidth=2; 
                        ctx.strokeRect(x,y,TILE_SIZE,TILE_SIZE);
                        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+TILE_SIZE,y+TILE_SIZE); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(x+TILE_SIZE,y); ctx.lineTo(x,y+TILE_SIZE); ctx.stroke();
                        ctx.strokeRect(x+10,y+10,TILE_SIZE-20,TILE_SIZE-20);
                    }
                }
            }

            // Powerups
            powerups.forEach(p => {
                let x = p.c*TILE_SIZE + TILE_SIZE/2; let y = p.r*TILE_SIZE + TILE_SIZE/2;
                ctx.fillStyle = p.type === 'bomb' ? '#000' : 'var(--fire-edge)';
                ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth=2; ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.font = '16px bold sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText(p.type === 'bomb' ? 'B' : 'F', x, y);
            });

            // Bombs
            bombs.forEach(b => {
                let x = b.c*TILE_SIZE + TILE_SIZE/2; let y = b.r*TILE_SIZE + TILE_SIZE/2;
                let scale = 1 + Math.sin(frameCount * 0.2) * 0.1; // pulse
                ctx.fillStyle = 'var(--bomb-color)';
                ctx.beginPath(); ctx.arc(x, y, (TILE_SIZE/2.5) * scale, 0, Math.PI*2); ctx.fill();
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath(); ctx.arc(x - 5, y - 5, 5, 0, Math.PI*2); ctx.fill();
            });

            // Player
            if (!player.dead) {
                let px = player.x + TILE_SIZE/2; let py = player.y + TILE_SIZE/2;
                ctx.fillStyle = 'var(--player-color)';
                ctx.beginPath(); ctx.arc(px, py, TILE_SIZE/3, 0, Math.PI*2); ctx.fill();
                
                // Headset/visor
                ctx.fillStyle = '#000';
                ctx.fillRect(px - 10, py - 5, 20, 8);
                ctx.fillStyle = 'var(--ui-text)';
                ctx.fillRect(px - 8, py - 3, 16, 4);
            }

            // Enemies
            enemies.forEach(e => {
                let ex = e.x + TILE_SIZE/2; let ey = e.y + TILE_SIZE/2;
                ctx.fillStyle = 'var(--enemy-color)';
                ctx.beginPath(); ctx.arc(ex, ey, TILE_SIZE/3.5, 0, Math.PI*2); ctx.fill();
                // Spikes
                ctx.strokeStyle = 'var(--enemy-color)'; ctx.lineWidth=3;
                for(let i=0; i<4; i++) {
                    ctx.beginPath();
                    let a = (i * Math.PI/2) + frameCount*0.1;
                    ctx.moveTo(ex, ey);
                    ctx.lineTo(ex + Math.cos(a)*18, ey + Math.sin(a)*18);
                    ctx.stroke();
                }
                // Eye
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(ex, ey, 4, 0, Math.PI*2); ctx.fill();
            });

            // Explosions
            explosions.forEach(ex => {
                let x = ex.c*TILE_SIZE; let y = ex.r*TILE_SIZE;
                ctx.fillStyle = `rgba(255,69,0,${ex.life/30})`;
                ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                ctx.fillStyle = `rgba(255,255,255,${ex.life/30})`;
                ctx.fillRect(x+10, y+10, TILE_SIZE-20, TILE_SIZE-20);
            });

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x, p.y, 4, 4);
            });
            ctx.globalAlpha = 1;

            ctx.restore();
        }

        function loop() {
            if(!isRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Input
        window.addEventListener('keydown', e => {
            if(e.key.toLowerCase() === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if(e.key.toLowerCase() === 'd' || e.key === 'ArrowRight') keys.d = true;
            if(e.key.toLowerCase() === 'w' || e.key === 'ArrowUp') keys.w = true;
            if(e.key.toLowerCase() === 's' || e.key === 'ArrowDown') keys.s = true;
            if(e.code === 'Space') keys.space = true;
        });
        window.addEventListener('keyup', e => {
            if(e.key.toLowerCase() === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if(e.key.toLowerCase() === 'd' || e.key === 'ArrowRight') keys.d = false;
            if(e.key.toLowerCase() === 'w' || e.key === 'ArrowUp') keys.w = false;
            if(e.key.toLowerCase() === 's' || e.key === 'ArrowDown') keys.s = false;
            if(e.code === 'Space') keys.space = false;
        });

        // Touch Input
        const bU = document.getElementById('btn-up');
        const bD = document.getElementById('btn-down');
        const bL = document.getElementById('btn-left');
        const bR = document.getElementById('btn-right');
        const bBomb = document.getElementById('btn-bomb');

        const bindTouch = (el, key) => {
            el.addEventListener('touchstart', e => { e.preventDefault(); touchKeys[key] = true; });
            el.addEventListener('touchend', e => { e.preventDefault(); touchKeys[key] = false; });
        };
        bindTouch(bU, 'w'); bindTouch(bD, 's'); bindTouch(bL, 'a'); bindTouch(bR, 'd'); bindTouch(bBomb, 'bomb');

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            score = 0; level = 1;
            document.getElementById('scoreEl').textContent = `SCORE: 0`;
            document.getElementById('levelEl').textContent = `LEVEL: 1`;
            
            // Reset player permanent stats
            player.bombMax = 1;
            player.blastRadius = 1;

            buildLevel();
            isRunning = true;
            loop();
        }

        function gameOver() {
            isRunning = false;
            document.getElementById('final-stats').textContent = `SCORE: ${score}\nLEVEL REACHED: ${level}`;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
