<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grid Bomber</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');

        :root {
            --bg: #4caf50; /* Grass green */
            --wall-hard: #607d8b;
            --wall-soft: #ff9800;
            --player: #ffffff;
            --bomb: #212121;
            --fire: #ff3d00;
            --enemy: #9c27b0;
            --outline: #000000;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0; padding: 0; background-color: #2e7d32; color: #fff;
            font-family: 'Bangers', cursive; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        #game-container {
            position: relative; width: 100%; height: 100%; max-width: 600px; max-height: 800px;
            background-color: var(--bg); border: 8px solid var(--outline);
            overflow: hidden; border-radius: 12px; box-shadow: 10px 10px 0 rgba(0,0,0,0.3);
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 5; }

        .hud {
            position: absolute; top: 0; left: 0; right: 0; padding: 15px 20px;
            display: flex; justify-content: space-between; font-size: 28px; z-index: 10;
            background: var(--outline); border-bottom: 4px solid #333;
            letter-spacing: 2px; text-shadow: 2px 2px 0 var(--fire);
        }

        /* Comic Style Modals */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-2deg);
            background: #fff; border: 6px solid var(--outline); padding: 30px; text-align: center;
            box-shadow: 12px 12px 0 var(--outline); z-index: 30;
            border-radius: 20px; pointer-events: auto; width: 85%; max-width: 350px;
            color: var(--outline);
        }
        h1 { margin-top: 0; font-size: 42px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 3px 3px 0 var(--wall-soft); line-height: 1.1; margin-bottom: 10px;}
        p { font-family: sans-serif; font-weight: bold; font-size: 16px; margin-bottom: 30px; }
        
        button {
            background: var(--wall-soft); color: #fff; border: 4px solid var(--outline);
            padding: 12px 30px; font-family: 'Bangers', cursive; font-size: 24px; letter-spacing: 2px;
            cursor: pointer; transition: transform 0.1s; border-radius: 10px;
            box-shadow: 4px 4px 0 var(--outline); text-shadow: 2px 2px 0 #000;
        }
        button:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--outline); }
        .hidden { display: none !important; }

        /* On-screen controls for mobile */
        #controls {
            position: absolute; bottom: 20px; left: 0; width: 100%;
            display: flex; justify-content: space-between; padding: 0 20px; z-index: 20;
        }
        .dpad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px; }
        .btn { 
            background: rgba(255,255,255,0.8); border: 4px solid var(--outline); border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-family: sans-serif; font-weight: bold; font-size: 20px; color: var(--outline);
            box-shadow: 0 4px 0 var(--outline); cursor: pointer;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--outline); }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
        
        .btn-action { width: 80px; height: 80px; border-radius: 50%; background: var(--fire); color: #fff; font-size: 30px; margin-top: 35px;}

        @media (min-width: 800px) {
            #controls { display: none; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
            <div id="scoreEl">SCORE: 0</div>
            <div id="levelEl">LVL: 1</div>
        </div>

        <div id="controls">
            <div class="dpad">
                <div class="btn btn-up" id="btn-up">W</div>
                <div class="btn btn-left" id="btn-left">A</div>
                <div class="btn btn-right" id="btn-right">D</div>
                <div class="btn btn-down" id="btn-down">S</div>
            </div>
            <div class="btn btn-action" id="btn-bomb">💣</div>
        </div>

        <div id="start-screen" class="modal">
            <h1>GRID<br>BOMBER</h1>
            <p>WASD / Arrows to Move<br>SPACE to drop Bomb<br><br>Destroy orange blocks.<br>Find the hidden door!</p>
            <button id="start-btn">BOOM!</button>
        </div>
        
        <div id="game-over-screen" class="modal hidden">
            <h1 style="color:var(--fire); text-shadow:3px 3px 0 var(--outline);">KABOOM!</h1>
            <p id="final-stats">You blew up.</p>
            <button id="restart-btn">RETRY</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        let width, height;
        const COLS = 11;
        const ROWS = 13;
        let tileSize;
        let offsetX = 0, offsetY = 0;

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
            
            // Calc tile size
            let availH = height - 60; // hud space
            let sizeW = width / COLS;
            let sizeH = availH / ROWS;
            tileSize = Math.floor(Math.min(sizeW, sizeH));
            
            offsetX = (width - COLS * tileSize) / 2;
            offsetY = 60 + (availH - ROWS * tileSize) / 2;
        }
        window.addEventListener('resize', resize); resize();

        let isRunning = false;
        let score = 0;
        let level = 1;
        let frameCount = 0;

        // Map: 0 = empty, 1 = hard wall, 2 = soft wall, 3 = door (hidden under soft), 4 = powerup
        let grid = [];
        let doorPos = { x: 0, y: 0, revealed: false };
        
        let player = { gx: 1, gy: 1, x: 0, y: 0, speed: 3, bombRange: 2, maxBombs: 1, bombsPlaced: 0, moving: false, dir: {x:0, y:0} };
        let bombs = [];
        let explosions = [];
        let enemies = [];
        let particles = [];

        function initLevel() {
            grid = [];
            for(let x=0; x<COLS; x++) {
                grid[x] = [];
                for(let y=0; y<ROWS; y++) {
                    if (x===0 || y===0 || x===COLS-1 || y===ROWS-1) {
                        grid[x][y] = 1; // Border
                    } else if (x%2===0 && y%2===0) {
                        grid[x][y] = 1; // Pillars
                    } else {
                        // Safe zone for player
                        if ((x===1 && y===1) || (x===2 && y===1) || (x===1 && y===2)) {
                            grid[x][y] = 0;
                        } else {
                            grid[x][y] = Math.random() < 0.4 + (level*0.05) ? 2 : 0;
                        }
                    }
                }
            }

            // Hide door
            let doorPlaced = false;
            while(!doorPlaced) {
                let rx = Math.floor(Math.random()*COLS);
                let ry = Math.floor(Math.random()*ROWS);
                if (grid[rx][ry] === 2 && rx > 3 && ry > 3) {
                    grid[rx][ry] = 3; // 3 means soft wall containing door
                    doorPos = { x: rx, y: ry, revealed: false };
                    doorPlaced = true;
                }
            }

            // Reset player pos
            player.gx = 1; player.gy = 1;
            player.x = player.gx * tileSize;
            player.y = player.gy * tileSize;
            player.moving = false;
            bombs = []; explosions = []; particles = []; enemies = [];

            // Spawn enemies
            let numEnemies = 2 + level;
            for(let i=0; i<numEnemies; i++) {
                let ex, ey;
                do {
                    ex = Math.floor(Math.random()*COLS);
                    ey = Math.floor(Math.random()*ROWS);
                } while(grid[ex][ey] !== 0 || (ex < 4 && ey < 4));
                
                enemies.push({ gx: ex, gy: ey, x: ex*tileSize, y: ey*tileSize, dirX: 0, dirY: 0, moving: false });
            }
        }

        // Controls
        let keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; if(e.code==='Space') placeBomb(); });
        window.addEventListener('keyup', e => keys[e.code] = false);

        const bindBtn = (id, k) => {
            let el = document.getElementById(id);
            el.addEventListener('mousedown', e => { e.preventDefault(); keys[k] = true; });
            el.addEventListener('mouseup', e => { e.preventDefault(); keys[k] = false; });
            el.addEventListener('mouseleave', e => { e.preventDefault(); keys[k] = false; });
            el.addEventListener('touchstart', e => { e.preventDefault(); keys[k] = true; }, {passive:false});
            el.addEventListener('touchend', e => { e.preventDefault(); keys[k] = false; });
        };
        bindBtn('btn-up', 'ArrowUp'); bindBtn('btn-down', 'ArrowDown');
        bindBtn('btn-left', 'ArrowLeft'); bindBtn('btn-right', 'ArrowRight');
        
        document.getElementById('btn-bomb').addEventListener('mousedown', e => { e.preventDefault(); placeBomb(); });
        document.getElementById('btn-bomb').addEventListener('touchstart', e => { e.preventDefault(); placeBomb(); }, {passive:false});

        function placeBomb() {
            if (!isRunning) return;
            if (player.bombsPlaced >= player.maxBombs) return;
            
            // Snap to nearest grid
            let bx = Math.round(player.x / tileSize);
            let by = Math.round(player.y / tileSize);
            
            // Check if bomb already there
            if (bombs.some(b => b.gx === bx && b.gy === by)) return;

            bombs.push({ gx: bx, gy: by, timer: 180, range: player.bombRange });
            player.bombsPlaced++;
        }

        function explodeBomb(b) {
            player.bombsPlaced--;
            let bIndex = bombs.indexOf(b);
            if(bIndex !== -1) bombs.splice(bIndex, 1);
            
            // Center explosion
            addExplosion(b.gx, b.gy);
            
            // 4 directions
            let dirs = [[0,-1], [0,1], [-1,0], [1,0]];
            for(let d of dirs) {
                for(let i=1; i<=b.range; i++) {
                    let ex = b.gx + d[0]*i;
                    let ey = b.gy + d[1]*i;
                    
                    if(ex < 0 || ex >= COLS || ey < 0 || ey >= ROWS) break;
                    
                    let cell = grid[ex][ey];
                    if (cell === 1) break; // Hard wall stops it
                    
                    addExplosion(ex, ey);
                    
                    if (cell === 2) {
                        grid[ex][ey] = 0; // Destroy soft wall
                        score += 10;
                        break; // stops at first soft wall
                    } else if (cell === 3) {
                        grid[ex][ey] = 0; 
                        doorPos.revealed = true; // Reveal door
                        score += 50;
                        break;
                    }
                }
            }
        }

        function addExplosion(gx, gy) {
            explosions.push({ gx: gx, gy: gy, life: 30 });
            // Particles
            for(let i=0; i<5; i++) {
                particles.push({
                    x: gx*tileSize + tileSize/2, y: gy*tileSize + tileSize/2,
                    vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                    life: 20, color: Math.random() > 0.5 ? 'var(--fire)' : '#ffea00'
                });
            }
        }

        function checkCollision(x, y, ignoreSoft=false) {
            let buffer = 4; // Tolerance
            let left = Math.floor((x + buffer) / tileSize);
            let right = Math.floor((x + tileSize - buffer - 1) / tileSize);
            let top = Math.floor((y + buffer) / tileSize);
            let bottom = Math.floor((y + tileSize - buffer - 1) / tileSize);
            
            for(let c=left; c<=right; c++) {
                for(let r=top; r<=bottom; r++) {
                    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return true;
                    let val = grid[c][r];
                    if (val === 1) return true;
                    if (!ignoreSoft && (val === 2 || val === 3)) return true;
                }
            }
            
            // Check bombs
            for(let b of bombs) {
                let bxLeft = b.gx * tileSize; let bxRight = bxLeft + tileSize;
                let byTop = b.gy * tileSize; let byBottom = byTop + tileSize;
                if (x + tileSize - buffer > bxLeft && x + buffer < bxRight &&
                    y + tileSize - buffer > byTop && y + buffer < byBottom) {
                    
                    // Allow walking off a bomb you just placed, but not walking onto one
                    let pxLeft = player.gx * tileSize; let pxRight = pxLeft + tileSize;
                    let pyTop = player.gy * tileSize; let pyBottom = pyTop + tileSize;
                    
                    if (!(pxLeft + tileSize - buffer > bxLeft && pxLeft + buffer < bxRight &&
                        pyTop + tileSize - buffer > byTop && pyTop + buffer < byBottom)) {
                        return true;
                    }
                }
            }
            return false;
        }

        function rectIntersect(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
        }

        function update() {
            frameCount++;

            // Update Bombs
            for(let i=bombs.length-1; i>=0; i--) {
                let b = bombs[i];
                b.timer--;
                if (b.timer <= 0) explodeBomb(b);
            }

            // Update Explosions
            for(let i=explosions.length-1; i>=0; i--) {
                let exp = explosions[i];
                exp.life--;
                
                // Kill player
                if (rectIntersect(player.x+4, player.y+4, tileSize-8, tileSize-8, 
                                  exp.gx*tileSize+4, exp.gy*tileSize+4, tileSize-8, tileSize-8)) {
                    die();
                }

                // Kill enemies
                for(let j=enemies.length-1; j>=0; j--) {
                    let e = enemies[j];
                    if (rectIntersect(e.x+4, e.y+4, tileSize-8, tileSize-8, 
                                      exp.gx*tileSize+4, exp.gy*tileSize+4, tileSize-8, tileSize-8)) {
                        enemies.splice(j, 1);
                        score += 100;
                    }
                }
                
                if (exp.life <= 0) explosions.splice(i, 1);
            }

            // Player Movement (smooth pixel movement)
            let dx = 0; let dy = 0;
            if (keys['ArrowUp'] || keys['KeyW']) dy = -player.speed;
            if (keys['ArrowDown'] || keys['KeyS']) dy = player.speed;
            if (keys['ArrowLeft'] || keys['KeyA']) dx = -player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) dx = player.speed;

            if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; } // Normalize diagonal

            if (dx !== 0) {
                if (!checkCollision(player.x + dx, player.y)) player.x += dx;
            }
            if (dy !== 0) {
                if (!checkCollision(player.x, player.y + dy)) player.y += dy;
            }
            
            player.gx = Math.round(player.x / tileSize);
            player.gy = Math.round(player.y / tileSize);

            // Door check
            if (doorPos.revealed && player.gx === doorPos.x && player.gy === doorPos.y && enemies.length === 0) {
                winLevel();
            }

            // Enemy AI (Grid aligned moving)
            enemies.forEach(e => {
                if (!e.moving) {
                    let dirs = [{x:0,y:-1}, {x:0,y:1}, {x:-1,y:0}, {x:1,y:0}];
                    // Keep current dir 70% of time if possible
                    let keepDir = false;
                    if (e.dirX !== 0 || e.dirY !== 0) {
                        if (Math.random() < 0.7 && !checkCollision(e.x + e.dirX*tileSize, e.y + e.dirY*tileSize)) {
                            keepDir = true;
                        }
                    }
                    
                    if (!keepDir) {
                        dirs.sort(() => Math.random() - 0.5);
                        for(let d of dirs) {
                            if (!checkCollision(e.x + d.x*tileSize, e.y + d.y*tileSize)) {
                                e.dirX = d.x; e.dirY = d.y;
                                e.moving = true;
                                e.targetX = e.x + d.x*tileSize;
                                e.targetY = e.y + d.y*tileSize;
                                break;
                            }
                        }
                    } else {
                        e.moving = true;
                        e.targetX = e.x + e.dirX*tileSize;
                        e.targetY = e.y + e.dirY*tileSize;
                    }
                }
                
                if (e.moving) {
                    let espeed = 1.5;
                    e.x += e.dirX * espeed;
                    e.y += e.dirY * espeed;
                    
                    if (Math.abs(e.x - e.targetX) <= espeed && Math.abs(e.y - e.targetY) <= espeed) {
                        e.x = e.targetX; e.y = e.targetY;
                        e.moving = false;
                    }
                }

                // Hit player
                if (rectIntersect(player.x+6, player.y+6, tileSize-12, tileSize-12, e.x+6, e.y+6, tileSize-12, tileSize-12)) {
                    die();
                }
            });

            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            document.getElementById('scoreEl').textContent = `SCORE: ${score}`;
            document.getElementById('levelEl').textContent = `LVL: ${level}`;
        }

        // Draw Helper for Comic Style
        function drawBox(ctx, x, y, w, h, fillStr, shrink=0) {
            ctx.fillStyle = fillStr;
            ctx.strokeStyle = varOutline;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.rect(x+shrink, y+shrink, w-shrink*2, h-shrink*2);
            ctx.fill(); ctx.stroke();
            
            // Highlight
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x+shrink+4, y+shrink+4, w/3, h/4);
        }

        const varOutline = getComputedStyle(document.documentElement).getPropertyValue('--outline').trim();

        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.save();
            ctx.translate(offsetX, offsetY);

            // Draw Grid Background
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for(let x=0; x<COLS; x++) {
                for(let y=0; y<ROWS; y++) {
                    ctx.fillRect(x*tileSize, y*tileSize, tileSize, tileSize);
                }
            }

            // Draw Door
            if (doorPos.revealed) {
                ctx.fillStyle = '#000';
                ctx.fillRect(doorPos.x*tileSize + 4, doorPos.y*tileSize + 4, tileSize-8, tileSize-8);
                ctx.fillStyle = enemies.length === 0 ? '#ffea00' : '#444'; // Glow if open
                ctx.fillRect(doorPos.x*tileSize + 8, doorPos.y*tileSize + 8, tileSize-16, tileSize-16);
            }

            // Draw Walls
            for(let x=0; x<COLS; x++) {
                for(let y=0; y<ROWS; y++) {
                    let val = grid[x][y];
                    if (val === 1) {
                        drawBox(ctx, x*tileSize, y*tileSize, tileSize, tileSize, 'var(--wall-hard)', 0);
                    } else if (val === 2 || val === 3) {
                        drawBox(ctx, x*tileSize, y*tileSize, tileSize, tileSize, 'var(--wall-soft)', 2);
                    }
                }
            }

            // Draw Bombs
            bombs.forEach(b => {
                let bx = b.gx * tileSize + tileSize/2;
                let by = b.gy * tileSize + tileSize/2;
                let br = tileSize/2.5;
                
                // Pulse
                let scale = 1 + Math.sin(b.timer * 0.2) * 0.1;
                ctx.save();
                ctx.translate(bx, by);
                ctx.scale(scale, scale);
                
                ctx.fillStyle = 'var(--bomb)';
                ctx.strokeStyle = varOutline;
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(0, 0, br, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                
                // Wick
                ctx.strokeStyle = '#fff';
                ctx.beginPath(); ctx.moveTo(0, -br); ctx.lineTo(10, -br-10); ctx.stroke();
                // Spark
                if (frameCount % 4 < 2) {
                    ctx.fillStyle = 'var(--fire)';
                    ctx.beginPath(); ctx.arc(10, -br-10, 4, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            });

            // Draw Enemies
            enemies.forEach(e => {
                drawBox(ctx, e.x, e.y, tileSize, tileSize, 'var(--enemy)', 4);
                // Eyes
                ctx.fillStyle = '#fff';
                ctx.fillRect(e.x + tileSize*0.3, e.y + tileSize*0.3, 4, 4);
                ctx.fillRect(e.x + tileSize*0.6, e.y + tileSize*0.3, 4, 4);
            });

            // Draw Player
            if (!player.dead) {
                drawBox(ctx, player.x, player.y, tileSize, tileSize, 'var(--player)', 6);
                // Simple face
                ctx.fillStyle = '#000';
                ctx.fillRect(player.x + tileSize*0.3, player.y + tileSize*0.3, 4, 6);
                ctx.fillRect(player.x + tileSize*0.6, player.y + tileSize*0.3, 4, 6);
            }

            // Draw Explosions
            explosions.forEach(exp => {
                let p = exp.life / 30; // 1 to 0
                ctx.fillStyle = 'var(--fire)';
                ctx.globalAlpha = p;
                let shrink = (1-p) * 10;
                ctx.fillRect(exp.gx*tileSize + shrink, exp.gy*tileSize + shrink, tileSize - shrink*2, tileSize - shrink*2);
            });
            ctx.globalAlpha = 1;

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
            });

            ctx.restore();
        }

        function loop() {
            if(!isRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function die() {
            if(player.dead) return;
            player.dead = true;
            for(let i=0; i<20; i++) {
                particles.push({
                    x: player.x + tileSize/2, y: player.y + tileSize/2,
                    vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15,
                    life: 30, color: '#fff'
                });
            }
            setTimeout(() => {
                isRunning = false;
                document.getElementById('final-stats').innerHTML = `Score: ${score}<br>Level: ${level}`;
                document.getElementById('game-over-screen').classList.remove('hidden');
            }, 1000);
        }

        function winLevel() {
            level++;
            score += 200;
            initLevel();
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            if (player.dead) { score = 0; level = 1; }
            player.dead = false;
            
            initLevel();
            document.getElementById('scoreEl').textContent = `SCORE: ${score}`;
            document.getElementById('levelEl').textContent = `LVL: ${level}`;
            
            isRunning = true;
            loop();
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
