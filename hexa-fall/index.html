<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hexa Fall</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --bg-color: #111;
            --accent: #ff0055;
            --center: #00ffcc;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: #fff;
            font-family: 'Share Tech Mono', monospace; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
            transition: background-color 0.1s;
        }

        #game-container {
            position: relative; width: 100%; height: 100%; max-width: 800px; max-height: 800px;
            background-color: transparent; overflow: hidden;
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 5; }

        .hud {
            position: absolute; top: 20px; left: 20px; font-size: 32px; z-index: 10;
            pointer-events: none; color: #fff; text-shadow: 0 0 10px #fff;
        }

        /* Modals */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(17, 17, 17, 0.9); border: 2px solid var(--accent); padding: 40px;
            text-align: center; box-shadow: 0 0 50px var(--accent); z-index: 30;
            pointer-events: auto; width: 85%; max-width: 400px;
        }
        h1 { margin-top: 0; font-size: 50px; color: var(--accent); text-shadow: 0 0 20px var(--accent); margin-bottom: 10px; }
        p { font-size: 18px; margin-bottom: 30px; line-height: 1.5; }
        button {
            background: transparent; color: #fff; border: 2px solid #fff;
            padding: 15px 40px; font-family: 'Share Tech Mono', monospace; font-size: 24px;
            cursor: pointer; transition: 0.2s; text-transform: uppercase;
        }
        button:hover { background: #fff; color: #000; box-shadow: 0 0 20px #fff; }
        .hidden { display: none !important; }

        #controls {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50%;
            display: flex; z-index: 20;
        }
        .btn-zone { flex: 1; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="hud" id="timeEl">0.00</div>
        
        <div id="controls">
            <div class="btn-zone" id="zone-left"></div>
            <div class="btn-zone" id="zone-right"></div>
        </div>

        <div id="start-screen" class="modal">
            <h1>Hexa Fall</h1>
            <p>Tap Left/Right or use Arrows to rotate.<br>Avoid the incoming walls.</p>
            <button id="start-btn">BEGIN</button>
        </div>
        
        <div id="game-over-screen" class="modal hidden">
            <h1>CRUSHED</h1>
            <p id="final-stats">Time: 0.00s</p>
            <button id="restart-btn">RETRY</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        let width, height, cx, cy;
        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width; canvas.height = height;
            cx = width / 2; cy = height / 2;
        }
        window.addEventListener('resize', resize); resize();

        let isRunning = false;
        let frameCount = 0;
        let timeAlive = 0;
        
        // Game variables
        let SIDES = 6;
        let playerAngle = 0; // angle in radians
        let centerRadius = 30;
        let globalRotation = 0;
        let globalRotationSpeed = 0.01;
        let wallSpeed = 3;
        let hue = 0;

        let walls = []; // array of { radius, thickness, gapIndex, numGaps }

        function spawnWalls() {
            let gap = Math.floor(Math.random() * SIDES);
            let numGaps = (Math.random() > 0.8) ? 2 : 1;
            
            // Random patterns
            let pattern = Math.floor(Math.random() * 3);
            if (pattern === 0) {
                // Single ring
                walls.push({ radius: Math.max(width, height) + 100, thickness: 20, gapIndex: gap, numGaps: numGaps });
            } else if (pattern === 1) {
                // Spiral / staircase (3 rings)
                walls.push({ radius: Math.max(width, height) + 100, thickness: 20, gapIndex: gap, numGaps: 1 });
                walls.push({ radius: Math.max(width, height) + 180, thickness: 20, gapIndex: (gap + 1) % SIDES, numGaps: 1 });
                walls.push({ radius: Math.max(width, height) + 260, thickness: 20, gapIndex: (gap + 2) % SIDES, numGaps: 1 });
            } else if (pattern === 2) {
                // Half circle trap
                walls.push({ radius: Math.max(width, height) + 100, thickness: 50, gapIndex: gap, numGaps: 3 });
            }
        }

        function drawPolygon(ctx, x, y, radius, sides, rotation, color, stroke = false, thickness = 2) {
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                let angle = rotation + (i * 2 * Math.PI / sides);
                let px = x + Math.cos(angle) * radius;
                let py = y + Math.sin(angle) * radius;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            if (stroke) {
                ctx.strokeStyle = color;
                ctx.lineWidth = thickness;
                ctx.stroke();
            } else {
                ctx.fillStyle = color;
                ctx.fill();
            }
        }

        function update() {
            frameCount++;
            timeAlive += 1/60;
            document.getElementById('timeEl').textContent = timeAlive.toFixed(2);

            // Difficulty increase
            wallSpeed = 3 + (timeAlive * 0.05);
            globalRotationSpeed = 0.01 + Math.sin(timeAlive * 0.1) * 0.015;
            globalRotation += globalRotationSpeed;

            // Color shifting
            hue = (hue + 0.5) % 360;
            let bgColor = `hsl(${hue}, 80%, 5%)`;
            let accentColor = `hsl(${hue}, 100%, 50%)`;
            document.body.style.backgroundColor = bgColor;

            // Player movement
            let moveSpeed = 0.1;
            if (keys['ArrowLeft'] || keys['KeyA'] || touchLeft) playerAngle -= moveSpeed;
            if (keys['ArrowRight'] || keys['KeyD'] || touchRight) playerAngle += moveSpeed;

            // Normalize player angle 0 to 2PI
            playerAngle = (playerAngle + Math.PI * 2) % (Math.PI * 2);

            // Walls
            if (frameCount % Math.max(30, Math.floor(120 - wallSpeed * 10)) === 0) {
                spawnWalls();
            }

            for (let i = walls.length - 1; i >= 0; i--) {
                let w = walls[i];
                w.radius -= wallSpeed;

                // Collision Detection
                // Player is at centerRadius + 10
                let pDist = centerRadius + 5;
                if (w.radius - w.thickness/2 < pDist && w.radius + w.thickness/2 > pDist) {
                    // Check if player is in a gap
                    // Calculate which side the player is on
                    let effectiveAngle = (playerAngle - globalRotation + Math.PI*4) % (Math.PI*2);
                    let sideAngle = (Math.PI*2) / SIDES;
                    let playerSide = Math.floor(effectiveAngle / sideAngle);
                    
                    // Allow small margin of error (lenient collision)
                    let inGap = false;
                    for (let g=0; g<w.numGaps; g++) {
                        let checkGap = (w.gapIndex + g) % SIDES;
                        if (playerSide === checkGap) {
                            inGap = true;
                            break;
                        }
                    }

                    if (!inGap) {
                        die();
                        return;
                    }
                }

                if (w.radius < centerRadius - 10) walls.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            let accentColor = `hsl(${hue}, 100%, 50%)`;

            ctx.save();
            ctx.translate(cx, cy);
            
            // Draw background pulsing lines
            let pulse = Math.sin(frameCount * 0.1) * 10 + 20;
            drawPolygon(ctx, 0, 0, width, SIDES, globalRotation, `rgba(255,255,255,0.02)`, false);
            
            // Draw spokes
            ctx.strokeStyle = `rgba(255,255,255,0.1)`;
            ctx.lineWidth = 2;
            for (let i = 0; i < SIDES; i++) {
                let angle = globalRotation + (i * 2 * Math.PI / SIDES);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(angle) * width, Math.sin(angle) * width);
                ctx.stroke();
            }

            // Draw Walls
            ctx.lineWidth = 20;
            ctx.strokeStyle = accentColor;
            ctx.lineCap = 'butt';
            
            walls.forEach(w => {
                ctx.lineWidth = w.thickness;
                for (let i = 0; i < SIDES; i++) {
                    let isGap = false;
                    for(let g=0; g<w.numGaps; g++) {
                        if (i === (w.gapIndex + g) % SIDES) isGap = true;
                    }
                    if (isGap) continue;

                    let startAngle = globalRotation + (i * 2 * Math.PI / SIDES);
                    let endAngle = globalRotation + ((i+1) * 2 * Math.PI / SIDES);
                    
                    // Draw a straight line for this side
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(startAngle) * w.radius, Math.sin(startAngle) * w.radius);
                    ctx.lineTo(Math.cos(endAngle) * w.radius, Math.sin(endAngle) * w.radius);
                    ctx.stroke();
                }
            });

            // Draw Center Hexagon
            drawPolygon(ctx, 0, 0, centerRadius, SIDES, globalRotation, 'var(--center)');

            // Draw Player Cursor (Triangle)
            ctx.rotate(playerAngle);
            let pDist = centerRadius + 15;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(pDist, 0); // Pointing out
            ctx.lineTo(pDist - 10, -8);
            ctx.lineTo(pDist - 10, 8);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function loop() {
            if(!isRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function die() {
            isRunning = false;
            
            // Screen shake / flash
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, width, height);
            
            setTimeout(() => {
                document.getElementById('final-stats').textContent = `Time: ${timeAlive.toFixed(2)}s`;
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.body.style.backgroundColor = '#111';
            }, 100);
        }

        // Input
        let keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });
        
        let touchLeft = false, touchRight = false;
        document.getElementById('zone-left').addEventListener('touchstart', e => { e.preventDefault(); touchLeft = true; }, {passive:false});
        document.getElementById('zone-left').addEventListener('touchend', e => { touchLeft = false; });
        document.getElementById('zone-right').addEventListener('touchstart', e => { e.preventDefault(); touchRight = true; }, {passive:false});
        document.getElementById('zone-right').addEventListener('touchend', e => { touchRight = false; });

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            timeAlive = 0; frameCount = 0;
            globalRotation = 0; wallSpeed = 3;
            playerAngle = 0; walls = []; hue = 0;
            
            isRunning = true;
            loop();
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
