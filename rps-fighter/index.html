<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPS Fighter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Roboto+Condensed:wght@700&display=swap');

        * { box-sizing: border-box; touch-action: manipulation; user-select: none; }

        body {
            margin: 0; padding: 0;
            background: #1a0a2e;
            background-image: radial-gradient(circle at 50% 20%, #2d1b69 0%, #1a0a2e 60%);
            height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Roboto Condensed', sans-serif;
            overflow: hidden; color: #fff;
        }

        .arena {
            width: 100%; max-width: 480px;
            display: flex; flex-direction: column; align-items: center;
            padding: 10px; gap: 10px;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 48px; letter-spacing: 6px; margin: 0;
            color: #f0f; text-shadow: 0 0 15px #f0f, 3px 3px 0 #000;
        }

        /* Health Bars */
        .health-section {
            width: 100%; display: flex; align-items: center; gap: 10px;
        }
        .fighter-name {
            font-size: 18px; font-weight: 700; width: 70px; text-align: center;
            text-shadow: 1px 1px 0 #000;
        }
        .hp-bar-bg {
            flex: 1; height: 24px; background: #111;
            border: 2px solid #333; border-radius: 12px; overflow: hidden;
        }
        .hp-bar {
            height: 100%; width: 100%; border-radius: 12px;
            transition: width 0.4s ease-out, background-color 0.4s;
        }
        .hp-bar.player { background: linear-gradient(90deg, #0f0, #7fff00); }
        .hp-bar.enemy { background: linear-gradient(90deg, #f00, #ff4500); }
        .hp-bar.low { background: #f00 !important; animation: hpFlash 0.5s infinite alternate; }
        @keyframes hpFlash { 0% { opacity: 1; } 100% { opacity: 0.5; } }

        /* Fighter stage */
        .stage {
            width: 100%; height: 200px; position: relative;
            background: linear-gradient(180deg, #0a0520 0%, #160833 60%, #2a0a4a 100%);
            border: 2px solid #4a2080; border-radius: 12px;
            overflow: hidden;
        }

        /* Floor line */
        .stage::after {
            content: ''; position: absolute; bottom: 40px; left: 0; right: 0;
            height: 3px; background: linear-gradient(90deg, transparent, #f0f, #0ff, transparent);
        }

        .fighter {
            position: absolute; bottom: 43px;
            display: flex; flex-direction: column; align-items: center;
            transition: transform 0.15s;
        }
        .fighter.player { left: 20%; }
        .fighter.enemy { right: 20%; transform: scaleX(-1); }

        .fighter-sprite {
            font-size: 72px; line-height: 1;
            filter: drop-shadow(0 0 10px currentColor);
            transition: filter 0.2s;
        }
        .fighter.player .fighter-sprite { color: #0ff; }
        .fighter.enemy .fighter-sprite { color: #f0f; }

        .move-label {
            font-size: 14px; font-weight: 700; margin-top: 4px;
            text-shadow: 0 0 5px currentColor; opacity: 0;
            transition: opacity 0.2s;
        }
        .fighter.player .move-label { color: #0ff; }
        .fighter.enemy .move-label { color: #f0f; transform: scaleX(-1); }
        .fighter.show-move .move-label { opacity: 1; }

        /* Attack animation */
        .fighter.attacking { animation: punch 0.3s ease-out; }
        @keyframes punch {
            0% { transform: translateX(0); }
            40% { transform: translateX(80px); }
            100% { transform: translateX(0); }
        }
        .fighter.enemy.attacking { animation: punchEnemy 0.3s ease-out; }
        @keyframes punchEnemy {
            0% { transform: scaleX(-1) translateX(0); }
            40% { transform: scaleX(-1) translateX(80px); }
            100% { transform: scaleX(-1) translateX(0); }
        }
        .fighter.hit { animation: shake 0.3s ease-out; }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
            100% { transform: translateX(0); }
        }
        .fighter.enemy.hit { animation: shakeEnemy 0.3s ease-out; }
        @keyframes shakeEnemy {
            0% { transform: scaleX(-1) translateX(0); }
            25% { transform: scaleX(-1) translateX(-15px); }
            75% { transform: scaleX(-1) translateX(15px); }
            100% { transform: scaleX(-1) translateX(0); }
        }

        /* Result flash */
        .round-result {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'Bangers', cursive; font-size: 48px; text-align: center;
            text-shadow: 3px 3px 0 #000; opacity: 0; pointer-events: none;
            transition: opacity 0.1s;
            white-space: nowrap;
        }
        .round-result.show { opacity: 1; }

        /* Vs label */
        .vs-label {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -60%);
            font-family: 'Bangers', cursive; font-size: 36px; color: #ff0;
            text-shadow: 2px 2px 0 #000; opacity: 0.5;
        }

        /* Controls */
        .controls {
            width: 100%; text-align: center;
        }
        .controls p { margin: 0 0 10px; font-size: 14px; color: #aaa; letter-spacing: 1px; }

        .move-btns {
            display: flex; justify-content: center; gap: 15px;
        }

        .move-btn {
            flex: 1; max-width: 130px; padding: 15px 10px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            transition: all 0.2s; color: #fff;
        }
        .move-btn:hover { background: rgba(255,255,255,0.15); border-color: #0ff; transform: translateY(-3px); }
        .move-btn:active { transform: translateY(0); }
        .move-btn.selected { border-color: #0ff; background: rgba(0,255,255,0.15); }
        .move-btn .icon { font-size: 40px; }
        .move-btn .name { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
        .move-btn .desc { font-size: 11px; color: #888; }

        /* Status line */
        .status-bar {
            font-size: 20px; font-weight: 700; letter-spacing: 3px;
            color: #ff0; text-shadow: 0 0 10px #ff0;
            min-height: 28px; text-align: center;
        }

        /* Modal */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 5, 20, 0.92);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
            z-index: 100; text-align: center; gap: 15px;
        }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal h2 { font-family: 'Bangers', cursive; font-size: 60px; margin: 0; }
        .modal p { font-size: 20px; color: #aaa; margin: 0; }
        .btn {
            background: transparent; color: #f0f; border: 2px solid #f0f;
            padding: 15px 40px; font-family: 'Roboto Condensed', sans-serif;
            font-size: 22px; font-weight: 700; cursor: pointer;
            border-radius: 8px; letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255,0,255,0.3);
            transition: all 0.2s;
        }
        .btn:hover { background: #f0f; color: #000; box-shadow: 0 0 40px #f0f; }
    </style>
</head>
<body>

<div class="arena">
    <h1>RPS FIGHTER</h1>

    <!-- Player HP -->
    <div class="health-section">
        <div class="fighter-name" style="color:#0ff;">YOU</div>
        <div class="hp-bar-bg">
            <div class="hp-bar player" id="player-hp-bar"></div>
        </div>
        <div id="player-hp-label" style="min-width:45px; text-align:right; color:#0ff; font-weight:700;">100</div>
    </div>

    <!-- Enemy HP -->
    <div class="health-section">
        <div class="fighter-name" style="color:#f0f;">CPU</div>
        <div class="hp-bar-bg">
            <div class="hp-bar enemy" id="enemy-hp-bar"></div>
        </div>
        <div id="enemy-hp-label" style="min-width:45px; text-align:right; color:#f0f; font-weight:700;">100</div>
    </div>

    <!-- Stage -->
    <div class="stage">
        <div class="vs-label">VS</div>
        <div class="fighter player" id="player-fighter">
            <div class="fighter-sprite" id="player-sprite">🥷</div>
            <div class="move-label" id="player-move-label">ROCK</div>
        </div>
        <div class="fighter enemy" id="enemy-fighter">
            <div class="fighter-sprite" id="enemy-sprite">🤖</div>
            <div class="move-label" id="enemy-move-label">ROCK</div>
        </div>
        <div class="round-result" id="round-result"></div>
    </div>

    <div class="status-bar" id="status">CHOOSE YOUR MOVE!</div>

    <!-- Move buttons -->
    <div class="controls">
        <div class="move-btns">
            <button class="move-btn" id="btn-rock" onclick="pickMove('rock')">
                <div class="icon">✊</div>
                <div class="name">ROCK</div>
                <div class="desc">Beats Scissors</div>
            </button>
            <button class="move-btn" id="btn-paper" onclick="pickMove('paper')">
                <div class="icon">🖐</div>
                <div class="name">PAPER</div>
                <div class="desc">Beats Rock</div>
            </button>
            <button class="move-btn" id="btn-scissors" onclick="pickMove('scissors')">
                <div class="icon">✌️</div>
                <div class="name">SCISSORS</div>
                <div class="desc">Beats Paper</div>
            </button>
        </div>
    </div>
</div>

<!-- Modals -->
<div class="modal active" id="menu-modal">
    <h2 style="color:#f0f;">RPS FIGHTER</h2>
    <p>Pick your move each round.<br>Deal damage — first to 0 HP loses!</p>
    <button class="btn" onclick="startGame()">FIGHT!</button>
</div>

<div class="modal" id="end-modal">
    <h2 id="end-title">YOU WIN!</h2>
    <p id="end-sub">Flawless victory!</p>
    <button class="btn" onclick="startGame()">REMATCH</button>
</div>

<script>
    const MOVES = ['rock', 'paper', 'scissors'];
    const MOVE_ICONS = { rock: '✊', paper: '🖐', scissors: '✌️' };
    const FIGHTER_IDLE = { player: '🥷', enemy: '🤖' };

    // Win table: wins[a] beats wins[b]
    const BEATS = { rock: 'scissors', scissors: 'paper', paper: 'rock' };

    let playerHP = 100, enemyHP = 100;
    let isLocked = false; // prevent spam during animation

    function startGame() {
        playerHP = 100;
        enemyHP = 100;
        isLocked = false;
        updateHP();
        setStatus('CHOOSE YOUR MOVE!');
        document.getElementById('menu-modal').classList.remove('active');
        document.getElementById('end-modal').classList.remove('active');
        setSprite('player', FIGHTER_IDLE.player);
        setSprite('enemy', FIGHTER_IDLE.enemy);
        setMoveLabel('player', '');
        setMoveLabel('enemy', '');
        clearButtonSelections();
    }

    function updateHP() {
        let pPct = Math.max(0, playerHP) + '%';
        let ePct = Math.max(0, enemyHP) + '%';
        document.getElementById('player-hp-bar').style.width = pPct;
        document.getElementById('enemy-hp-bar').style.width = ePct;
        document.getElementById('player-hp-label').textContent = Math.max(0, playerHP);
        document.getElementById('enemy-hp-label').textContent = Math.max(0, enemyHP);

        let pBar = document.getElementById('player-hp-bar');
        let eBar = document.getElementById('enemy-hp-bar');
        pBar.classList.toggle('low', playerHP <= 30);
        eBar.classList.toggle('low', enemyHP <= 30);
    }

    function setSprite(fighter, icon) {
        document.getElementById(`${fighter}-sprite`).textContent = icon;
    }

    function setMoveLabel(fighter, text) {
        let lbl = document.getElementById(`${fighter}-move-label`);
        lbl.textContent = text;
        let f = document.getElementById(`${fighter}-fighter`);
        if (text) f.classList.add('show-move');
        else f.classList.remove('show-move');
    }

    function clearButtonSelections() {
        document.querySelectorAll('.move-btn').forEach(b => b.classList.remove('selected'));
    }

    function setStatus(text) {
        document.getElementById('status').textContent = text;
    }

    function showRoundResult(text, color) {
        let el = document.getElementById('round-result');
        el.textContent = text;
        el.style.color = color;
        el.style.textShadow = `0 0 20px ${color}, 3px 3px 0 #000`;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 1000);
    }

    function triggerAnimation(fighter, type) {
        let el = document.getElementById(`${fighter}-fighter`);
        el.classList.remove('attacking', 'hit');
        void el.offsetWidth; // force reflow
        el.classList.add(type);
        setTimeout(() => el.classList.remove(type), 350);
    }

    function pickMove(playerMove) {
        if (isLocked) return;
        isLocked = true;

        clearButtonSelections();
        document.getElementById(`btn-${playerMove}`).classList.add('selected');

        // CPU pick (weighted slightly towards winning to keep it challenging)
        let cpuMove;
        let r = Math.random();
        if (r < 0.38) {
            cpuMove = BEATS[playerMove]; // CPU counters player 38% of time (harder)
        } else {
            cpuMove = MOVES[Math.floor(Math.random() * 3)];
        }

        setStatus('...');

        setTimeout(() => {
            // Reveal moves
            setMoveLabel('player', playerMove.toUpperCase());
            setMoveLabel('enemy', cpuMove.toUpperCase());
            setSprite('player', MOVE_ICONS[playerMove]);
            setSprite('enemy', MOVE_ICONS[cpuMove]);

            let resultText, damage;

            if (playerMove === cpuMove) {
                // Draw
                resultText = 'DRAW!';
                showRoundResult('⚡ DRAW! ⚡', '#ff0');
                setStatus('BLOCKED — NO DAMAGE!');
                damage = 0;
                triggerAnimation('player', 'attacking');
                triggerAnimation('enemy', 'attacking');

                setTimeout(() => finishRound(0), 800);

            } else if (BEATS[playerMove] === cpuMove) {
                // Player wins round
                damage = 15 + Math.floor(Math.random() * 10); // 15-24 dmg
                triggerAnimation('player', 'attacking');
                triggerAnimation('enemy', 'hit');
                showRoundResult('💥 HIT! +' + damage, '#0ff');
                setStatus(`${playerMove.toUpperCase()} BEATS ${cpuMove.toUpperCase()}!`);
                enemyHP -= damage;

                setTimeout(() => finishRound(-1), 800);

            } else {
                // CPU wins round
                damage = 15 + Math.floor(Math.random() * 10);
                triggerAnimation('enemy', 'attacking');
                triggerAnimation('player', 'hit');
                showRoundResult('💥 HIT! -' + damage, '#f0f');
                setStatus(`${cpuMove.toUpperCase()} BEATS ${playerMove.toUpperCase()}!`);
                playerHP -= damage;

                setTimeout(() => finishRound(1), 800);
            }

            updateHP();
        }, 500);
    }

    function finishRound(winner) {
        // Restore idle sprites after animation
        setTimeout(() => {
            setSprite('player', FIGHTER_IDLE.player);
            setSprite('enemy', FIGHTER_IDLE.enemy);
            setMoveLabel('player', '');
            setMoveLabel('enemy', '');
            clearButtonSelections();
        }, 200);

        if (playerHP <= 0 || enemyHP <= 0) {
            setTimeout(() => endGame(playerHP > 0), 600);
        } else {
            setTimeout(() => {
                setStatus('CHOOSE YOUR MOVE!');
                isLocked = false;
            }, 600);
        }
    }

    function endGame(playerWon) {
        let modal = document.getElementById('end-modal');
        let title = document.getElementById('end-title');
        let sub = document.getElementById('end-sub');

        if (playerWon) {
            title.textContent = '🏆 YOU WIN!';
            title.style.color = '#0ff';
            title.style.textShadow = '0 0 20px #0ff';
            sub.textContent = 'CPU destroyed! Undefeated champion!';
        } else {
            title.textContent = '💀 YOU LOSE!';
            title.style.color = '#f00';
            title.style.textShadow = '0 0 20px #f00';
            sub.textContent = 'Outclassed by the machine...';
        }

        modal.classList.add('active');
    }
</script>
</body>
</html>
