<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Pinball</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');

        :root {
            --bg: #050014;
            --table: #1a0033;
            --ball: #fff;
            --bumper: #ff00ff;
            --flipper: #00ffff;
            --wall: #00ffcc;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0; padding: 0; background-color: #000; color: #fff;
            font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        #game-container {
            position: relative; width: 100%; height: 100%; max-width: 500px; max-height: 800px;
            background: radial-gradient(circle at 50% 30%, #2a004d, var(--bg));
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.2); border: 1px solid rgba(0, 255, 255, 0.1);
            overflow: hidden; border-radius: 20px;
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 5; }

        .hud {
            position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between;
            font-size: 20px; z-index: 10; pointer-events: none; font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        
        .score-val { color: var(--flipper); font-size: 24px; text-shadow: 0 0 10px rgba(0,255,255,0.5); }
        .ball-val { color: var(--bumper); font-size: 24px; text-shadow: 0 0 10px rgba(255,0,255,0.5); }

        /* Glassmorphism Modals */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 0, 30, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px; text-align: center; z-index: 30;
            border-radius: 20px; pointer-events: auto; width: 85%; max-width: 350px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
        }
        h1 { color: #fff; margin-top: 0; font-size: 36px; text-shadow: 0 0 15px var(--flipper); margin-bottom: 10px; line-height: 1.2; letter-spacing: 2px;}
        p { color: #d0d0d0; line-height: 1.5; font-size: 14px; margin-bottom: 30px; }
        
        /* Tactile Button */
        button {
            background: linear-gradient(135deg, rgba(0,255,255,0.2), rgba(0,255,255,0.05));
            color: #fff; border: 1px solid rgba(0,255,255,0.3);
            padding: 15px 35px; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border-radius: 50px; letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        button:hover { 
            background: linear-gradient(135deg, rgba(0,255,255,0.4), rgba(0,255,255,0.1));
            box-shadow: 0 8px 25px rgba(0, 255, 255, 0.3), inset 0 1px 0 rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }
        button:active { transform: translateY(1px); box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }

        #controls {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 35vh;
            display: flex; z-index: 20;
        }
        .btn-zone { flex: 1; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
            <div>SCORE<br><span class="score-val" id="scoreEl">0</span></div>
            <div style="text-align:right;">BALLS<br><span class="ball-val" id="ballsEl">3</span></div>
        </div>

        <div id="controls">
            <div class="btn-zone" id="zone-left"></div>
            <div class="btn-zone" id="zone-right"></div>
        </div>

        <div id="start-screen" class="modal">
            <h1>NEON<br>PINBALL</h1>
            <p>Tap Left/Right to flip.<br>Keep the ball in play.<br>Hit bumpers for points!</p>
            <button id="start-btn">PLAY NOW</button>
        </div>
        
        <div id="game-over-screen" class="modal hidden">
            <h1 style="color:#ff0055; text-shadow: 0 0 15px #ff0055;">TILT</h1>
            <p id="final-stats" style="font-size: 20px; color: #fff;">Score: 0</p>
            <button id="restart-btn" style="border-color:rgba(255,0,85,0.5); background: linear-gradient(135deg, rgba(255,0,85,0.2), rgba(255,0,85,0.05));">RETRY</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        const LOGICAL_W = 500;
        const LOGICAL_H = 800;
        let scaleX=1, scaleY=1;

        function resize() {
            let cw = container.clientWidth;
            let ch = container.clientHeight;
            canvas.width = cw;
            canvas.height = ch;
            scaleX = cw / LOGICAL_W;
            scaleY = ch / LOGICAL_H;
        }
        window.addEventListener('resize', resize); resize();

        let isRunning = false;
        let score = 0;
        let ballsLeft = 3;

        // Physics Constants (Substepped)
        const SUBSTEPS = 4;
        const DT = 1 / SUBSTEPS;
        const GRAVITY = 0.4 * DT;
        const FRICTION = Math.pow(0.995, DT); // Adjust friction for substepping
        const MAX_SPEED = 40; // Max pixels per substep
        
        let ball = { x: 450, y: 700, vx: 0, vy: -15, r: 10 };
        let flipperLeft = { x: 160, y: 720, len: 100, angle: 0.5, rest: 0.5, max: -0.5, up: false, angularVel: 0 };
        let flipperRight = { x: 340, y: 720, len: 100, angle: Math.PI - 0.5, rest: Math.PI - 0.5, max: Math.PI + 0.5, up: false, angularVel: 0 };
        
        let bumpers = [
            { x: 250, y: 250, r: 35, val: 500, active: 0 },
            { x: 140, y: 150, r: 30, val: 200, active: 0 },
            { x: 360, y: 150, r: 30, val: 200, active: 0 },
            { x: 100, y: 350, r: 25, val: 100, active: 0 },
            { x: 400, y: 350, r: 25, val: 100, active: 0 }
        ];

        let lines = [
            // Outer walls
            { x1: 0, y1: 800, x2: 0, y2: 100 },
            { x1: 0, y1: 100, x2: 250, y2: 0 },
            { x1: 250, y1: 0, x2: 500, y2: 100 },
            { x1: 500, y1: 100, x2: 500, y2: 800 },
            // Flipper funnels
            { x1: 0, y1: 500, x2: 140, y2: 700 },
            { x1: 500, y1: 500, x2: 360, y2: 700 },
            // Plunger lane
            { x1: 420, y1: 800, x2: 420, y2: 300 }
        ];

        let particles = [];

        function addScore(pts, x, y) {
            score += pts;
            document.getElementById('scoreEl').textContent = score;
            // Sparks
            for(let i=0; i<10; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                    life: 20
                });
            }
        }

        // Line collision
        function collideLine(ball, line) {
            let dx = line.x2 - line.x1;
            let dy = line.y2 - line.y1;
            let len = Math.hypot(dx, dy);
            
            let dot = (((ball.x - line.x1) * dx) + ((ball.y - line.y1) * dy)) / (len * len);
            
            let closestX = line.x1 + (dot * dx);
            let closestY = line.y1 + (dot * dy);
            
            // Limit to segment
            if (dot < 0 || dot > 1) return; 

            let distX = ball.x - closestX;
            let distY = ball.y - closestY;
            let dist = Math.hypot(distX, distY);

            if (dist < ball.r) {
                // Resolve
                let nx = distX / dist;
                let ny = distY / dist;
                
                let overlap = ball.r - dist;
                ball.x += nx * overlap;
                ball.y += ny * overlap;

                // Reflect velocity
                let dotV = ball.vx * nx + ball.vy * ny;
                ball.vx = (ball.vx - 2 * dotV * nx) * 0.8;
                ball.vy = (ball.vy - 2 * dotV * ny) * 0.8;
            }
        }

        // Bumper collision
        function collideBumper(ball, bumper) {
            let dx = ball.x - bumper.x;
            let dy = ball.y - bumper.y;
            let dist = Math.hypot(dx, dy);
            if (dist < ball.r + bumper.r) {
                let nx = dx / dist;
                let ny = dy / dist;
                
                let overlap = ball.r + bumper.r - dist;
                ball.x += nx * overlap;
                ball.y += ny * overlap;

                let dotV = ball.vx * nx + ball.vy * ny;
                // Bounce + Force (scaled by DT since it applies per substep)
                ball.vx = (ball.vx - 2 * dotV * nx) + (nx * 3);
                ball.vy = (ball.vy - 2 * dotV * ny) + (ny * 3);
                
                if (bumper.active <= 0) { // Only score once per hit burst
                    addScore(bumper.val, bumper.x, bumper.y);
                    bumper.active = 15;
                }
            }
        }

        // Flipper collision
        function collideFlipper(ball, flipper, isRight) {
            let fx2 = flipper.x + Math.cos(flipper.angle) * flipper.len;
            let fy2 = flipper.y + Math.sin(flipper.angle) * flipper.len;
            
            let line = { x1: flipper.x, y1: flipper.y, x2: fx2, y2: fy2 };
            let dx = line.x2 - line.x1;
            let dy = line.y2 - line.y1;
            let len = Math.hypot(dx, dy);
            
            let dot = (((ball.x - line.x1) * dx) + ((ball.y - line.y1) * dy)) / (len * len);
            if (dot < 0 || dot > 1) return;
            
            let closestX = line.x1 + (dot * dx);
            let closestY = line.y1 + (dot * dy);
            
            let distX = ball.x - closestX;
            let distY = ball.y - closestY;
            let dist = Math.hypot(distX, distY);

            // Thicker hitbox to prevent tunneling
            let thickness = 6;
            if (dist < ball.r + thickness) { 
                let nx = -dy / len;
                let ny = dx / len;
                
                if (distX * nx + distY * ny < 0) {
                    nx = -nx; ny = -ny;
                }

                let overlap = (ball.r + thickness) - dist;
                ball.x += nx * overlap;
                ball.y += ny * overlap;

                let dotV = ball.vx * nx + ball.vy * ny;
                ball.vx = (ball.vx - 2 * dotV * nx) * 0.6;
                ball.vy = (ball.vy - 2 * dotV * ny) * 0.6;
                
                // Add velocity based on flipper angular velocity and distance from hinge
                if (Math.abs(flipper.angularVel) > 0) {
                    let distFromHinge = Math.hypot(closestX - flipper.x, closestY - flipper.y);
                    let forceMag = Math.abs(flipper.angularVel) * distFromHinge * 0.5; // Tuning factor
                    ball.vx += nx * forceMag;
                    ball.vy += ny * forceMag;
                }
            }
        }

        function updatePhysics() {
            // Flipper logic
            let flipSpeed = 0.4 * DT; // radians per substep
            
            let updateFlipper = (f) => {
                let oldAngle = f.angle;
                if (f.up) {
                    f.angle += (f.max > f.rest ? flipSpeed : -flipSpeed);
                } else {
                    f.angle -= (f.max > f.rest ? flipSpeed : -flipSpeed);
                }
                
                // Clamp
                if (f.max > f.rest) {
                    if (f.angle > f.max) f.angle = f.max;
                    if (f.angle < f.rest) f.angle = f.rest;
                } else {
                    if (f.angle < f.max) f.angle = f.max;
                    if (f.angle > f.rest) f.angle = f.rest;
                }
                f.angularVel = f.angle - oldAngle;
            };
            
            updateFlipper(flipperLeft);
            updateFlipper(flipperRight);

            // Ball logic
            ball.vy += GRAVITY;
            ball.vx *= FRICTION;
            ball.vy *= FRICTION;
            
            let speed = Math.hypot(ball.vx, ball.vy);
            if (speed > MAX_SPEED) {
                ball.vx = (ball.vx/speed) * MAX_SPEED;
                ball.vy = (ball.vy/speed) * MAX_SPEED;
            }
            
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Collisions
            for (let b of bumpers) collideBumper(ball, b);
            for (let l of lines) collideLine(ball, l);
            collideFlipper(ball, flipperLeft, false);
            collideFlipper(ball, flipperRight, true);
        }

        function update() {
            for(let i=0; i<SUBSTEPS; i++) {
                updatePhysics();
            }

            // Visual updates
            for(let b of bumpers) { if(b.active > 0) b.active--; }
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                if(p.life <= 0) particles.splice(i, 1);
            }

            // Drain
            if (ball.y > LOGICAL_H + 50) {
                ballsLeft--;
                document.getElementById('ballsEl').textContent = ballsLeft;
                if (ballsLeft <= 0) {
                    loseGame();
                } else {
                    ball = { x: 460, y: 700, vx: 0, vy: -20, r: 10 }; // Plunger
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.scale(scaleX, scaleY);

            // Draw Lines/Walls
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.8)';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = 'var(--wall)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            lines.forEach(l => {
                ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2);
            });
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Draw Bumpers
            bumpers.forEach(b => {
                ctx.fillStyle = b.active > 0 ? '#fff' : 'rgba(255, 0, 255, 0.3)';
                ctx.strokeStyle = 'var(--bumper)';
                ctx.lineWidth = 3;
                ctx.shadowColor = 'var(--bumper)';
                ctx.shadowBlur = b.active > 0 ? 30 : 15;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
                ctx.fill();
                ctx.stroke();
                
                // inner detail
                ctx.fillStyle = b.active > 0 ? 'var(--bumper)' : '#000';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r * 0.4, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // Draw Flippers
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.shadowColor = 'var(--flipper)';
            ctx.shadowBlur = 20;
            
            [flipperLeft, flipperRight].forEach(f => {
                ctx.beginPath();
                ctx.moveTo(f.x, f.y);
                ctx.lineTo(f.x + Math.cos(f.angle)*f.len, f.y + Math.sin(f.angle)*f.len);
                ctx.stroke();
                // Core
                ctx.strokeStyle = 'var(--flipper)';
                ctx.lineWidth = 4;
                ctx.stroke();
            });
            ctx.shadowBlur = 0;

            // Draw Particles
            ctx.fillStyle = '#fff';
            particles.forEach(p => {
                ctx.globalAlpha = p.life / 20;
                ctx.fillRect(p.x, p.y, 3, 3);
            });
            ctx.globalAlpha = 1;

            // Draw Ball
            ctx.fillStyle = 'var(--ball)';
            ctx.shadowColor = 'var(--ball)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        function loop() {
            if(!isRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function loseGame() {
            isRunning = false;
            document.getElementById('final-stats').textContent = `Final Score: ${score}`;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // Input
        window.addEventListener('keydown', e => { 
            if(e.code === 'ArrowLeft' || e.code === 'KeyA') flipperLeft.up = true;
            if(e.code === 'ArrowRight' || e.code === 'KeyD') flipperRight.up = true;
        });
        window.addEventListener('keyup', e => { 
            if(e.code === 'ArrowLeft' || e.code === 'KeyA') flipperLeft.up = false;
            if(e.code === 'ArrowRight' || e.code === 'KeyD') flipperRight.up = false;
        });

        document.getElementById('zone-left').addEventListener('touchstart', e => { e.preventDefault(); flipperLeft.up = true; }, {passive:false});
        document.getElementById('zone-left').addEventListener('touchend', e => { flipperLeft.up = false; });
        document.getElementById('zone-right').addEventListener('touchstart', e => { e.preventDefault(); flipperRight.up = true; }, {passive:false});
        document.getElementById('zone-right').addEventListener('touchend', e => { flipperRight.up = false; });
        document.getElementById('zone-left').addEventListener('mousedown', e => { flipperLeft.up = true; });
        document.getElementById('zone-left').addEventListener('mouseup', e => { flipperLeft.up = false; });
        document.getElementById('zone-right').addEventListener('mousedown', e => { flipperRight.up = true; });
        document.getElementById('zone-right').addEventListener('mouseup', e => { flipperRight.up = false; });

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            score = 0; ballsLeft = 3;
            document.getElementById('scoreEl').textContent = `0`;
            document.getElementById('ballsEl').textContent = `3`;
            
            ball = { x: 460, y: 700, vx: 0, vy: -25, r: 10 }; 
            
            isRunning = true;
            loop();
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
