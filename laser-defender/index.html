<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Laser Defender</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #05020a;
            --player-color: #00f3ff;
            --laser-core: #ffffff;
            --laser-glow: #00f3ff;
            --enemy-color: #ff3366;
            --overheat-color: #ffaa00;
            --text-color: #fff;
            --ui-bg: rgba(0, 0, 0, 0.85);
            --border-color: #00f3ff;
        }

        * { box-sizing: border-box; touch-action: none; }
        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Press Start 2P', monospace; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        #game-container {
            position: relative; border: 2px solid var(--border-color);
            box-shadow: 0 0 20px var(--border-color);
            background-color: var(--bg-color);
        }
        canvas { display: block; }

        #ui-layer {
            position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;
            display:flex; flex-direction:column; justify-content:space-between; padding:15px;
        }
        .hud { display: flex; justify-content: space-between; text-shadow: 0 0 5px var(--text-color); font-size: 14px; z-index: 10; }
        
        .heat-container { width: 100%; height: 10px; background: #222; border: 1px solid var(--overheat-color); margin-top: 10px; border-radius: 5px; overflow: hidden; }
        #heat-fill { height: 100%; width: 0%; background: var(--overheat-color); box-shadow: 0 0 10px var(--overheat-color); transition: width 0.1s, background 0.3s; }

        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: var(--ui-bg); border: 2px solid var(--border-color); padding: 30px;
            text-align: center; pointer-events: auto; box-shadow: 0 0 30px rgba(0,243,255,0.3); z-index: 20; width: 80%; max-width: 450px;
        }
        h1 { color: var(--player-color); text-shadow: 0 0 10px var(--player-color); margin-bottom: 20px; font-size: 20px; line-height: 1.5; }
        p { margin-bottom: 20px; font-size: 10px; color: #ccc; line-height: 1.6; }
        button {
            background: transparent; color: var(--player-color); border: 2px solid var(--player-color);
            padding: 12px 24px; font-family: 'Press Start 2P', monospace; font-size: 14px; cursor: pointer;
            text-shadow: 0 0 10px var(--player-color); box-shadow: 0 0 10px var(--player-color); transition: all 0.2s; text-transform: uppercase;
        }
        button:hover { background: var(--player-color); color: #000; box-shadow: 0 0 30px var(--player-color); }
        .hidden { display: none !important; }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px; pointer-events: none; z-index: 100; opacity: 0.6;
        }
        
        .overheated #heat-fill { background: #ff0044 !important; box-shadow: 0 0 10px #ff0044 !important; }
        .overheated #heat-label { color: #ff0044; }

        /* Left/Right Mobile Controls */
        #mobile-controls {
            position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; display: none;
        }
        .touch-btn {
            width: 80px; height: 80px; border-radius: 50%; border: 2px solid rgba(0, 243, 255, 0.3);
            background: rgba(0,0,0,0.5); pointer-events: auto; display: flex; align-items: center; justify-content: center;
            color: rgba(0,243,255,0.5); font-size: 24px; font-weight: bold; font-family: sans-serif;
        }
        @media (hover: none) and (pointer: coarse) {
            #mobile-controls { display: flex; }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-layer">
            <div class="hud">
                <span id="scoreEl">SCORE: 0</span>
                <span id="livesEl">SHIELD: 100%</span>
            </div>
            <div style="font-size: 10px; margin-top: 10px;" id="heat-label">HEAT LEVEL</div>
            <div class="heat-container" id="heat-bar-wrap">
                <div id="heat-fill"></div>
            </div>
        </div>
        <div id="mobile-controls">
            <div class="touch-btn" id="btn-left">&lt;</div>
            <div class="touch-btn" id="btn-right">&gt;</div>
        </div>
        <div id="start-screen" class="modal">
            <h1>LASER DEFENDER</h1>
            <p>ROAST THE ALIEN FLEET.<br><br>HOLD [SPACE] OR [TOUCH] TO FIRE SUSTAINED BEAM. WATCH YOUR HEAT METER.</p>
            <button id="start-btn">ENGAGE LASER</button>
        </div>
        <div id="game-over-screen" class="modal hidden">
            <h1 style="color: #ff3366; text-shadow: 0 0 10px #ff3366;">SHIELD OFFLINE</h1>
            <p id="final-score">FINAL SCORE: 0</p>
            <button id="restart-btn">REBOOT</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('game-container');
        
        let isGameRunning = false;
        let score = 0, shield = 100;
        let frameCount = 0;

        // Player
        let player = { x: 400, y: 550, width: 40, height: 20, speed: 7 };
        let isFiring = false;
        let heat = 0; // 0 to 100
        let overheated = false;
        let laserWidth = 0; // Used for animation
        
        let keys = { ArrowLeft: false, ArrowRight: false, Space: false, a: false, d: false };
        let touchLeft = false, touchRight = false, touchFire = false;

        // Entities
        let enemies = [];
        let bombs = [];
        let particles = [];
        let bgLines = []; // Moving speed lines for intense feel

        // Setup
        function resize() {
            const ratio = 800/600;
            const h = Math.min(window.innerHeight - 20, 600);
            const w = Math.min(window.innerWidth - 20, h * ratio);
            canvas.style.width = `${w}px`;
            canvas.style.height = `${w}px / ${ratio}`;
            gameContainer.style.width = `${w}px`;
            gameContainer.style.height = `${w}px / ${ratio}`;
        }
        window.addEventListener('resize', resize); resize();

        for(let i=0; i<30; i++) bgLines.push({ x: Math.random()*800, y: Math.random()*600, speed: 2+Math.random()*4, len: 10+Math.random()*30 });

        function createParticles(x, y, color, count, scatter) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random()-0.5)*scatter, vy: (Math.random()-0.5)*scatter,
                    life: 1, color
                });
            }
        }

        function update() {
            frameCount++;

            // Background Lines
            bgLines.forEach(l => {
                l.y += l.speed;
                if(l.y > 600) { l.y = -l.len; l.x = Math.random()*800; }
            });

            // Input
            let moveLeft = keys.ArrowLeft || keys.a || touchLeft;
            let moveRight = keys.ArrowRight || keys.d || touchRight;
            let tryFire = keys.Space || touchFire;

            if (moveLeft) player.x -= player.speed;
            if (moveRight) player.x += player.speed;
            player.x = Math.max(player.width/2, Math.min(800 - player.width/2, player.x));

            // Laser Logic
            if (tryFire && !overheated && heat < 100) {
                isFiring = true;
                heat += 0.8; // Heat buildup rate
                if (heat >= 100) {
                    overheated = true;
                    isFiring = false;
                    document.getElementById('heat-bar-wrap').classList.add('overheated');
                }
                laserWidth = Math.min(15, laserWidth + 3);
            } else {
                isFiring = false;
                heat = Math.max(0, heat - 0.5); // Cooling rate
                if (heat === 0 && overheated) {
                    overheated = false;
                    document.getElementById('heat-bar-wrap').classList.remove('overheated');
                }
                laserWidth = Math.max(0, laserWidth - 4);
            }
            
            document.getElementById('heat-fill').style.width = `${heat}%`;

            // Spawning Enemies
            if (frameCount % Math.max(20, 60 - Math.floor(score/100)) === 0) {
                enemies.push({
                    x: Math.random() * 700 + 50,
                    y: -30,
                    vx: (Math.random() - 0.5) * 2,
                    vy: 1.5 + Math.random(),
                    hp: 30, // Requires sustained beam to kill
                    width: 30, height: 20
                });
            }

            // Laser Collision & Effects
            let laserImpactY = -10; // Top of screen by default
            if (isFiring || laserWidth > 0) {
                // Find first enemy hit by laser
                let hitEnemy = null;
                let lowestY = -10;

                enemies.forEach(e => {
                    // Check if x bounds intersect laser bounds
                    if (Math.abs(e.x - player.x) < e.width/2 + laserWidth/2 + 5) {
                        if (e.y > lowestY) {
                            lowestY = e.y;
                            hitEnemy = e;
                        }
                    }
                });

                if (hitEnemy) {
                    laserImpactY = hitEnemy.y + hitEnemy.height/2;
                    if (isFiring) {
                        hitEnemy.hp -= 2; // Damage over time
                        createParticles(player.x + (Math.random()-0.5)*10, laserImpactY, 'var(--laser-glow)', 2, 8);
                    }
                } else {
                    laserImpactY = 0;
                }
                
                // Base particles at the ship
                if (isFiring) createParticles(player.x, player.y - 10, 'var(--laser-core)', 1, 3);
            }

            // Update Enemies
            enemies.forEach((e, i) => {
                e.x += e.vx; e.y += e.vy;
                
                // Bounds bounce
                if (e.x < 15 || e.x > 785) e.vx *= -1;

                // Drop bomb
                if (Math.random() < 0.005) {
                    bombs.push({ x: e.x, y: e.y + 10, vy: 4 });
                }

                if (e.hp <= 0) {
                    score += 50;
                    document.getElementById('scoreEl').textContent = `SCORE: ${score}`;
                    createParticles(e.x, e.y, 'var(--enemy-color)', 20, 15);
                    enemies.splice(i, 1);
                } else if (e.y > 620) {
                    enemies.splice(i, 1);
                }
            });

            // Update Bombs
            bombs.forEach((b, i) => {
                b.y += b.vy;
                // Collision with player
                if (b.y > player.y - player.height/2 && Math.abs(b.x - player.x) < player.width/2 + 5) {
                    shield -= 20;
                    document.getElementById('livesEl').textContent = `SHIELD: ${Math.max(0, shield)}%`;
                    createParticles(player.x, player.y, 'var(--enemy-color)', 15, 10);
                    bombs.splice(i, 1);
                    if (shield <= 0) gameOver();
                } else if (b.y > 620) {
                    bombs.splice(i, 1);
                }
            });

            // Particles
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.05;
                if(p.life <= 0) particles.splice(i, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, 800, 600);

            // Bg Lines
            ctx.fillStyle = 'rgba(0, 243, 255, 0.1)';
            bgLines.forEach(l => { ctx.fillRect(l.x, l.y, 1, l.len); });

            ctx.globalCompositeOperation = 'lighter';

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.shadowBlur = 5; ctx.shadowColor = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
            });
            ctx.globalAlpha = 1;

            // Enemies
            ctx.fillStyle = '#000';
            ctx.strokeStyle = 'var(--enemy-color)';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10; ctx.shadowColor = 'var(--enemy-color)';
            enemies.forEach(e => {
                ctx.beginPath();
                ctx.moveTo(e.x - e.width/2, e.y - e.height/2);
                ctx.lineTo(e.x + e.width/2, e.y - e.height/2);
                ctx.lineTo(e.x + e.width/4, e.y + e.height/2);
                ctx.lineTo(e.x - e.width/4, e.y + e.height/2);
                ctx.closePath();
                ctx.fill(); ctx.stroke();
                
                // Damage flash
                if (e.hp < 15) {
                    ctx.fillStyle = 'var(--enemy-color)';
                    ctx.fillRect(e.x - 5, e.y - 5, 10, 10);
                }
            });
            ctx.fillStyle = '#000'; // reset

            // Bombs
            ctx.fillStyle = 'var(--enemy-color)';
            ctx.shadowColor = 'var(--enemy-color)';
            bombs.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
            });

            // Laser Beam (Render if width > 0 for fade out effect)
            if (laserWidth > 0) {
                // Find nearest impact point
                let impactY = 0;
                let hitEnemy = false;
                let lowestY = 0;
                enemies.forEach(e => {
                    if (Math.abs(e.x - player.x) < e.width/2 + laserWidth/2 + 5) {
                        if (e.y > lowestY) { lowestY = e.y + e.height/2; hitEnemy = true; }
                    }
                });
                impactY = hitEnemy ? lowestY : 0;

                // Core
                ctx.fillStyle = 'var(--laser-core)';
                ctx.shadowBlur = 20; ctx.shadowColor = 'var(--laser-glow)';
                ctx.fillRect(player.x - laserWidth/2, impactY, laserWidth, player.y - impactY - player.height/2);
                
                // Glow wrapper
                ctx.fillStyle = 'rgba(0, 243, 255, 0.4)';
                ctx.fillRect(player.x - laserWidth, impactY, laserWidth*2, player.y - impactY - player.height/2);
            }

            // Player Ship
            ctx.shadowBlur = 15; ctx.shadowColor = 'var(--player-color)';
            ctx.fillStyle = 'var(--player-color)';
            // Base
            ctx.fillRect(player.x - player.width/2, player.y - player.height/2 + 10, player.width, 10);
            // Cannon
            ctx.fillRect(player.x - 5, player.y - player.height/2, 10, 15);
            // Overheat warning glow
            if (overheated) {
                ctx.shadowColor = 'var(--overheat-color)';
                ctx.fillStyle = 'var(--overheat-color)';
                ctx.fillRect(player.x - 6, player.y - player.height/2, 12, 15);
            }

            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 0;
        }

        function loop() {
            if(!isGameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Input
        window.addEventListener('keydown', e => { 
            if(keys.hasOwnProperty(e.key)) keys[e.key] = true; 
            if(e.code === 'Space') keys.Space = true;
        });
        window.addEventListener('keyup', e => { 
            if(keys.hasOwnProperty(e.key)) keys[e.key] = false; 
            if(e.code === 'Space') keys.Space = false;
        });

        // Touch handling
        const btnL = document.getElementById('btn-left');
        const btnR = document.getElementById('btn-right');
        
        btnL.addEventListener('touchstart', e => { e.preventDefault(); touchLeft = true; });
        btnL.addEventListener('touchend', e => { e.preventDefault(); touchLeft = false; });
        btnR.addEventListener('touchstart', e => { e.preventDefault(); touchRight = true; });
        btnR.addEventListener('touchend', e => { e.preventDefault(); touchRight = false; });
        
        // Touch anywhere else to fire
        gameContainer.addEventListener('touchstart', e => { 
            if(e.target !== btnL && e.target !== btnR) touchFire = true; 
        }, {passive:false});
        gameContainer.addEventListener('touchend', e => { 
            if(e.target !== btnL && e.target !== btnR) touchFire = false; 
        });

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            score = 0; shield = 100; heat = 0; frameCount = 0;
            player.x = 400; overheated = false;
            enemies = []; bombs = []; particles = [];
            
            document.getElementById('scoreEl').textContent = `SCORE: 0`;
            document.getElementById('livesEl').textContent = `SHIELD: 100%`;
            document.getElementById('heat-fill').style.width = `0%`;
            document.getElementById('heat-bar-wrap').classList.remove('overheated');
            
            isGameRunning = true;
            loop();
        }

        function gameOver() {
            isGameRunning = false;
            document.getElementById('final-score').textContent = `FINAL SCORE: ${score}`;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
