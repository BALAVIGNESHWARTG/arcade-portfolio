<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laser Defender - Overdrive</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap');

        :root {
            --bg: #050505;
            --laser-core: #ffffff;
            --laser-glow: #00e5ff;
            --heat-low: #00e5ff;
            --heat-high: #ff003c;
            --hud-color: #00e5ff;
            --danger-color: #ff003c;
            --cockpit-bg: #111;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0; padding: 0; background-color: var(--bg); color: var(--hud-color);
            font-family: 'Orbitron', sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
            perspective: 800px;
        }

        #game-container {
            position: relative; width: 100%; height: 100%; max-width: 800px; max-height: 1000px;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,229,255,0.1);
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Heavy Cockpit UI Overlay */
        .cockpit {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;
            background: 
                linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 15%, transparent 85%, rgba(0,0,0,0.9) 100%),
                linear-gradient(to right, rgba(0,0,0,0.8) 0%, transparent 10%, transparent 90%, rgba(0,0,0,0.8) 100%);
        }
        
        .hud-top {
            position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between;
            font-size: 24px; font-weight: 900; text-shadow: 0 0 10px var(--hud-color);
        }

        /* Heat Gauge */
        .heat-container {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 300px; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid var(--hud-color);
            border-radius: 10px; overflow: hidden; box-shadow: 0 0 15px rgba(0,229,255,0.3);
        }
        #heat-bar {
            height: 100%; width: 0%; background: var(--heat-low);
            transition: width 0.1s linear, background 0.3s;
            box-shadow: 0 0 10px currentColor;
        }
        .heat-label {
            position: absolute; bottom: 65px; left: 50%; transform: translateX(-50%);
            font-size: 14px; letter-spacing: 2px;
        }
        
        /* Warning Overlay */
        #warning-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(255,0,60,0.1); box-shadow: inset 0 0 100px rgba(255,0,60,0.5);
            z-index: 9; opacity: 0; pointer-events: none; transition: opacity 0.1s;
        }
        .overheat-text {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            color: var(--danger-color); font-size: 40px; font-weight: 900;
            text-shadow: 0 0 20px var(--danger-color); opacity: 0; pointer-events: none; z-index: 20;
        }

        /* Modals */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10,10,20,0.95); border: 2px solid var(--hud-color); padding: 40px;
            text-align: center; box-shadow: 0 0 40px rgba(0,229,255,0.4); z-index: 30;
            border-radius: 10px; min-width: 300px; pointer-events: auto;
        }
        h1 { color: var(--hud-color); margin-top: 0; font-size: 32px; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 15px var(--hud-color); }
        p { color: #aaa; line-height: 1.5; font-family: sans-serif; font-size: 14px; margin-bottom: 30px; }
        button {
            background: transparent; color: var(--hud-color); border: 2px solid var(--hud-color);
            padding: 15px 30px; font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: 0.3s; text-transform: uppercase; border-radius: 5px;
        }
        button:hover { background: var(--hud-color); color: #000; box-shadow: 0 0 20px var(--hud-color); }
        .hidden { display: none !important; }

        /* Scanlines */
        .scanlines {
            position: absolute; top:0; left:0; width:100%; height:100%; z-index: 15; pointer-events: none;
            background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.2) 51%);
            background-size: 100% 4px; opacity: 0.5;
        }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            .hud-top { font-size: 18px; }
            .heat-container { width: 80%; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="cockpit"></div>
        <div class="scanlines"></div>
        <div id="warning-overlay"></div>
        <div id="overheat-text" class="overheat-text">SYSTEM OVERHEAT</div>
        
        <div class="hud-top">
            <div id="scoreEl">SCORE: 00000</div>
            <div id="waveEl">WAVE: 01</div>
        </div>
        
        <div class="heat-label">THERMAL CORE STATUS</div>
        <div class="heat-container">
            <div id="heat-bar"></div>
        </div>

        <div id="start-screen" class="modal">
            <h1>LASER DEFENDER</h1>
            <p><strong>ENGAGE OVERDRIVE.</strong><br><br>DRAG/MOVE MOUSE to aim your ship.<br>HOLD CLICK/TOUCH to fire the sustained heavy beam.<br>Do not let the Thermal Core reach 100%.</p>
            <button id="start-btn">INITIALIZE</button>
        </div>
        
        <div id="game-over-screen" class="modal hidden">
            <h1 style="color:var(--danger-color); text-shadow:0 0 15px var(--danger-color); border-color:var(--danger-color);">HULL BREACH</h1>
            <p id="final-score">FINAL SCORE: 0</p>
            <button id="restart-btn" style="color:var(--danger-color); border-color:var(--danger-color);">REBOOT SYSTEMS</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        let width, height;
        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game State
        let isRunning = false;
        let score = 0;
        let wave = 1;
        let frameCount = 0;
        let screenShake = 0;

        // Player / Ship Mechanics
        let ship = { x: width/2, y: height - 100, radius: 20 };
        let isFiring = false;
        let targetX = width/2;
        
        // Heat System
        let heat = 0;
        const HEAT_MAX = 100;
        let overheated = false;

        // Entities
        let enemies = [];
        let particles = [];
        let stars = [];

        // Setup Stars (Parallax)
        for(let i=0; i<100; i++) {
            stars.push({
                x: Math.random() * width, y: Math.random() * height,
                size: Math.random() * 2 + 1, speed: Math.random() * 3 + 1
            });
        }

        // DOM Elements
        const scoreEl = document.getElementById('scoreEl');
        const waveEl = document.getElementById('waveEl');
        const heatBar = document.getElementById('heat-bar');
        const warningOverlay = document.getElementById('warning-overlay');
        const overheatText = document.getElementById('overheat-text');
        
        // Input Handling
        function handleMove(e) {
            if(!isRunning) return;
            let rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            targetX = clientX - rect.left;
        }
        function handleDown(e) { if(isRunning && !overheated) isFiring = true; }
        function handleUp(e) { isFiring = false; }

        container.addEventListener('mousemove', handleMove);
        container.addEventListener('mousedown', handleDown);
        container.addEventListener('mouseup', handleUp);
        container.addEventListener('mouseleave', handleUp);

        container.addEventListener('touchmove', e => { e.preventDefault(); handleMove(e); }, {passive: false});
        container.addEventListener('touchstart', e => { e.preventDefault(); handleMove(e); handleDown(e); }, {passive: false});
        container.addEventListener('touchend', e => { e.preventDefault(); handleUp(e); }, {passive: false});

        function createExplosion(x, y, color, size) {
            for(let i=0; i<size; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
                    life: 1, maxLife: Math.random() * 0.5 + 0.5,
                    color: color, size: Math.random() * 4 + 2
                });
            }
            screenShake = Math.max(screenShake, size / 2);
        }

        function spawnWave() {
            let numEnemies = 5 + wave * 2;
            for(let i=0; i<numEnemies; i++) {
                enemies.push({
                    x: Math.random() * (width - 60) + 30,
                    y: -50 - (Math.random() * 500),
                    vx: (Math.random() - 0.5) * 2,
                    vy: Math.random() * 1 + 1 + (wave * 0.2),
                    hp: 50 + (wave * 10),
                    maxHp: 50 + (wave * 10),
                    radius: 20 + Math.random() * 10
                });
            }
        }

        function update() {
            frameCount++;

            // Ship Movement (smooth follow)
            targetX = Math.max(30, Math.min(width - 30, targetX));
            ship.x += (targetX - ship.x) * 0.2;

            // Stars
            stars.forEach(s => {
                s.y += s.speed;
                if(s.y > height) { s.y = -10; s.x = Math.random() * width; }
            });

            // Heat Management
            if (isFiring && !overheated) {
                heat += 0.8;
                if (heat >= HEAT_MAX) {
                    heat = HEAT_MAX;
                    overheated = true;
                    isFiring = false;
                    screenShake = 20;
                    overheatText.style.opacity = 1;
                    overheatText.style.animation = 'flicker 0.1s infinite';
                }
            } else {
                heat -= overheated ? 0.4 : 0.6; // Cools slower when overheated
                if (heat <= 0) {
                    heat = 0;
                    if(overheated) {
                        overheated = false;
                        overheatText.style.opacity = 0;
                        overheatText.style.animation = 'none';
                    }
                }
            }

            // Update UI
            let heatPercent = (heat / HEAT_MAX) * 100;
            heatBar.style.width = `${heatPercent}%`;
            
            if(heatPercent > 75) {
                heatBar.style.background = 'var(--heat-high)';
                warningOverlay.style.opacity = Math.sin(frameCount * 0.2) * 0.5 + 0.5;
            } else {
                heatBar.style.background = 'var(--heat-low)';
                warningOverlay.style.opacity = 0;
            }

            // Laser Collision Logic
            let laserRect = { x: ship.x - 15, width: 30 }; // laser width
            
            if (isFiring) {
                // Generate laser sparks
                particles.push({
                    x: ship.x + (Math.random()-0.5)*20, y: ship.y - 20,
                    vx: (Math.random()-0.5)*2, vy: -(Math.random()*5 + 5),
                    life: 1, maxLife: 1, color: '#00e5ff', size: 3
                });
                screenShake = 2; // constant rumble while firing
            }

            // Enemies
            for(let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.x += e.vx;
                e.y += e.vy;
                
                // Bounce off walls
                if(e.x < e.radius || e.x > width - e.radius) e.vx *= -1;

                // Hit by laser
                if (isFiring) {
                    if (e.x + e.radius > laserRect.x && e.x - e.radius < laserRect.x + laserRect.width) {
                        if (e.y < ship.y) {
                            e.hp -= 2; // Damage rate
                            // Hit sparks
                            particles.push({
                                x: e.x + (Math.random()-0.5)*e.radius, y: e.y + e.radius,
                                vx: (Math.random()-0.5)*5, vy: Math.random()*5,
                                life: 1, maxLife: 0.5, color: '#ffaa00', size: 4
                            });
                        }
                    }
                }

                // Enemy Death
                if (e.hp <= 0) {
                    createExplosion(e.x, e.y, '#ff003c', 30);
                    score += 100;
                    scoreEl.textContent = `SCORE: ${score.toString().padStart(5, '0')}`;
                    enemies.splice(i, 1);
                    continue;
                }

                // Player Hit / Base breach
                if (e.y > height + e.radius) {
                    gameOver();
                } else if (Math.hypot(ship.x - e.x, ship.y - e.y) < ship.radius + e.radius) {
                    createExplosion(ship.x, ship.y, '#00e5ff', 50);
                    gameOver();
                }
            }

            // Wave Progression
            if(enemies.length === 0) {
                wave++;
                waveEl.textContent = `WAVE: ${wave.toString().padStart(2, '0')}`;
                spawnWave();
            }

            // Particles
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= 1/60; // Assuming 60fps
                if(p.life <= 0) particles.splice(i, 1);
            }
            
            // Screen shake decay
            if(screenShake > 0) screenShake *= 0.9;
            if(screenShake < 0.1) screenShake = 0;
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            ctx.save();
            if (screenShake > 0) {
                let dx = (Math.random() - 0.5) * screenShake;
                let dy = (Math.random() - 0.5) * screenShake;
                ctx.translate(dx, dy);
            }

            // Draw Stars
            ctx.fillStyle = '#fff';
            stars.forEach(s => {
                ctx.globalAlpha = (s.y / height); // fade in at top
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1;

            ctx.globalCompositeOperation = 'lighter';

            // Draw Laser Beam
            if (isFiring) {
                let pulse = Math.random() * 5;
                
                // Outer Glow
                ctx.fillStyle = 'rgba(0, 229, 255, 0.3)';
                 
                ctx.fillRect(ship.x - 20 - pulse/2, 0, 40 + pulse, ship.y - 20);
                
                // Inner Core
                ctx.fillStyle = 'var(--laser-core)';
                
                ctx.fillRect(ship.x - 8 - pulse/4, 0, 16 + pulse/2, ship.y - 20);
            }

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / p.maxLife;
                 
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1;

            // Draw Enemies
            enemies.forEach(e => {
                // Alien shape (hexagon-ish)
                ctx.fillStyle = '#111';
                ctx.strokeStyle = 'var(--danger-color)';
                ctx.lineWidth = 3;
                 
                
                ctx.beginPath();
                for(let i=0; i<6; i++) {
                    let angle = i * Math.PI / 3 + (frameCount * 0.05);
                    let px = e.x + Math.cos(angle) * e.radius;
                    let py = e.y + Math.sin(angle) * e.radius;
                    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
                }
                ctx.closePath();
                ctx.fill(); ctx.stroke();
                
                // HP Bar
                ctx.fillStyle = 'rgba(255,0,60,0.3)';
                
                ctx.fillRect(e.x - e.radius, e.y - e.radius - 10, e.radius*2, 4);
                ctx.fillStyle = 'var(--danger-color)';
                ctx.fillRect(e.x - e.radius, e.y - e.radius - 10, (e.radius*2) * (e.hp/e.maxHp), 4);
            });

            // Draw Player Ship
            ctx.fillStyle = '#111';
            ctx.strokeStyle = 'var(--hud-color)';
            ctx.lineWidth = 3;
             
            
            // Cockpit shape
            ctx.beginPath();
            ctx.moveTo(ship.x, ship.y - 25); // Nose
            ctx.lineTo(ship.x + 25, ship.y + 20); // Right Wing
            ctx.lineTo(ship.x + 10, ship.y + 15); // Right Engine
            ctx.lineTo(ship.x - 10, ship.y + 15); // Left Engine
            ctx.lineTo(ship.x - 25, ship.y + 20); // Left Wing
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            
            // Engine thrust
            ctx.fillStyle = '#00e5ff';
            
            ctx.beginPath();
            ctx.moveTo(ship.x - 10, ship.y + 18);
            ctx.lineTo(ship.x, ship.y + 35 + Math.random()*15);
            ctx.lineTo(ship.x + 10, ship.y + 18);
            ctx.fill();

            ctx.globalCompositeOperation = 'source-over';
            
            ctx.restore();
        }

        function loop() {
            if(!isRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            score = 0;
            wave = 1;
            heat = 0;
            overheated = false;
            isFiring = false;
            enemies = [];
            particles = [];
            scoreEl.textContent = `SCORE: 00000`;
            waveEl.textContent = `WAVE: 01`;
            warningOverlay.style.opacity = 0;
            overheatText.style.opacity = 0;
            
            spawnWave();
            isRunning = true;
            loop();
        }

        function gameOver() {
            isRunning = false;
            document.getElementById('final-score').textContent = `FINAL SCORE: ${score}`;
            document.getElementById('game-over-screen').classList.remove('hidden');
            warningOverlay.style.opacity = 1;
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        // Add CSS keyframe for flicker
        const style = document.createElement('style');
        style.innerHTML = `@keyframes flicker { 0% {opacity:1;} 50% {opacity:0.2;} 100% {opacity:1;} }`;
        document.head.appendChild(style);
    </script>
</body>
</html>
