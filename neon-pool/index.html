<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Pool</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&display=swap');

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0; padding: 0;
            background-color: #0b0213;
            height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Audiowide', cursive;
            overflow: hidden;
            color: #fff;
        }

        #game-container {
            position: relative;
            width: 100%; max-width: 800px; aspect-ratio: 16/9; max-height: 800px;
            background: #0b0213;
            box-shadow: 0 0 50px rgba(0,255,255,0.1);
        }

        canvas { display: block; width: 100%; height: 100%; }

        .ui-layer {
            position: absolute; top: -40px; left: 0; width: 100%;
            display: flex; justify-content: space-between;
            font-size: 24px; color: #0ff; text-shadow: 0 0 10px #0ff;
        }

        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 2, 19, 0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
            z-index: 10; text-align: center;
        }
        .modal.active { opacity: 1; pointer-events: auto; }
        
        .modal h1 { font-size: 50px; margin: 0 0 10px 0; color: #f0f; text-shadow: 0 0 20px #f0f;}
        .modal p { font-size: 18px; margin-bottom: 40px; color: #fff;}
        
        .btn {
            background: transparent; color: #0ff; border: 2px solid #0ff;
            padding: 15px 40px; font-family: 'Audiowide', cursive; font-size: 20px;
            cursor: pointer; text-transform: uppercase; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,255,255,0.4), inset 0 0 10px rgba(0,255,255,0.2);
            transition: all 0.2s;
        }
        .btn:active { background: #0ff; color: #000; box-shadow: 0 0 30px #0ff; }

    </style>
</head>
<body>

    <div style="position:relative; width: 100%; max-width: 800px; aspect-ratio:16/9;">
        <div class="ui-layer">
            <div>SUNK: <span id="score">0</span>/6</div>
            <div>SHOTS: <span id="shots">0</span></div>
        </div>
        
        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <div class="modal" id="menu">
                <h1>NEON POOL</h1>
                <p>Drag from the white ball to aim.<br>Sink all colored balls.</p>
                <button class="btn" id="start-btn">RACK EM</button>
            </div>
            
            <div class="modal" id="game-over">
                <h1 id="go-title">TABLE CLEARED</h1>
                <p>Total Shots: <span id="final-shots">0</span></p>
                <button class="btn" id="restart-btn">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        const scoreEl = document.getElementById('score');
        const shotsEl = document.getElementById('shots');
        const menuEl = document.getElementById('menu');
        const gameOverEl = document.getElementById('game-over');
        
        let cw, ch;
        function resize() {
            cw = container.clientWidth;
            ch = container.clientHeight;
            canvas.width = cw;
            canvas.height = ch;
            initTable(); // Redraw static parts if paused
        }
        window.addEventListener('resize', resize);

        // Physics Constants
        const FRICTION = 0.985;
        const MIN_VELOCITY = 5; // px/s to stop completely
        const BALL_RADIUS = 12;
        const POCKET_RADIUS = 24;
        
        let isPlaying = false;
        let lastTime = 0;
        let score = 0;
        let shots = 0;
        
        let balls = [];
        let pockets = [];
        let bounds = { x: 30, y: 30, w: 0, h: 0 };
        
        // Input state
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };

        function initTable() {
            bounds.w = cw - 60;
            bounds.h = ch - 60;
            
            pockets = [
                {x: bounds.x, y: bounds.y},
                {x: bounds.x + bounds.w/2, y: bounds.y - 5}, // Side pocket slightly offset
                {x: bounds.x + bounds.w, y: bounds.y},
                {x: bounds.x, y: bounds.y + bounds.h},
                {x: bounds.x + bounds.w/2, y: bounds.y + bounds.h + 5},
                {x: bounds.x + bounds.w, y: bounds.y + bounds.h}
            ];
        }

        function spawnBalls() {
            balls = [];
            // Cue ball
            balls.push({ id: 0, x: bounds.x + bounds.w * 0.25, y: bounds.y + bounds.h / 2, vx: 0, vy: 0, color: '#fff', glow: '#fff' });
            
            // Triangle of 6 balls (3 cyan, 3 magenta)
            let startX = bounds.x + bounds.w * 0.7;
            let startY = bounds.y + bounds.h / 2;
            let spacing = BALL_RADIUS * 2.1;
            
            let colors = [
                {c: '#0ff', g: '#0ff'}, {c: '#f0f', g: '#f0f'},
                {c: '#0ff', g: '#0ff'}, {c: '#f0f', g: '#f0f'},
                {c: '#0ff', g: '#0ff'}, {c: '#f0f', g: '#f0f'}
            ];
            
            let idx = 0;
            // 3 columns: 1, 2, 3
            for (let col = 0; col < 3; col++) {
                for (let row = 0; row <= col; row++) {
                    let bx = startX + col * spacing * Math.cos(Math.PI/6);
                    let by = startY + (row - col/2) * spacing;
                    balls.push({ id: idx+1, x: bx, y: by, vx: 0, vy: 0, color: colors[idx].c, glow: colors[idx].g });
                    idx++;
                }
            }
        }

        function initGame() {
            resize(); // sets cw, ch, bounds
            score = 0;
            shots = 0;
            scoreEl.textContent = score;
            shotsEl.textContent = shots;
            
            spawnBalls();
            
            isPlaying = true;
            menuEl.classList.remove('active');
            gameOverEl.classList.remove('active');
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        // Input Handling
        function getMousePos(e) {
            let rect = canvas.getBoundingClientRect();
            if (e.touches) {
                return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
            }
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function isBallsMoving() {
            return balls.some(b => Math.abs(b.vx) > 0 || Math.abs(b.vy) > 0);
        }

        function handlePointerDown(e) {
            if (!isPlaying || isBallsMoving()) return;
            let pos = getMousePos(e);
            let cue = balls[0];
            if (!cue) return;
            
            let dx = pos.x - cue.x;
            let dy = pos.y - cue.y;
            // Allow grabbing anywhere near cue ball
            if (Math.sqrt(dx*dx + dy*dy) < 50) {
                isDragging = true;
                dragStart = pos;
                dragCurrent = pos;
            }
        }

        function handlePointerMove(e) {
            if (!isDragging) return;
            dragCurrent = getMousePos(e);
        }

        function handlePointerUp(e) {
            if (!isDragging) return;
            isDragging = false;
            
            let cue = balls[0];
            if (!cue) return;
            
            let dx = cue.x - dragCurrent.x;
            let dy = cue.y - dragCurrent.y;
            
            // Multiply drag distance by power factor
            cue.vx = dx * 8;
            cue.vy = dy * 8;
            
            // Cap max speed
            let speed = Math.sqrt(cue.vx*cue.vx + cue.vy*cue.vy);
            if (speed > 2000) {
                cue.vx = (cue.vx / speed) * 2000;
                cue.vy = (cue.vy / speed) * 2000;
            }
            
            if (speed > 50) {
                shots++;
                shotsEl.textContent = shots;
            }
        }

        container.addEventListener('mousedown', handlePointerDown);
        container.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);
        
        container.addEventListener('touchstart', e => {
            // Fix: Only preventDefault for game canvas interaction, not for modal buttons
            if (e.target.tagName !== 'BUTTON') {
                e.preventDefault();
                handlePointerDown(e);
            }
        }, {passive: false});
        container.addEventListener('touchmove', e => { e.preventDefault(); handlePointerMove(e); }, {passive: false});
        window.addEventListener('touchend', handlePointerUp);

        document.getElementById('start-btn').addEventListener('click', initGame);
        document.getElementById('restart-btn').addEventListener('click', initGame);

        // Physics
        function circleIntersect(b1, b2) {
            let dx = b2.x - b1.x;
            let dy = b2.y - b1.y;
            let distSq = dx*dx + dy*dy;
            let radSq = (BALL_RADIUS*2)*(BALL_RADIUS*2);
            return distSq < radSq;
        }

        function resolveCollision(b1, b2) {
            let dx = b2.x - b1.x;
            let dy = b2.y - b1.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist === 0) { dx = 1; dy = 0; dist = 1; } // prevent NaN
            
            // Minimum translation distance to push balls apart
            let overlap = (BALL_RADIUS * 2) - dist;
            let nx = dx / dist;
            let ny = dy / dist;
            
            b1.x -= nx * overlap / 2;
            b1.y -= ny * overlap / 2;
            b2.x += nx * overlap / 2;
            b2.y += ny * overlap / 2;

            // Elastic collision (1D collision along normal)
            let kx = (b1.vx - b2.vx);
            let ky = (b1.vy - b2.vy);
            
            // Vector projection
            let p = 2.0 * (nx * kx + ny * ky) / 2.0; // mass=1
            
            b1.vx = b1.vx - p * nx;
            b1.vy = b1.vy - p * ny;
            b2.vx = b2.vx + p * nx;
            b2.vy = b2.vy + p * ny;
        }

        function update(dt) {
            // Apply physics steps
            const substeps = 4;
            const sdt = dt / substeps;
            
            for (let s = 0; s < substeps; s++) {
                // Update pos
                for (let i = 0; i < balls.length; i++) {
                    let b = balls[i];
                    b.x += b.vx * sdt;
                    b.y += b.vy * sdt;
                    
                    // Friction
                    b.vx *= Math.pow(FRICTION, sdt * 60);
                    b.vy *= Math.pow(FRICTION, sdt * 60);
                    
                    if (Math.abs(b.vx) < MIN_VELOCITY) b.vx = 0;
                    if (Math.abs(b.vy) < MIN_VELOCITY) b.vy = 0;

                    // Wall Collisions
                    if (b.x - BALL_RADIUS < bounds.x) {
                        b.x = bounds.x + BALL_RADIUS; b.vx *= -0.8;
                    } else if (b.x + BALL_RADIUS > bounds.x + bounds.w) {
                        b.x = bounds.x + bounds.w - BALL_RADIUS; b.vx *= -0.8;
                    }
                    
                    if (b.y - BALL_RADIUS < bounds.y) {
                        b.y = bounds.y + BALL_RADIUS; b.vy *= -0.8;
                    } else if (b.y + BALL_RADIUS > bounds.y + bounds.h) {
                        b.y = bounds.y + bounds.h - BALL_RADIUS; b.vy *= -0.8;
                    }
                }

                // Ball-Ball Collisions
                for (let i = 0; i < balls.length; i++) {
                    for (let j = i + 1; j < balls.length; j++) {
                        if (circleIntersect(balls[i], balls[j])) {
                            resolveCollision(balls[i], balls[j]);
                        }
                    }
                }
            }

            // Check Pockets
            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                let sunk = false;
                for (let p of pockets) {
                    let dx = b.x - p.x;
                    let dy = b.y - p.y;
                    if (dx*dx + dy*dy < POCKET_RADIUS*POCKET_RADIUS) {
                        sunk = true;
                        break;
                    }
                }
                
                if (sunk) {
                    if (b.id === 0) {
                        // Scratch (Cue ball)
                        b.vx = 0; b.vy = 0;
                        b.x = bounds.x + bounds.w * 0.25;
                        b.y = bounds.y + bounds.h / 2;
                    } else {
                        // Colored ball sunk
                        balls.splice(i, 1);
                        score++;
                        scoreEl.textContent = score;
                        if (score >= 6) {
                            isPlaying = false;
                            document.getElementById('final-shots').textContent = shots;
                            gameOverEl.classList.add('active');
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, cw, ch);

            // Table Glow Base
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(bounds.x, bounds.y, bounds.w, bounds.h);
            
            // Grid lines on table for sci-fi look
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for(let i=bounds.x; i<bounds.x+bounds.w; i+=40) { ctx.beginPath(); ctx.moveTo(i, bounds.y); ctx.lineTo(i, bounds.y+bounds.h); ctx.stroke(); }
            for(let i=bounds.y; i<bounds.y+bounds.h; i+=40) { ctx.beginPath(); ctx.moveTo(bounds.x, i); ctx.lineTo(bounds.x+bounds.w, i); ctx.stroke(); }

            // Table Edges (Neon)
            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#0ff';
            ctx.strokeRect(bounds.x, bounds.y, bounds.w, bounds.h);
            ctx.shadowBlur = 0;

            // Pockets
            ctx.fillStyle = '#000';
            for (let p of pockets) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, POCKET_RADIUS, 0, Math.PI*2);
                ctx.fill();
                
                // Pocket glow ring
                ctx.strokeStyle = '#f0f';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#f0f';
                ctx.beginPath();
                ctx.arc(p.x, p.y, POCKET_RADIUS - 2, 0, Math.PI*2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Aiming line
            let cue = balls[0];
            if (isDragging && cue) {
                let dx = dragCurrent.x - cue.x;
                let dy = dragCurrent.y - cue.y;
                let power = Math.min(200, Math.sqrt(dx*dx + dy*dy));
                
                if (power > 10) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    // Draw line in opposite direction of drag
                    let dirX = -dx / Math.sqrt(dx*dx + dy*dy);
                    let dirY = -dy / Math.sqrt(dx*dx + dy*dy);
                    ctx.moveTo(cue.x + dirX * BALL_RADIUS, cue.y + dirY * BALL_RADIUS);
                    ctx.lineTo(cue.x + dirX * power * 3, cue.y + dirY * power * 3);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            // Balls
            for (let b of balls) {
                // Ball core
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(b.x, b.y, BALL_RADIUS, 0, Math.PI*2);
                ctx.fill();
                
                // Color overlay
                ctx.fillStyle = b.color;
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                ctx.arc(b.x, b.y, BALL_RADIUS, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1;

                // Glow
                ctx.strokeStyle = b.glow;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = b.glow;
                ctx.beginPath();
                ctx.arc(b.x, b.y, BALL_RADIUS, 0, Math.PI*2);
                ctx.stroke();
                ctx.shadowBlur = 0;
                
                // Motion blur/trail hint if moving fast
                let speedSq = b.vx*b.vx + b.vy*b.vy;
                if (speedSq > 5000) {
                    ctx.strokeStyle = b.glow;
                    ctx.globalAlpha = 0.3;
                    ctx.lineWidth = BALL_RADIUS*1.5;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(b.x, b.y);
                    ctx.lineTo(b.x - b.vx*0.05, b.y - b.vy*0.05);
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }
            }
        }

        function gameLoop(timestamp) {
            if (!isPlaying) return;
            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            if (dt > 0.1) dt = 0.1;

            update(dt);
            draw();

            requestAnimationFrame(gameLoop);
        }

        // Show menu
        resize();
        menuEl.classList.add('active');
        draw();
    </script>
</body>
</html>
