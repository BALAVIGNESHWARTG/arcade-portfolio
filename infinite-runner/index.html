<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Runner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Righteous&display=swap');

        * { box-sizing: border-box; touch-action: none; user-select: none; }
        
        body {
            margin: 0; padding: 0;
            background-color: #0b0213;
            color: #ff007f;
            font-family: 'Righteous', cursive;
            display: flex;
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 2px solid #00ffff;
        }

        .title { font-size: 28px; color: #00ffff; text-shadow: 0 0 10px #00ffff; letter-spacing: 2px; }
        .score-box { font-size: 24px; color: #ff007f; text-shadow: 0 0 10px #ff007f; }

        #game-container {
            flex: 1;
            width: 100%;
            position: relative;
            background: linear-gradient(0deg, #1b0033 0%, #300055 20%, #ff007f 40%, #000000 60%);
            overflow: hidden;
        }

        /* Sun */
        .sun {
            position: absolute;
            width: 200px;
            height: 200px;
            background: linear-gradient(180deg, #ffd700 0%, #ff007f 100%);
            border-radius: 50%;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 50px #ff007f;
            z-index: 1;
        }

        /* Scanlines */
        .sun::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(180deg, transparent, transparent 5px, rgba(0,0,0,0.5) 6px, rgba(0,0,0,0.5) 10px);
            border-radius: 50%;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 20;
        }

        #start-screen, #game-over { display: none; }

        .overlay h1 { font-size: 60px; margin-bottom: 10px; color: #00ffff; text-shadow: 0 0 20px #00ffff; }
        .overlay p { font-size: 24px; margin-bottom: 30px; color: #fff; }

        button {
            background: rgba(255, 0, 127, 0.2);
            border: 2px solid #ff007f;
            color: #ff007f;
            font-family: inherit;
            padding: 15px 40px;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            box-shadow: inset 0 0 10px #ff007f;
        }

        button:hover {
            background: #ff007f;
            color: #000;
            box-shadow: 0 0 20px #ff007f;
        }

        #floor {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 30%;
            background: #110022;
            border-top: 3px solid #00ffff;
            box-shadow: 0 -5px 20px rgba(0, 255, 255, 0.5);
            z-index: 1;
        }

    </style>
</head>
<body>

    <header>
        <div class="title">NEON RUNNER</div>
        <div class="score-box">SCORE: <span id="score">0</span></div>
    </header>

    <div id="game-container">
        <div class="sun"></div>
        <div id="floor"></div>
        <canvas id="gameCanvas"></canvas>
        
        <div class="overlay" id="start-screen" style="display:flex;">
            <h1>NEON RUNNER</h1>
            <p>Tap / Click / Space to Jump (Double Jump Enabled)</p>
            <button onclick="startGame()">RUN</button>
        </div>

        <div class="overlay" id="game-over">
            <h1 style="color:#ff007f; text-shadow:0 0 20px #ff007f;">CRASHED</h1>
            <p>Distance: <span id="final-score">0</span> m</p>
            <button onclick="startGame()">RETRY</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over');

        let animationId;
        let isGameRunning = false;
        
        // Game state
        let score = 0;
        let speed = 8;
        let frameCount = 0;
        let floorY = 0;

        // Player
        const player = {
            x: 100,
            y: 0,
            w: 40,
            h: 60,
            vy: 0,
            gravity: 0.8,
            jumpPower: -15,
            jumpCount: 0,
            maxJumps: 2
        };

        // Obstacles & Grid
        let obstacles = [];
        let gridOffset = 0;
        let particles = [];

        function resizeCanvas() {
            let container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            floorY = canvas.height * 0.7; // matches CSS 30% height
            
            if(!isGameRunning && player.y === 0) {
                player.y = floorY - player.h;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function jump() {
            if(!isGameRunning) return;
            if(player.jumpCount < player.maxJumps) {
                player.vy = player.jumpPower;
                player.jumpCount++;
                createParticles(player.x + player.w/2, player.y + player.h, '#00ffff', 5);
            }
        }

        function spawnObstacle() {
            let h = Math.random() * 40 + 30; // 30 to 70 height
            let w = Math.random() * 20 + 20; // 20 to 40 width
            
            obstacles.push({
                x: canvas.width,
                y: floorY - h,
                w: w,
                h: h,
                passed: false
            });
        }

        function createParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 1) * 6,
                    life: 1,
                    color: color
                });
            }
        }

        function update() {
            frameCount++;
            
            // Score and Speed
            if(frameCount % 10 === 0) {
                score++;
                scoreEl.innerText = score;
                if(score % 100 === 0) speed += 1;
            }

            // Grid animation (Parallax effect drawn in render)
            gridOffset = (gridOffset + speed) % 100;

            // Player physics
            player.vy += player.gravity;
            player.y += player.vy;

            // Ground collision
            if(player.y >= floorY - player.h) {
                player.y = floorY - player.h;
                player.vy = 0;
                player.jumpCount = 0;
            }

            // Obstacles
            let spawnRate = Math.max(40, 100 - (speed * 3));
            if(frameCount % spawnRate === 0) {
                if(Math.random() > 0.3) spawnObstacle();
            }

            for(let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= speed;

                // Collision
                // Slight hitbox reduction for fairness
                if(player.x + 10 < obs.x + obs.w &&
                   player.x + player.w - 10 > obs.x &&
                   player.y + 10 < obs.y + obs.h &&
                   player.y + player.h > obs.y) {
                    gameOver();
                }

                if(obs.x + obs.w < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // Particles
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if(p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawGrid() {
            // Perspective grid effect on the floor
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 0, 127, 0.4)';
            ctx.lineWidth = 2;

            let horizon = floorY;
            
            // Horizontal lines
            for(let i=0; i<10; i++) {
                let yPos = horizon + Math.pow(i, 1.8) * 5;
                if(yPos > canvas.height) break;
                ctx.beginPath();
                ctx.moveTo(0, yPos);
                ctx.lineTo(canvas.width, yPos);
                ctx.stroke();
            }

            // Vertical lines converging to center
            let centerX = canvas.width / 2;
            for(let i=-20; i<=20; i++) {
                let xTop = centerX + i * 40;
                let xBottom = centerX + i * 150 - (gridOffset * 2 * Math.sign(i)); // basic perspective trick
                
                // Simple straight lines moving left
                let startX = (i * 100) - gridOffset;
                ctx.beginPath();
                ctx.moveTo(startX, horizon);
                ctx.lineTo(startX - 200, canvas.height); // angle left to simulate motion
                ctx.stroke();
            }
            
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawGrid();

            // Player (Cyan Neon)
            ctx.fillStyle = '#00ffff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffff';
            
            // Jetpack/trail effect if jumping
            if(player.vy < 0) {
                ctx.fillRect(player.x, player.y, player.w, player.h);
                ctx.fillStyle = '#fff';
                ctx.fillRect(player.x + 10, player.y + player.h, 20, 10);
            } else {
                ctx.fillRect(player.x, player.y, player.w, player.h);
            }

            // Player trail
            if(player.y >= floorY - player.h && frameCount % 5 === 0) {
                particles.push({
                    x: player.x,
                    y: player.y + player.h,
                    vx: -speed/2,
                    vy: 0,
                    life: 1,
                    color: '#00ffff'
                });
            }

            // Obstacles (Magenta Neon)
            ctx.fillStyle = '#ff007f';
            ctx.shadowColor = '#ff007f';
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            });
            ctx.shadowBlur = 0;

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 4, 4);
            });
            ctx.globalAlpha = 1.0;
        }

        function gameLoop() {
            if(!isGameRunning) return;
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            score = 0;
            scoreEl.innerText = score;
            speed = 8;
            frameCount = 0;
            obstacles = [];
            particles = [];
            gridOffset = 0;
            
            player.y = floorY - player.h;
            player.vy = 0;
            player.jumpCount = 0;

            isGameRunning = true;
            if(animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        function gameOver() {
            isGameRunning = false;
            cancelAnimationFrame(animationId);
            createParticles(player.x + player.w/2, player.y + player.h/2, '#ff007f', 30);
            draw(); 
            
            finalScoreEl.innerText = score;
            setTimeout(() => {
                gameOverScreen.style.display = 'flex';
            }, 500);
        }

        // Input
        window.addEventListener('keydown', (e) => {
            if(e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });

        canvas.addEventListener('mousedown', jump);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        }, {passive: false});

    </script>
</body>
</html>
